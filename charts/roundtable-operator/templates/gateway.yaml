{{- if .Values.gateway.enabled }}
{{- $gw := .Values.gateway }}
{{- $name := printf "%s-gateway" (include "roundtable-operator.fullname" .) }}
{{- $missions := $gw.missions | default dict }}
{{- $runs := $gw.runs | default dict }}
{{- $hooks := $gw.hooks | default dict }}
{{- $saAuth := $gw.serviceAccountAuth | default dict }}
{{- $schedules := $gw.schedules | default dict }}
{{- $scheduleRuns := $gw.scheduleRuns | default dict }}
{{- $secret := include "roundtable-operator.gatewayTokenSecret" . }}
{{- if not $gw.auth.existingSecret }}
{{- /* No Secret supplied: generate a token once and keep it across upgrades. */}}
{{- $key := $gw.auth.secretKey | default "token" }}
{{- $token := randAlphaNum 48 }}
{{- with (lookup "v1" "Secret" .Release.Namespace $secret) }}
{{- if hasKey .data $key }}{{ $token = index .data $key | b64dec }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
    # Keep the token (and the dashboard's access) if the release is removed.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $key }}: {{ $token | quote }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
# Read-only: the gateway looks up Knights, their RoundTables and Chains.
# Tasks go over NATS. The only objects it writes are Missions, run copies
# of opted-in Chains and schedule Triggers (below).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["ai.roundtable.io"]
    resources: ["knights", "roundtables", "chains"]
    verbs: ["get", "list"]
  {{- if or $hooks.enabled $scheduleRuns.enabled }}
  # Webhook Triggers are looked up by name per delivery; schedule run history
  # reads a schedule Trigger by name (the Chains it started are listed above).
  - apiGroups: ["ai.roundtable.io"]
    resources: ["triggers"]
    verbs: ["get"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if $saAuth.enabled }}
---
# ServiceAccount auth: the gateway validates callers' ServiceAccount tokens
# with TokenReviews (gateway.serviceAccountAuth).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-sa-auth
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-sa-auth
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-sa-auth
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- /* Objects the gateway writes: Missions, run copies of opted-in Chains and schedule Triggers. */}}
{{- $writes := list }}
{{- if $missions.enabled }}{{ $writes = append $writes (dict "suffix" "missions" "resource" "missions" "what" "Missions" "verbs" (list "get" "list" "watch" "create" "delete")) }}{{ end }}
{{- if $schedules.enabled }}{{ $writes = append $writes (dict "suffix" "schedules" "resource" "triggers" "what" "Schedule Triggers (POST/PUT/DELETE /v1/schedules)" "verbs" (list "get" "list" "watch" "create" "update" "patch" "delete")) }}{{ end }}
{{- if $runs.enabled }}{{ $writes = append $writes (dict "suffix" "runs" "resource" "chains" "what" "Run copies of Chains labelled ai.roundtable.io/invokable=true (delete cleans up expired copies, patch cancels a run)" "verbs" (list "get" "list" "watch" "create" "patch" "delete")) }}{{ end }}
{{- range $w := $writes }}
{{- if has "*" ($gw.allowedNamespaces | default list) }}
---
# {{ $w.what }} in any namespace (allowedNamespaces holds "*").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-{{ $w.suffix }}
  labels:
    {{- include "roundtable-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["ai.roundtable.io"]
    resources: [{{ $w.resource | quote }}]
    verbs: {{ $w.verbs | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-{{ $w.suffix }}
  labels:
    {{- include "roundtable-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-{{ $w.suffix }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- else }}
{{- range $ns := uniq (prepend ($gw.allowedNamespaces | default list) ($gw.namespace | default $.Release.Namespace)) }}
---
# {{ $w.what }} only in the namespaces callers may target.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-{{ $w.suffix }}
  namespace: {{ $ns }}
  labels:
    {{- include "roundtable-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["ai.roundtable.io"]
    resources: [{{ $w.resource | quote }}]
    verbs: {{ $w.verbs | toJson }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-{{ $w.suffix }}
  namespace: {{ $ns }}
  labels:
    {{- include "roundtable-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-{{ $w.suffix }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
{{- if $hooks.enabled }}
{{- /*
Webhook credentials. RBAC cannot select Secrets by label, so the gateway gets
"get" (never "list" or "watch") on Secrets in the namespaces callers may
target, and reads only Secrets named by a webhook Trigger and labelled
ai.roundtable.io/webhook-secret: "true" (checked in code).
*/}}
{{- if has "*" ($gw.allowedNamespaces | default list) }}
---
# Webhook Trigger credentials in any namespace (allowedNamespaces holds "*").
# Only Secrets labelled ai.roundtable.io/webhook-secret=true are used.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-hook-secrets
  labels:
    {{- include "roundtable-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-hook-secrets
  labels:
    {{- include "roundtable-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-hook-secrets
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- else }}
{{- range $ns := uniq (prepend ($gw.allowedNamespaces | default list) ($gw.namespace | default $.Release.Namespace)) }}
---
# Webhook Trigger credentials, only in the namespaces callers may target.
# Only Secrets labelled ai.roundtable.io/webhook-secret=true are used.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-hook-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "roundtable-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-hook-secrets
  namespace: {{ $ns }}
  labels:
    {{- include "roundtable-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-hook-secrets
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ $gw.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: roundtable-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roundtable-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/values: {{ toJson $gw | sha256sum | trunc 16 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with include "roundtable-operator.podScheduling" (dict "root" . "component" $gw) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ $gw.image.repository | default .Values.image.repository }}:{{ $gw.image.tag | default (include "roundtable-operator.imageTag" .) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/gateway"]
          args:
            - --listen=:8080
            - --api-version={{ .Chart.AppVersion }}
            - --nats-url={{ $gw.natsURL }}
            - --namespace={{ $gw.namespace | default .Release.Namespace }}
            {{- with $gw.allowedNamespaces }}
            - --allowed-namespaces={{ join "," . }}
            {{- end }}
            - --default-timeout={{ $gw.defaultTimeout }}
            - --max-timeout={{ $gw.maxTimeout }}
            - --max-in-flight={{ $gw.maxInFlight }}
            - --max-streams={{ $gw.maxStreams | default 0 }}
            - --task-bucket={{ $gw.taskBucket }}
            - --task-ttl={{ $gw.taskTTL }}
            - --schedule-runs={{ $scheduleRuns.enabled | default false }}
            - --schedule-result-retention={{ $scheduleRuns.resultRetention | default "720h" }}
            - --token-file=/var/run/secrets/roundtable/gateway/token
            - --service-account-auth={{ $saAuth.enabled | default false }}
            {{- if $saAuth.enabled }}
            - --service-account-audience={{ $saAuth.audience | default "roundtable-gateway" }}
            - --service-account-namespaces={{ join "," ($saAuth.allowedNamespaces | default (list "*")) }}
            {{- end }}
            - --missions={{ $missions.enabled | default false }}
            {{- if $missions.enabled }}
            - --mission-max-budget-usd={{ $missions.maxBudgetUSD | default 10 }}
            - --mission-max-ttl-seconds={{ int ($missions.maxTTLSeconds | default 86400) }}
            - --mission-max-timeout-seconds={{ int ($missions.maxTimeoutSeconds | default 21600) }}
            - --mission-allow-skill-generation={{ $missions.allowSkillGeneration | default false }}
            {{- end }}
            - --runs={{ $runs.enabled | default false }}
            {{- if $runs.enabled }}
            - --run-ttl={{ $gw.runTTL | default "24h" }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-listen=:8081
            {{- end }}
            - --schedules={{ $schedules.enabled | default false }}
            - --hooks={{ $hooks.enabled | default false }}
            {{- if $hooks.enabled }}
            - --hook-max-body-bytes={{ int64 ($hooks.maxBodyBytes | default 1048576) }}
            - --hook-rate={{ $hooks.rate | default 2 }}
            - --hook-burst={{ int ($hooks.burst | default 20) }}
            {{- end }}
            {{- range $gw.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            {{- include "roundtable-operator.telemetryEnv" (dict "root" . "service" "roundtable-gateway") | nindent 12 }}
            - name: DEFAULT_KNIGHT_IMAGE
              value: "{{ .Values.images.piKnight.repository }}:{{ .Values.images.piKnight.tag }}"
          ports:
            - name: http
              containerPort: 8080
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: 8081
            {{- end }}
          volumeMounts:
            - name: token
              mountPath: /var/run/secrets/roundtable/gateway
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml $gw.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: token
          secret:
            secretName: {{ $secret }}
            items:
              - key: {{ $gw.auth.secretKey | default "token" }}
                path: token
{{ include "roundtable-operator.pdb" (dict "root" . "name" $name "component" $gw "app" "roundtable-gateway" "label" "gateway") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ $gw.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: roundtable-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ $gw.service.port | default 80 }}
      targetPort: http
{{- if $gw.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: roundtable-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with $gw.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- if and .Values.metrics.enabled (.Values.networkPolicy.metricsFrom | default list) }}
    # Prometheus scrapes the metrics port from networkPolicy.metricsFrom.
    - ports:
        - port: metrics
          protocol: TCP
      from:
        {{- toYaml .Values.networkPolicy.metricsFrom | nindent 8 }}
    {{- end }}
{{- end }}
{{- end }}
