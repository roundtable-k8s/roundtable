{{- if .Values.gateway.enabled }}
{{- $gw := .Values.gateway }}
{{- $name := printf "%s-gateway" (include "roundtable-operator.fullname" .) }}
{{- $missions := $gw.missions | default dict }}
{{- $secret := include "roundtable-operator.gatewayTokenSecret" . }}
{{- if not $gw.auth.existingSecret }}
{{- /* No Secret supplied: generate a token once and keep it across upgrades. */}}
{{- $key := $gw.auth.secretKey | default "token" }}
{{- $token := randAlphaNum 48 }}
{{- with (lookup "v1" "Secret" .Release.Namespace $secret) }}
{{- if hasKey .data $key }}{{ $token = index .data $key | b64dec }}{{ end }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
  annotations:
    # Keep the token (and the dashboard's access) if the release is removed.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{ $key }}: {{ $token | quote }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
---
# Read-only: the gateway looks up Knights, their RoundTables and Chains.
# Tasks go over NATS. The only objects it writes are Missions (below).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["ai.roundtable.io"]
    resources: ["knights", "roundtables", "chains"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- if $missions.enabled }}
{{- if has "*" ($gw.allowedNamespaces | default list) }}
---
# Missions in any namespace (allowedNamespaces holds "*").
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-missions
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["ai.roundtable.io"]
    resources: ["missions"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-missions
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-missions
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
{{- else }}
{{- range $ns := uniq (prepend ($gw.allowedNamespaces | default list) ($gw.namespace | default $.Release.Namespace)) }}
---
# Missions only in the namespaces callers may target.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-missions
  namespace: {{ $ns }}
  labels:
    {{- include "roundtable-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
rules:
  - apiGroups: ["ai.roundtable.io"]
    resources: ["missions"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-missions
  namespace: {{ $ns }}
  labels:
    {{- include "roundtable-operator.labels" $ | nindent 4 }}
    app.kubernetes.io/component: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}-missions
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ $gw.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: roundtable-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roundtable-gateway
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
      annotations:
        checksum/values: {{ toJson $gw | sha256sum | trunc 16 }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: gateway
          image: "{{ $gw.image.repository | default .Values.image.repository }}:{{ $gw.image.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/gateway"]
          args:
            - --listen=:8080
            - --nats-url={{ $gw.natsURL }}
            - --namespace={{ $gw.namespace | default .Release.Namespace }}
            {{- with $gw.allowedNamespaces }}
            - --allowed-namespaces={{ join "," . }}
            {{- end }}
            - --default-timeout={{ $gw.defaultTimeout }}
            - --max-timeout={{ $gw.maxTimeout }}
            - --max-in-flight={{ $gw.maxInFlight }}
            - --task-bucket={{ $gw.taskBucket }}
            - --task-ttl={{ $gw.taskTTL }}
            - --token-file=/var/run/secrets/roundtable/gateway/token
            - --missions={{ $missions.enabled | default false }}
            {{- if $missions.enabled }}
            - --mission-max-budget-usd={{ $missions.maxBudgetUSD | default 10 }}
            - --mission-max-ttl-seconds={{ int ($missions.maxTTLSeconds | default 86400) }}
            - --mission-max-timeout-seconds={{ int ($missions.maxTimeoutSeconds | default 21600) }}
            - --mission-allow-skill-generation={{ $missions.allowSkillGeneration | default false }}
            {{- end }}
            {{- range $gw.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: DEFAULT_KNIGHT_IMAGE
              value: "{{ .Values.images.piKnight.repository }}:{{ .Values.images.piKnight.tag }}"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: token
              mountPath: /var/run/secrets/roundtable/gateway
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml $gw.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: token
          secret:
            secretName: {{ $secret }}
            items:
              - key: {{ $gw.auth.secretKey | default "token" }}
                path: token
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ $gw.service.type | default "ClusterIP" }}
  selector:
    app.kubernetes.io/name: roundtable-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ $gw.service.port | default 80 }}
      targetPort: http
{{- if $gw.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: roundtable-gateway
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
          protocol: TCP
      {{- with $gw.networkPolicy.from }}
      from:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
