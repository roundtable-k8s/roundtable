{{- /*
PR pipeline Chain (#225): plan → implement → review → fix loop → merge | escalate.
Docs: docs/pr-pipeline.md. Rendered example: examples/chain-pr-pipeline.yaml.

knightRef and model are static per step, so the planner's choice of coder and
model alias is applied through `when`: one implement step per coder × alias
(single PR, same runId as the fix loop), one forEach step per coder (split into
sub-issues) and one fix loop per coder. Exactly one of each set runs.

Model tiers: the planner picks the implement alias (cheap/fast/deep, see
prPipeline.implementModels); every fix round runs prPipeline.fixModel, so a
weak first draft is fixed by a stronger model.

Quota fallback (#321): prPipeline.fallbackCoder renders a fallbackRef on every
implement, split and fixloop step. When a coder knight refuses a task for
plan quota ("Task refused: Claude plan ... (resets ...)"), the operator re-runs
the same step on the fallback knight with no model override (its own default
model); with no fallback, or a refusal on the fallback too, the step is
deferred until the plan window resets and the chain requeues then - neither
fails nor escalates (no needs-human label).

Lead steps (plan, review, merge, escalate) set no model unless prPipeline.leadModel
is set: the aliases are single-valued per RoundTable and only valid for the coders'
runtime, so a lead on another runtime (e.g. pi-knight) uses its own default (#244).

$o / $c emit the Chain's own Go-template delimiters, which the operator renders
at dispatch time (Helm must not).
*/ -}}
{{- with .Values.prPipeline }}
{{- if .enabled }}
{{- $o := "{{" }}
{{- $c := "}}" }}
{{- $lead := .lead }}
{{- $leadModel := .leadModel | default "" }}
{{- $coders := .coders }}
{{- $models := .implementModels }}
{{- $fixModel := .fixModel | default "deep" }}
{{- /* The tier the planner should default to (#360): fast when allowed, else the first allowed tier. */}}
{{- $default := "fast" }}
{{- if and $models (not (has "fast" $models)) }}
{{- $default = index $models 0 }}
{{- end }}
{{- /* fallbackCoder (#321): a plan-quota refusal re-runs the implement,
     split or fix step on this knight with no model override (its own default:
     the cheap/fast/deep aliases are Claude models). Unset: the step is
     deferred until the plan window resets. */ -}}
{{- $fallback := .fallbackCoder | default "" }}
{{- $impl := list }}
{{- $loops := list }}
{{- range $coders }}
{{- $k := . | replace "-" "_" }}
{{- range $models }}
{{- $impl = append $impl (printf "implement_%s_%s" $k .) }}
{{- end }}
{{- $impl = append $impl (printf "split_%s" $k) }}
{{- $loops = append $loops (printf "fixloop_%s" $k) }}
{{- end }}
{{- $implList := printf "[\"%s\"]" (join "\", \"" $impl) }}
{{- $loopList := printf "[\"%s\"]" (join "\", \"" $loops) }}
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Chain
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" $ | nindent 4 }}
spec:
  description: "PR pipeline: plan → implement → review → fix loop → merge, or escalate to a human"
  roundTableRef:
    name: {{ .roundTableRef.name }}
  timeoutSeconds: {{ .timeoutSeconds }}
  maxQueueWaitSeconds: {{ .maxQueueWaitSeconds }}
  {{- if .input }}
  input: {{ .input | squote }}
  {{- end }}
  steps:
    - name: plan
      knightRef:
        name: {{ $lead }}
{{- if $leadModel }}
      model: {{ $leadModel }}
{{- end }}
      timeoutSeconds: 1800
      task: |
        Plan the work for a GitHub issue. Input (JSON with repo and issue): {{ $o }} .Input {{ $c }}

        1. Read the issue (gh issue view <issue> --repo <repo>) and the repo's AGENTS.md / README.
        2. Pick the coder knight that owns this repo or area. It must be one of: {{ join ", " $coders }}.
        3. Pick the model alias for the implementation (cheapest tier that fits;
           a weaker draft is fixed by the stronger "{{ $fixModel }}" model in the fix loop).
           Allowed: {{ join ", " $models }}.
{{- /* Only the allowed tiers are described (#360): a planner that picks a tier
     no implement step runs falls through to escalate. */}}
{{- if has "cheap" $models }}
           - "cheap" (Haiku drafts{{ if eq $default "cheap" }}, the default{{ end }}): only for small, well-specified issues: a single
             file or area, clear acceptance criteria, no API/CRD/contract change and
             no `breaking` label.
{{- end }}
{{- if has "fast" $models }}
           - "fast": the default.
{{- end }}
{{- if has "deep" $models }}
           - "deep"{{ if eq $default "deep" }} (the default){{ end }}: design-heavy, cross-cutting or risky work.
{{- end }}
           Record why in "reason", naming the tier and the criteria that decided it.
        4. If the issue is too large for one reviewable PR, split it: create
           sub-issues in the same repo (gh issue create, body starting
           "Part of #<issue>"), comment the list on the issue and set split to
           true. "issues" then lists each sub-issue exactly once and never the
           parent issue: every entry becomes one implement task and one PR.
           Reuse sub-issues that already exist (gh issue list --search
           "Part of #<issue>") instead of creating duplicates.
           Otherwise set split to false and list just the input issue.
        5. Breaking changes: if the work changes an API type, a CRD, the task
           contract or another interface other repos or live resources depend
           on, set "breaking" to true. The implementing PR gets the `breaking`
           label and a migration note.
        6. Check for open breaking PRs (gh pr list --repo <repo> --label breaking
           --state open --json number,headRefName,files). If one touches the
           packages this issue touches, do not start parallel work: reply with
           coder "none" and a reason "blocked by #<pr>" (the chain then
           escalates and the issue waits for a human). Only if the issue
           depends on that PR's change, name its branch in "base" so the coder
           branches from it instead of origin/main.

        Reply with ONLY a fenced ```json block of exactly this shape:
        {"coder": "<knight>", "model": "<alias>", "split": false, "breaking": false,
         "base": "", "issues": [{"number": <n>, "title": "<title>"}], "reason": "<one sentence>"}
{{- range $coders }}
{{- $coder := . }}
{{- $k := . | replace "-" "_" }}
{{- range $models }}

    - name: implement_{{ $k }}_{{ . }}
      knightRef:
        name: {{ $coder }}
      model: {{ . }}
{{- if $fallback }}
      fallbackRef:
        name: {{ $fallback }}
{{- end }}
      dependsOn: [plan]
      when: 'json(steps.plan.output).coder == "{{ $coder }}" && json(steps.plan.output).model == "{{ . }}" && !json(steps.plan.output).split'
      timeoutSeconds: 3600
      task: |
        Implement this GitHub issue. Input (JSON with repo and issue): {{ $o }} .Input {{ $c }}
        Plan: {{ $o }} .Steps.plan.Output {{ $c }}

        Follow the repo's AGENTS.md / README. Work in a fresh clone on a branch
        rt/<issue>-<short-slug>, keep the change focused, add tests and run the
        repo's build, test and lint.
        One PR per issue: first look for an open PR for it
        (gh pr list --repo <repo> --state open --search "Closes #<issue> in:body"
        --json number,url,headRefName, and any open PR whose branch starts with
        "rt/<issue>-"). If one exists, check out its branch, push your work there
        and update that PR instead of opening a new one. Otherwise open one PR
        whose body ends "Closes #<issue>".
        If the plan's "base" is set, branch from that branch instead of origin/main
        and open the PR against it. If the plan's "breaking" is true, label the PR
        `breaking` (create the label if missing) and add a "Migration" section to
        the body: who must change what, and in which order to roll it out.
        Never merge. Reply with the PR URL on the first line.
{{- end }}

    - name: split_{{ $k }}
      knightRef:
        name: {{ $coder }}
      model: deep
{{- if $fallback }}
      fallbackRef:
        name: {{ $fallback }}
{{- end }}
      dependsOn: [plan]
      when: 'json(steps.plan.output).coder == "{{ $coder }}" && json(steps.plan.output).split'
      timeoutSeconds: 3600
      forEach:
        from: steps.plan
        path: .issues
        uniqueBy: number
        maxItems: 10
      maxParallel: 2
      failurePolicy: failFast
      task: |
        Implement sub-issue #{{ $o }} .Item.number {{ $c }} ({{ $o }} .Item.title {{ $c }}) of {{ $o }} .Input {{ $c }}.

        This task owns sub-issue #{{ $o }} .Item.number {{ $c }} only: do not implement
        the parent issue or other sub-issues.
        Follow the repo's AGENTS.md / README. Work in a fresh clone on a branch
        named after the sub-issue, rt/{{ $o }} .Item.number {{ $c }}-<short-slug> (never the
        parent issue's number), keep the change focused, add tests and run the
        repo's build, test and lint.
        One PR per sub-issue: first look for an open PR for it
        (gh pr list --repo <repo> --state open --search "Closes #{{ $o }} .Item.number {{ $c }} in:body"
        --json number,url,headRefName, and any open PR whose branch starts with
        "rt/{{ $o }} .Item.number {{ $c }}-"). If one exists, check out its branch, push your
        work there and update that PR instead of opening a new one. Otherwise open
        one PR whose body ends "Closes #{{ $o }} .Item.number {{ $c }}".
        Never merge. Reply with the PR URL on the first line.
{{- end }}

    - name: review
      knightRef:
        name: {{ $lead }}
{{- if $leadModel }}
      model: {{ $leadModel }}
{{- end }}
      dependsOn: [{{ join ", " $impl }}]
      when: '{{ $implList }}.exists(s, steps[s].phase == "Succeeded")'
      timeoutSeconds: 1800
      task: |
        Review the pull request(s) for {{ $o }} .Input {{ $c }}.
        Implementation report:
        {{- range $impl }}
        {{ $o }} .Steps.{{ . }}.Output {{ $c }}
        {{- end }}

        Check correctness, tests, scope and that each PR body ends "Closes #<n>".
        Start your reply with one line "PRs: <url> [<url> ...]" listing every PR.
        End it with exactly one line, either
        "Verdict: ship it" or "Verdict: needs changes".
{{- range $coders }}
{{- $coder := . }}
{{- $k := . | replace "-" "_" }}

    - name: fixloop_{{ $k }}
      dependsOn: [review]
      when: 'steps.review.phase == "Succeeded" && json(steps.plan.output).coder == "{{ $coder }}"'
{{- if $fallback }}
      fallbackRef:
        name: {{ $fallback }}
{{- end }}
      loop:
        from: review
        until: 'last.output.matches("(?mi)^\\W*verdict:\\s*ship it\\W*$")'
        maxIterations: {{ $.Values.prPipeline.maxIterations }}
        onExhausted: continue
        steps:
          - name: fix
            knightRef:
              name: {{ $coder }}
            model: {{ $fixModel }}
            timeoutSeconds: 3600
            retry:
              maxAttempts: 1
              backoffSeconds: 60
            task: |
              Fix round {{ $o }} .Loop.Iteration {{ $c }}/{{ $o }} .Loop.MaxIterations {{ $c }} for {{ $o }} .Input {{ $c }}.
              The reviewer asked for changes:

              {{ $o }} .Loop.Last.Output {{ $c }}

              Address every point on the same branch(es), run the repo's build, test
              and lint, push, and reply with a short summary of what changed.
              Do not open new PRs and never merge.
          - name: review
            knightRef:
              name: {{ $lead }}
{{- if $leadModel }}
            model: {{ $leadModel }}
{{- end }}
            timeoutSeconds: 1800
            task: |
              The author pushed fixes for {{ $o }} .Input {{ $c }}:

              {{ $o }} .Loop.Last.Output {{ $c }}

              Re-review the PR(s) listed in the previous review:
              {{ $o }} .Steps.review.Output {{ $c }}

              Start your reply with one line "PRs: <url> [<url> ...]" listing every PR.
              End it with exactly one line, either
              "Verdict: ship it" or "Verdict: needs changes".
{{- end }}

    - name: merge
      knightRef:
        name: {{ $lead }}
{{- if $leadModel }}
      model: {{ $leadModel }}
{{- end }}
      dependsOn: [{{ join ", " $loops }}]
      when: '{{ $loopList }}.exists(s, steps[s].outcome == "Converged")'
      timeoutSeconds: 3600
      task: |
        The review of {{ $o }} .Input {{ $c }} passed.
        {{- range $loops }}
        {{ $o }} with .Steps.{{ . }} {{ $c }}{{ $o }} if eq .Outcome "Converged" {{ $c }}Fix rounds: {{ $o }} .Iterations {{ $c }}
        Final review:
        {{ $o }} .Output {{ $c }}{{ $o }} end {{ $c }}{{ $o }} end {{ $c }}
        {{- end }}

        Queue every PR on the review's "PRs:" line with `gh pr merge --auto --squash`.
        Then wait until each one is merged, closed, or blocked by a failing required
        check (check every few minutes, give up after 50 minutes).
        Reply with one line per PR, "<url> merged|closed|blocked: <reason>",
        then a line "Fix rounds: <n>" and a last line
        "Tiering: implement=<alias the plan chose> fix={{ $fixModel }} review rounds=<n>"
        (the alias is in the plan: {{ $o }} .Steps.plan.Output {{ $c }}).

    - name: escalate
      knightRef:
        name: {{ $lead }}
{{- if $leadModel }}
      model: {{ $leadModel }}
{{- end }}
      dependsOn: [{{ join ", " $loops }}]
      when: '{{ $loopList }}.exists(s, steps[s].outcome == "Exhausted") || !{{ $implList }}.exists(s, steps[s].phase == "Succeeded")'
      timeoutSeconds: 600
      task: |
        Escalate {{ $o }} .Input {{ $c }} to a human.
        {{- range $loops }}
        {{ $o }} with .Steps.{{ . }} {{ $c }}{{ $o }} if eq .Outcome "Exhausted" {{ $c }}The PR(s) still need changes after {{ $o }} .Iterations {{ $c }} fix rounds. Last review:
        {{ $o }} .Output {{ $c }}{{ $o }} end {{ $c }}{{ $o }} end {{ $c }}
        {{- end }}
        {{ $o }} if eq .Steps.review.Phase "Skipped" {{ $c }}No implementation ran: the plan named no known coder/model. Plan:
        {{ $o }} .Steps.plan.Output {{ $c }}{{ $o }} end {{ $c }}

        Add the label `needs-human` (create it if missing) to the issue and to
        every PR on the last review's "PRs:" line, and comment on each with the
        last review (or the plan) and why it was escalated. Do not merge.
        Reply with the URLs you labelled.
{{- end }}
{{- end }}
