{{- if hasKey .Values.planner "arsenal" }}
{{- fail "planner.arsenal is no longer supported and would be ignored: rename it to planner.arsenals" }}
{{- end }}
{{- if .Values.planner.enabled }}
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: {{ include "roundtable-operator.fullname" . }}-planner
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: planner
    ai.roundtable.io/role: planner
spec:
  domain: {{ .Values.planner.domain | default "operator" }}
  model: {{ .Values.planner.model | default "claude-sonnet-4-20250514" }}
  image: "{{ .Values.images.piKnight.repository }}:{{ .Values.images.piKnight.tag }}"
  skills:
    {{- toYaml .Values.planner.skills | nindent 4 }}
  nats:
    subjects:
      - "{{ .Values.planner.natsPrefix | default "fleet-a" }}.tasks.operator.>"
  concurrency: {{ .Values.planner.concurrency | default 1 }}
  taskTimeoutSeconds: {{ .Values.planner.taskTimeoutSeconds | default 600 }}
  {{- if .Values.planner.arsenals }}
  arsenals:
    {{- toYaml .Values.planner.arsenals | nindent 4 }}
  {{- end }}
  {{- if .Values.planner.runtimeClassName }}
  runtimeClassName: {{ .Values.planner.runtimeClassName | quote }}
  {{- end }}
  {{- with .Values.planner.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.planner.affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.planner.tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.planner.topologySpreadConstraints }}
  topologySpreadConstraints:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.planner.priorityClassName }}
  priorityClassName: {{ .Values.planner.priorityClassName | quote }}
  {{- end }}
  {{- with .Values.planner.github }}
  github:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if .Values.planner.envFrom }}
  envFrom:
    {{- toYaml .Values.planner.envFrom | nindent 4 }}
  {{- end }}
{{- end }}
