apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "roundtable-operator.fullname" . }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
rules:
  # CRD management (Knights, Chains, Missions, RoundTables, Triggers)
  - apiGroups: ["ai.roundtable.io"]
    resources:
      - knights
      - knights/status
      - knights/finalizers
      - chains
      - chains/status
      - chains/finalizers
      - missions
      - missions/status
      - missions/finalizers
      - roundtables
      - roundtables/status
      - roundtables/finalizers
      - triggers
      - triggers/status
      - triggers/finalizers
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Managed resources — Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Managed resources — tools image build Jobs
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Managed resources — Agent Sandbox
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes", "sandboxes/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Knight scaling — KEDA ScaledObjects and PodDisruptionBudgets
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only: status.scaling reads the HPA KEDA generates
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Knight spec.egress and mission egress policies (CiliumNetworkPolicy
  # when Cilium is installed, NetworkPolicy otherwise)
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Read-only: knights naming spec.runtimeClassName are parked when it is missing
  - apiGroups: ["node.k8s.io"]
    resources: ["runtimeclasses"]
    verbs: ["get", "list", "watch"]
  # Notification webhook bearer tokens (spec.notify.webhook.tokenSecretRef)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "roundtable-operator.fullname" . }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "roundtable-operator.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "roundtable-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
