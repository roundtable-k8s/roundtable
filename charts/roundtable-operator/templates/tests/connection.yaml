{{- if or .Values.gateway.enabled .Values.dashboard.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "roundtable-operator.fullname" . | trunc 52 | trimSuffix "-" }}-test-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: IfNotPresent
      command:
        - sh
        - -c
        - |
          set -e
          {{- if .Values.gateway.enabled }}
          wget -q -T 10 -O /dev/null http://{{ include "roundtable-operator.fullname" . }}-gateway.{{ .Release.Namespace }}.svc:{{ .Values.gateway.service.port | default 80 }}/readyz
          echo "gateway ok"
          {{- end }}
          {{- if .Values.dashboard.enabled }}
          wget -q -T 10 -O /dev/null http://{{ include "roundtable-operator.fullname" . }}-dashboard.{{ .Release.Namespace }}.svc:80/api/health
          echo "dashboard ok"
          {{- end }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
{{- end }}
