{{- if .Values.dashboard.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "roundtable-operator.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "roundtable-operator.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  # Read-only: replicas, scaling state and events of a knight
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  {{- if .Capabilities.APIVersions.Has "keda.sh/v1alpha1" }}
  - apiGroups: ["keda.sh"]
    resources: ["scaledobjects"]
    verbs: ["get", "list", "watch"]
  {{- end }}
  {{- if .Capabilities.APIVersions.Has "metrics.k8s.io/v1beta1" }}
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list"]
  {{- end }}
  - apiGroups: ["ai.roundtable.io"]
    resources: ["knights", "chains", "roundtables", "triggers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ai.roundtable.io"]
    resources: ["missions"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["ai.roundtable.io"]
    resources: ["chains/status", "missions/status"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "roundtable-operator.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "roundtable-operator.fullname" . }}-dashboard
subjects:
  - kind: ServiceAccount
    name: {{ include "roundtable-operator.fullname" . }}-dashboard
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roundtable-operator.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  replicas: {{ .Values.dashboard.replicas | default 1 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: roundtable-dashboard
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: roundtable-dashboard
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "roundtable-operator.fullname" . }}-dashboard
      {{- with include "roundtable-operator.podScheduling" (dict "root" . "component" .Values.dashboard) }}
      {{- . | nindent 6 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dashboard
          image: "{{ .Values.images.dashboard.repository }}:{{ .Values.images.dashboard.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            {{- range $key, $value := .Values.dashboard.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.gateway.enabled }}
            - name: GATEWAY_URL
              value: "http://{{ include "roundtable-operator.fullname" . }}-gateway.{{ .Release.Namespace }}.svc:{{ .Values.gateway.service.port | default 80 }}"
            - name: GATEWAY_TOKEN_FILE
              value: /var/run/secrets/roundtable/gateway/token
            {{- end }}
            - name: VAULT_PATH
              value: "/vault"
            {{- include "roundtable-operator.telemetryEnv" (dict "root" . "service" "roundtable-ui") | nindent 12 }}
            {{- if and .Values.telemetry.enabled .Values.telemetry.traceUrlTemplate }}
            - name: TRACE_URL_TEMPLATE
              value: {{ .Values.telemetry.traceUrlTemplate | quote }}
            {{- end }}
          {{- if or .Values.dashboard.vault.enabled .Values.gateway.enabled }}
          volumeMounts:
            {{- if .Values.dashboard.vault.enabled }}
            - name: vault
              mountPath: /vault
              readOnly: true
            {{- end }}
            {{- if .Values.gateway.enabled }}
            - name: gateway-token
              mountPath: /var/run/secrets/roundtable/gateway
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml .Values.dashboard.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
      {{- if or .Values.dashboard.vault.enabled .Values.gateway.enabled }}
      volumes:
        {{- if .Values.dashboard.vault.enabled }}
        - name: vault
          persistentVolumeClaim:
            claimName: {{ .Values.dashboard.vault.claimName }}
        {{- end }}
        {{- if .Values.gateway.enabled }}
        # Mounted as a file (not an env var) so a rotated token reaches the
        # dashboard without a restart.
        - name: gateway-token
          secret:
            secretName: {{ .Values.dashboard.gateway.tokenSecret | default (include "roundtable-operator.gatewayTokenSecret" .) }}
            items:
              - key: {{ .Values.dashboard.gateway.tokenKey | default .Values.gateway.auth.secretKey | default "token" }}
                path: token
        {{- end }}
      {{- end }}
{{ include "roundtable-operator.pdb" (dict "root" . "name" (printf "%s-dashboard" (include "roundtable-operator.fullname" .)) "component" .Values.dashboard "app" "roundtable-dashboard" "label" "dashboard") }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "roundtable-operator.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
spec:
  selector:
    app.kubernetes.io/name: roundtable-dashboard
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.dashboard.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "roundtable-operator.fullname" . }}-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard
  {{- with .Values.dashboard.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.dashboard.ingress.className }}
  ingressClassName: {{ .Values.dashboard.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.dashboard.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "roundtable-operator.fullname" . }}-dashboard
                port:
                  name: http
{{- end }}
{{- end }}
