{{- if .Values.metrics.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "roundtable-operator.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
spec:
  selector:
    {{- include "roundtable-operator.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
{{- end }}
{{- if and .Values.metrics.enabled .Values.gateway.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "roundtable-operator.fullname" . }}-gateway-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway-metrics
spec:
  selector:
    app.kubernetes.io/name: roundtable-gateway
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: metrics
      port: 8081
      targetPort: metrics
{{- end }}
