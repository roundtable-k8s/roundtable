apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roundtable-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "roundtable-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "roundtable-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "roundtable-operator.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElect }}
            - --leader-elect
            {{- end }}
            {{- /* YAML may parse true/false as bools; keep them, default only when unset */}}
            - --enable-sandbox-backend={{ if kindIs "bool" .Values.sandboxBackend }}{{ .Values.sandboxBackend }}{{ else }}{{ .Values.sandboxBackend | default "auto" }}{{ end }}
            - --enable-keda={{ if kindIs "bool" .Values.keda }}{{ .Values.keda }}{{ else }}{{ .Values.keda | default "auto" }}{{ end }}
            - --provider-overload-max-retries={{ .Values.providerOverload.maxRetries }}
            - --mission-results-ttl={{ .Values.mission.resultsTTL | default "720h" }}
            {{- with .Values.natsMonitoringEndpoint }}
            - --nats-monitoring-endpoint={{ . }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            - --metrics-bind-address=:8080
            - --metrics-secure=false
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . }}
            {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: 8080
          {{- end }}
          env:
            {{- include "roundtable-operator.telemetryEnv" (dict "root" . "service" "roundtable-operator") | nindent 12 }}
            - name: DEFAULT_KNIGHT_IMAGE
              value: "{{ .Values.images.piKnight.repository }}:{{ .Values.images.piKnight.tag }}"
            # Pod security context applied to knight pods.
            - name: KNIGHT_RUN_AS_USER
              value: "{{ .Values.knightSecurity.runAsUser }}"
            - name: KNIGHT_RUN_AS_GROUP
              value: "{{ .Values.knightSecurity.runAsGroup }}"
            - name: KNIGHT_FS_GROUP
              value: "{{ .Values.knightSecurity.fsGroup }}"
            - name: KNIGHT_FS_GROUP_CHANGE_POLICY
              value: "{{ .Values.knightSecurity.fsGroupChangePolicy }}"
            # Pinned nixpkgs ref for reproducible knight tool builds.
            - name: KNIGHT_NIXPKGS_REF
              value: "{{ .Values.nixpkgs.ref }}"
            # Isolation defaults (#387): every knight runs under this
            # RuntimeClass and behind default-deny egress unless its spec opts
            # out. isolation.runtimeClassName: "" and isolation.egress.mode: off
            # turn the defaults off for the whole install.
            {{- with .Values.isolation }}
            - name: KNIGHT_DEFAULT_RUNTIME_CLASS
              value: {{ if kindIs "string" .runtimeClassName }}{{ .runtimeClassName | quote }}{{ else }}"gvisor"{{ end }}
            {{- $egress := .egress | default dict }}
            {{- $mode := $egress.mode }}
            {{- if kindIs "bool" $mode }}{{ $mode = ternary "deny" "off" $mode }}{{ end }}
            {{- if kindIs "invalid" $mode }}{{ $mode = "deny" }}{{ end }}
            {{- if not (has $mode (list "deny" "off")) }}
            {{- fail (printf "isolation.egress.mode must be \"deny\" or \"off\", got %v" $mode) }}
            {{- end }}
            - name: KNIGHT_DEFAULT_EGRESS
              value: {{ $mode | quote }}
            - name: KNIGHT_EGRESS_BASE_HOSTS
              value: {{ join "," ($egress.baseHosts | default list) | quote }}
            {{- end }}
            {{- with .Values.toolsImage }}
            {{- if .repository }}
            # Per-knight tools images: build Nix tools into an OCI image per
            # tool list and mount it as an image volume.
            - name: KNIGHT_TOOLS_IMAGE_REPO
              value: "{{ .repository }}"
            {{- if .pushRepository }}
            - name: KNIGHT_TOOLS_IMAGE_PUSH_REPO
              value: "{{ .pushRepository }}"
            {{- end }}
            {{- if .pushInsecure }}
            - name: KNIGHT_TOOLS_IMAGE_PUSH_INSECURE
              value: "true"
            {{- end }}
            {{- if .builderImage }}
            - name: KNIGHT_TOOLS_BUILDER_IMAGE
              value: "{{ .builderImage }}"
            {{- end }}
            {{- if .nix2containerRev }}
            - name: KNIGHT_NIX2CONTAINER_REV
              value: "{{ .nix2containerRev }}"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.missionNetworkPolicy }}
            # Mission knight egress NetworkPolicy settings.
            - name: MISSION_NETPOL_ENABLED
              value: "{{ if kindIs "bool" .enabled }}{{ .enabled }}{{ else }}true{{ end }}"
            {{- with .nats }}
            {{- if .podLabels }}
            - name: MISSION_NETPOL_NATS_POD_LABELS
              value: "{{ $l := list }}{{ range $k, $v := .podLabels }}{{ $l = append $l (printf "%s=%s" $k $v) }}{{ end }}{{ join "," $l }}"
            {{- end }}
            {{- end }}
            {{- with .dns }}
            {{- if .namespace }}
            - name: MISSION_NETPOL_DNS_NAMESPACE
              value: "{{ .namespace }}"
            {{- end }}
            {{- if .podLabels }}
            - name: MISSION_NETPOL_DNS_POD_LABELS
              value: "{{ $l := list }}{{ range $k, $v := .podLabels }}{{ $l = append $l (printf "%s=%s" $k $v) }}{{ end }}{{ join "," $l }}"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.notify.allowedURLPrefixes }}
            # SSRF allowlist for spec.notify completion webhooks; unset means
            # the operator rejects all notification URLs.
            - name: NOTIFY_ALLOWED_URL_PREFIXES
              value: "{{ join "," .Values.notify.allowedURLPrefixes }}"
            {{- end }}
            # Agent cards KV bucket (#393).
            - name: CARDS_KV_BUCKET
              value: {{ (.Values.cards | default dict).bucket | default "roundtable-cards" | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
