apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roundtable-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "roundtable-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "roundtable-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "roundtable-operator.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "roundtable-operator.serviceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: manager
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            {{- if .Values.leaderElect }}
            - --leader-elect
            {{- end }}
            {{- /* YAML may parse true/false as bools; keep them, default only when unset */}}
            - --enable-sandbox-backend={{ if kindIs "bool" .Values.sandboxBackend }}{{ .Values.sandboxBackend }}{{ else }}{{ .Values.sandboxBackend | default "auto" }}{{ end }}
            - --enable-keda={{ if kindIs "bool" .Values.keda }}{{ .Values.keda }}{{ else }}{{ .Values.keda | default "auto" }}{{ end }}
            {{- with .Values.natsMonitoringEndpoint }}
            - --nats-monitoring-endpoint={{ . }}
            {{- end }}
            {{- range .Values.extraArgs }}
            - {{ . }}
            {{- end }}
          env:
            - name: OPERATOR_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            - name: DEFAULT_KNIGHT_IMAGE
              value: "{{ .Values.images.piKnight.repository }}:{{ .Values.images.piKnight.tag }}"
            # Pod security context applied to knight pods.
            - name: KNIGHT_RUN_AS_USER
              value: "{{ .Values.knightSecurity.runAsUser }}"
            - name: KNIGHT_RUN_AS_GROUP
              value: "{{ .Values.knightSecurity.runAsGroup }}"
            - name: KNIGHT_FS_GROUP
              value: "{{ .Values.knightSecurity.fsGroup }}"
            - name: KNIGHT_FS_GROUP_CHANGE_POLICY
              value: "{{ .Values.knightSecurity.fsGroupChangePolicy }}"
            # Pinned nixpkgs ref for reproducible knight tool builds.
            - name: KNIGHT_NIXPKGS_REF
              value: "{{ .Values.nixpkgs.ref }}"
            {{- with .Values.toolsImage }}
            {{- if .repository }}
            # Per-knight tools images: build Nix tools into an OCI image per
            # tool list and mount it as an image volume.
            - name: KNIGHT_TOOLS_IMAGE_REPO
              value: "{{ .repository }}"
            {{- if .pushRepository }}
            - name: KNIGHT_TOOLS_IMAGE_PUSH_REPO
              value: "{{ .pushRepository }}"
            {{- end }}
            {{- if .pushInsecure }}
            - name: KNIGHT_TOOLS_IMAGE_PUSH_INSECURE
              value: "true"
            {{- end }}
            {{- if .builderImage }}
            - name: KNIGHT_TOOLS_BUILDER_IMAGE
              value: "{{ .builderImage }}"
            {{- end }}
            {{- if .nix2containerRev }}
            - name: KNIGHT_NIX2CONTAINER_REV
              value: "{{ .nix2containerRev }}"
            {{- end }}
            {{- end }}
            {{- end }}
            {{- if .Values.notify.allowedURLPrefixes }}
            # SSRF allowlist for spec.notify completion webhooks; unset means
            # the operator rejects all notification URLs.
            - name: NOTIFY_ALLOWED_URL_PREFIXES
              value: "{{ join "," .Values.notify.allowedURLPrefixes }}"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
