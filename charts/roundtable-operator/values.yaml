# Default values for roundtable-operator
replicaCount: 1

image:
  repository: ghcr.io/roundtable-k8s/roundtable
  tag: latest
  pullPolicy: Always

serviceAccount:
  create: true
  name: roundtable-operator
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Leader election for HA
leaderElect: true

# Node selector, tolerations, affinity
nodeSelector: {}
tolerations: []
affinity: {}

# agent-sandbox runtime backend (Knight spec.runtime: sandbox).
#   auto  - enable only if the cluster serves agents.x-k8s.io/v1beta1 Sandbox
#           (agent-sandbox v1.0.0 or later; developed against v1.0.12)
#   true  - always enable (the operator won't start if the API isn't served)
#   false - never enable; sandbox knights report RuntimeAvailable=False
sandboxBackend: auto

# KEDA autoscaling for knights (Knight spec.maxReplicas > 1 or
# lifecycle.suspendPolicy: auto). The operator renders a ScaledObject with the
# NATS JetStream scaler on the knight's task consumer.
#   auto  - enable only if the cluster serves keda.sh/v1alpha1 ScaledObject
#   true  - always enable (ScaledObject writes fail if KEDA isn't installed)
#   false - never enable; such knights run spec.replicas pods, Autoscaled=False
keda: auto

# NATS HTTP monitoring endpoint (host:port) for KEDA's JetStream scaler.
# Empty derives it from each knight's spec.nats.url host on port 8222.
natsMonitoringEndpoint: ""

# Additional args to pass to the manager
extraArgs: []

# Completion webhook notifications (spec.notify on Chains/Missions). The
# operator only POSTs to URLs matching one of these prefixes — this is the
# SSRF guard, since anyone who can create a Chain controls notify.url. An
# empty list rejects every notification (feature disabled).
# Example:
#   allowedURLPrefixes:
#     - http://molt.ai.svc:18789/
notify:
  allowedURLPrefixes: []

# Global image settings for managed components — pinned to git SHAs of each
# repo's main; bump here (with a chart version bump), then update the chart
# version in dapper-cluster
images:
  piKnight:
    repository: ghcr.io/roundtable-k8s/pi-knight
    tag: 311d428aba9aea3d9b2e37feab237c378046e718
  dashboard:
    repository: ghcr.io/roundtable-k8s/roundtable-ui
    tag: 24615ccda6af6136eb81ee07e535c00bd73095a5

# Pod-level security context for knight pods. Set once here; the operator
# applies it to every knight. OnRootMismatch stops kubelet from recursively
# chowning a knight's volumes on every pod mount.
knightSecurity:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

# Pinned nixpkgs ref for knight tools images — an immutable commit for
# reproducible builds. Bump to roll the whole fleet's tooling forward (changing
# this changes every tools image tag, so every knight's tools are rebuilt).
nixpkgs:
  ref: "9ae611a455b90cf061d8f332b977e387bda8e1ca" # nixos-unstable @ 2026-06-10

# Per-knight tools images: how knights get their spec.tools.nix packages. For
# each unique list the operator runs a one-off Job that builds an OCI image
# with nix2container and pushes it (tag = hash of the tool list), and the
# knight mounts that image read-only at /nix as an image volume. Identical
# lists share one image and are built once. Needs Kubernetes image volumes (on
# by default from 1.35) and containerd 2.1+. Without a repository, knights run
# without their Nix tools and get a ToolsImageNotConfigured warning event.
toolsImage:
  # Repository knights (i.e. the nodes) pull from, e.g.
  # registry.example.com/knight-tools. Empty disables tools images.
  repository: ""
  # Repository the build Job pushes to, when it reaches the registry by a
  # different address than the nodes (e.g. an in-cluster Service). Defaults to
  # repository.
  pushRepository: ""
  # Push over plain HTTP (in-cluster Service without TLS).
  pushInsecure: false
  # Image the build Job runs. Empty uses the prebuilt builder CI publishes for
  # the operator's built-in pins (ghcr.io/roundtable-k8s/tools-builder, with the
  # nix2container tooling already built), or plain digest-pinned nixos/nix when
  # nixpkgs.ref or nix2containerRev is overridden. Plain Nix compiles that
  # tooling on every build, which takes many minutes on a small node.
  builderImage: ""
  # nix2container commit the generated flake pins; defaults to the operator's
  # built-in pin. Changing it changes every tools image tag.
  nix2containerRev: ""

# Egress NetworkPolicy the operator creates for each mission's knights. The NATS
# rule is derived from the mission's NATS URL (namespace and port); TCP 443 is
# allowed to anywhere. Set enabled=false on clusters without NetworkPolicy
# support or that manage their own policies. The nats and dns peers below also
# apply to the egress policy of knights with spec.egress (enabled does not).
missionNetworkPolicy:
  enabled: true
  nats:
    # Optional pod labels narrowing the NATS peer; empty = whole namespace.
    podLabels:
      app.kubernetes.io/name: nats
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns

# Ingress NetworkPolicies for the operator, the dashboard and knight pods. Off
# by default: nothing extra is rendered. When enabled, each policy selects its
# pods in the release namespace and allows only the ports listed below; a
# policy with no allowed peers allows nothing. See docs/helm-values.md.
networkPolicy:
  enabled: false
  # NetworkPolicyPeers allowed to scrape metrics (operator and knights) and,
  # for the dashboard, to reach it too. Default: the monitoring namespace.
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # NetworkPolicyPeers allowed to reach the dashboard's http port, in addition
  # to metricsFrom. Empty means only metricsFrom can reach it.
  dashboardFrom: []
  # Port of the operator's metrics endpoint; must match --metrics-bind-address
  # in extraArgs (metrics are off by default).
  operatorMetricsPort: 8443

# Dashboard (Round Table UI) — observability platform
dashboard:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
  env:
    NATS_URL: "nats://nats.database.svc:4222"
    NAMESPACE: "roundtable"
    FLEET_PREFIX: "fleet-a"
    FLEET_STREAM: "fleet_a_results"
  vault:
    enabled: true
    claimName: "roundtable-vault"
  # Token the dashboard sends to the gateway (mounted read-only; the dashboard
  # re-reads it on a 401). Empty = the gateway's own token Secret and key.
  gateway:
    tokenSecret: ""
    tokenKey: ""

# Invoke gateway: a synchronous HTTP API and MCP (streamable HTTP) endpoint in
# front of the knights. Callers POST a task, the gateway publishes it on the
# knight's NATS subject and waits for the result (or returns 202 {taskId} to
# poll). See docs/gateway.md. Runs as its own Deployment from the operator
# image (/gateway) with read-only RBAC on Knights and RoundTables.
gateway:
  enabled: true
  replicas: 1
  # Image; defaults to the operator image (image.repository:image.tag).
  image:
    repository: ""
    tag: ""
  # NATS server the knights' RoundTables use.
  natsURL: nats://nats.database.svc:4222
  # Default namespace for knights; empty means the release namespace.
  namespace: ""
  # Extra namespaces callers may target ("*" for any). Widen the RBAC to
  # match: the gateway gets a ClusterRole, so it can read Knights anywhere.
  allowedNamespaces: []
  # How long invoke waits when the caller doesn't pass timeoutSeconds, and
  # the most a caller may ask for. Longer waits return 202 {taskId}.
  defaultTimeout: 60s
  maxTimeout: 10m
  # Concurrently waiting invocations per replica; beyond it callers get 429.
  maxInFlight: 64
  # NATS KV bucket holding task records (taskId -> status/result) and how
  # long they are kept.
  taskBucket: roundtable_gateway_tasks
  taskTTL: 168h
  # Bearer-token auth (always on). Leave existingSecret empty and the chart
  # generates a random token into <fullname>-gateway-token (kept across
  # upgrades and uninstall) and wires the dashboard to it. To bring your own,
  # set existingSecret; the key holds the token, and two tokens on separate
  # lines rotate without downtime. Create it with e.g.
  #   kubectl create secret generic roundtable-gateway-token \
  #     --from-literal=token="$(openssl rand -hex 32)"
  auth:
    existingSecret: ""
    secretKey: token
  service:
    type: ClusterIP
    port: 80
  # NetworkPolicy limiting who can reach the gateway, on top of the token.
  # `from` is a list of NetworkPolicyPeers; the default allows pods in the
  # release namespace only. Add e.g. a namespaceSelector for OpenClaw.
  networkPolicy:
    enabled: true
    from:
      - podSelector: {}
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  extraArgs: []
  # Mission endpoints (POST/GET/DELETE /v1/missions and the start_mission,
  # get_mission and list_missions MCP tools). Callers send a restricted
  # request (objective, table, budget, planner knight, existing knights and
  # chains): never images, Secrets, pod specs or RoundTable templates. When
  # enabled, the gateway gets create/delete on Missions in its namespace and
  # allowedNamespaces (a ClusterRole if allowedNamespaces holds "*").
  missions:
    enabled: true
    # Upper bound on a mission's costBudgetUSD (which callers must set).
    maxBudgetUSD: 10
    # Upper bounds on ttlSeconds and timeoutSeconds.
    maxTTLSeconds: 86400
    maxTimeoutSeconds: 21600
    # Let callers set planner.allowSkillGeneration.
    allowSkillGeneration: false

# Knights to create alongside the operator
# Example:
# knights:
#   galahad:
#     domain: security
#     model: openrouter/deepseek/deepseek-v3.2
#     skills: [security, opencti, shared]
#     tools:
#       apt: [nmap, whois, dnsutils]
#     nats:
#       subjects: ["fleet-a.tasks.security.>"]
#     taskTimeoutSeconds: 300
#     # corev1.ResourceRequirements for the knight's app container.
#     resources:
#       requests: {cpu: 100m, memory: 256Mi}
#       limits: {memory: 1Gi}
#     # Mount a refreshing GitHub token file (GITHUB_TOKEN_FILE) instead of
#     # a frozen env token. Overrides the knight's RoundTable spec.github.
#     github:
#       tokenSecretRef:
#         name: roundtable-github-token
#         key: token
#   rt-operator:
#     domain: operator
#     skills: [operator, shared]
#     coder: true   # build/test code: gets codingKnightDefaults below unless
#                   # the knight sets its own resources / workspace
knights: {}

# Defaults for knights with `coder: true` (they clone, build and test code).
# Each of resources / workspace applies only when the knight doesn't set its
# own. Without ephemeral-storage the namespace LimitRange default (often 4Gi)
# evicts the pod mid-build, so it is set explicitly. For knights that live in a
# RoundTable, set the same under RoundTable spec.defaults.resources /
# spec.defaults.workspace; standing knights with the table label inherit them.
codingKnightDefaults:
  resources:
    requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 4Gi}
    limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 20Gi}
  workspace:
    size: 20Gi

# Built-in planner knight — ships with the operator for meta-missions
planner:
  enabled: true
  domain: operator
  model: claude-sonnet-4-20250514
  skills:
    - operator
    - shared
  concurrency: 1
  taskTimeoutSeconds: 600
  # RuntimeClass for the planner pod (for example gvisor). Empty = cluster default.
  runtimeClassName: ""
  arsenal:
    repo: https://github.com/roundtable-k8s/arsenal.git
    ref: main
    periodSeconds: 300
  # Extra skill repos merged into /skills after `arsenal` (per skill; later wins).
  # arsenals:
  #   - name: personal
  #     repo: https://github.com/<you>/<your-skills>.git
  # GitHub token Secret mounted read-only at
  # /var/run/secrets/roundtable/github/token (GITHUB_TOKEN_FILE). The kubelet
  # refreshes the file when the Secret rotates, so short-lived GitHub App
  # installation tokens keep working; the knight image's git credential
  # helper and gh shim read it on every call. The planner is not part of a
  # RoundTable, so it does not inherit spec.github from one; set it here.
  github: {}
  #   tokenSecretRef:
  #     name: roundtable-github-token
  #     key: token

# PR pipeline Chain (#225): plan → implement → review → bounded fix loop →
# merge (gh pr merge --auto) or escalate (label needs-human). Run it for an
# issue by setting spec.input to {"repo": "<owner>/<repo>", "issue": <n>} and
# annotating ai.roundtable.io/run. See docs/pr-pipeline.md.
# Every knight below must exist in the release namespace, and the RoundTable
# must define the model aliases it uses (deep, fast, and cheap when listed in
# implementModels; spec.modelAliases, e.g. cheap: haiku), resolvable on the
# coders' runtime. Lead steps use no alias (see leadModel).
prPipeline:
  enabled: false
  name: pr-pipeline
  roundTableRef:
    name: roundtable-dev
  # Plans, reviews, merges and escalates.
  lead: rt-lead
  # Optional model for the lead's steps (plan, review, merge, escalate): an alias
  # or a model valid for the lead's runtime. Empty = the lead knight's default
  # model, which works for any runtime (e.g. a pi-knight lead).
  leadModel: ""
  # Coder knights the planner may pick from. One implement step per coder ×
  # implementModels entry, one split (forEach) step and one fix loop per coder
  # are rendered; `when` runs only the planner's pick.
  coders:
    - rt-operator
  # Model aliases the planner may pick for the implementation. Add `cheap` (a
  # RoundTable alias for Haiku) to let the planner draft small, well-specified
  # issues on the cheapest tier: [cheap, fast, deep].
  implementModels:
    - deep
    - fast
  # Model alias for every fix round. Keep it stronger than the cheap tier so a
  # Haiku draft is fixed by fast (Sonnet) or deep (Opus).
  fixModel: deep
  # Fallback coder knight (#321). When a coder knight refuses a task for plan
  # quota ("Task refused: Claude plan ... (resets ...)"), the operator re-runs
  # the same implement/split/fix step on this knight with NO model override:
  # the cheap/fast/deep aliases are Claude models, so the fallback runs its own
  # default model. Use a knight on a runtime with its own quota (e.g. rt-coder,
  # a pi-knight on GLM via OpenRouter, subject "rt-dev.tasks.coder.>").
  # Empty: a refusal defers the step until the plan window resets.
  fallbackCoder: ""
  # Fix → re-review rounds before escalating.
  maxIterations: 3
  timeoutSeconds: 86400
  maxQueueWaitSeconds: 3600
  # Optional initial input, e.g. '{"repo": "roundtable-k8s/roundtable", "issue": 225}'.
  input: ""
  # Feedback Chain (#226, docs/pr-feedback.md) fed by the operator's PR
  # feedback watcher (RoundTable spec.prFeedback): a red CI run or a
  # merge-queue rejection of a pipeline PR goes back to its author knight
  # (resuming the pipeline's session), then the lead re-queues the PR. Uses
  # lead, coders and roundTableRef above. Off by default.
  feedback:
    enabled: false
    name: pr-pipeline-feedback
    timeoutSeconds: 7200

# Prometheus metrics. Everything is opt-in. The operator serves plain HTTP
# metrics (--metrics-secure=false) so a ServiceMonitor can scrape it without
# TLS or authn/authz configuration; restrict access with networkPolicy if needed.
# Monitors are only rendered when the monitoring.coreos.com/v1 API is served.
metrics:
  enabled: false
  # Scrape interval for all monitors.
  interval: 1m
  # Extra labels added to every monitor (e.g. the Prometheus selector label).
  labels: {}
  serviceMonitor:
    # ServiceMonitors for the operator and (when dashboard.enabled) the dashboard.
    enabled: false
  podMonitor:
    # PodMonitor for knight pods (port 3000, container "app").
    enabled: false
