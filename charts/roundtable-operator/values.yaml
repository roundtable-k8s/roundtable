# Default values for roundtable-operator
replicaCount: 1

image:
  repository: ghcr.io/roundtable-k8s/roundtable
  tag: latest
  pullPolicy: Always

serviceAccount:
  create: true
  name: roundtable-operator
  annotations: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Leader election for HA
leaderElect: true

# Leader election lease timings. The defaults tolerate a Kubernetes API that is
# slow for tens of seconds with a single replica. renewDeadline must be less
# than leaseDuration, and greater than 1.2 x retryPeriod.
leaderElection:
  # Set false to run without leader election. Only allowed with replicaCount: 1,
  # and the Deployment then uses the Recreate strategy so a rolling update never
  # runs two operators at once (this makes updates briefly unavailable).
  enabled: true
  leaseDuration: 60s
  renewDeadline: 40s
  retryPeriod: 5s

# Pod scheduling and pull settings applied to every Deployment the chart
# renders (operator, gateway, dashboard, collector). gateway.*, dashboard.* and
# telemetry.collector.* may set their own nodeSelector, tolerations and
# affinity, each replacing the global value when non-empty.
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""
# Pull secrets for the operator, gateway, dashboard and collector pods,
# e.g. [{name: regcred}]. Knight pods are configured on the Knight.
imagePullSecrets: []
# Extra labels/annotations on the operator, gateway and dashboard pods.
podAnnotations: {}
podLabels: {}

# PodDisruptionBudget for the gateway and dashboard; only rendered for a
# component with more than one replica. maxUnavailable wins when set.
# The operator (leader election) has none.
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  maxUnavailable: ""

# agent-sandbox runtime backend (Knight spec.runtime: sandbox).
#   auto  - enable only if the cluster serves agents.x-k8s.io/v1beta1 Sandbox
#           (agent-sandbox v1.0.0 or later; developed against v1.0.12)
#   true  - always enable (the operator won't start if the API isn't served)
#   false - never enable; sandbox knights report RuntimeAvailable=False
sandboxBackend: auto

# KEDA autoscaling for knights (Knight spec.maxReplicas > 1 or
# lifecycle.suspendPolicy: auto). The operator renders a ScaledObject with the
# NATS JetStream scaler on the knight's task consumer.
#   auto  - enable only if the cluster serves keda.sh/v1alpha1 ScaledObject
#   true  - always enable (ScaledObject writes fail if KEDA isn't installed)
#   false - never enable; such knights run spec.replicas pods, Autoscaled=False
keda: auto

# NATS HTTP monitoring endpoint (host:port) for KEDA's JetStream scaler.
# Empty derives it from each knight's spec.nats.url host on port 8222.
natsMonitoringEndpoint: ""

# Transient model provider failures (#481). A chain step whose task fails with
# HTTP 529/503/502/500 or "overloaded" is retried after a 1m, 2m, 4m, 8m...
# backoff instead of failing the run. After 2 retries the step moves to
# prPipeline.fallbackCoder when set. 0 disables the retry.
providerOverload:
  maxRetries: 4

# Missions.
mission:
  # How long the retained results of a mission (spec.retainResults) stay in the
  # mission-results NATS KV bucket, as a Go duration (720h = 30 days). The
  # operator applies it when it creates the bucket and updates an existing
  # bucket whose TTL differs. Copy results out (nats kv get) before they expire.
  resultsTTL: 720h

# Additional args to pass to the manager
extraArgs: []

# Completion webhook notifications (spec.notify on Chains/Missions). The
# operator only POSTs to URLs matching one of these prefixes — this is the
# SSRF guard, since anyone who can create a Chain controls notify.url. An
# empty list rejects every notification (feature disabled).
# Example:
#   allowedURLPrefixes:
#     - http://molt.ai.svc:18789/
notify:
  allowedURLPrefixes: []

# Agent cards (docs/agent-cards.md): the RoundTable controller keeps one card
# per knight in this NATS KV bucket, key <table>.<knight>
# (CARDS_KV_BUCKET; knight pods get it as KNIGHT_CARDS_BUCKET). The bucket is
# created if missing (history 1, no TTL).
cards:
  bucket: roundtable-cards

# Global image settings for managed components — pinned to git SHAs of each
# repo's main; bump here (with a chart version bump), then update the chart
# version in dapper-cluster
images:
  piKnight:
    repository: ghcr.io/roundtable-k8s/pi-knight
    tag: 311d428aba9aea3d9b2e37feab237c378046e718
  dashboard:
    repository: ghcr.io/roundtable-k8s/roundtable-ui
    tag: 24615ccda6af6136eb81ee07e535c00bd73095a5

# Pod-level security context for knight pods. Set once here; the operator
# applies it to every knight. OnRootMismatch stops kubelet from recursively
# chowning a knight's volumes on every pod mount.
knightSecurity:
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch

# Pinned nixpkgs ref for knight tools images — an immutable commit for
# reproducible builds. Bump to roll the whole fleet's tooling forward (changing
# this changes every tools image tag, so every knight's tools are rebuilt).
nixpkgs:
  ref: "9ae611a455b90cf061d8f332b977e387bda8e1ca" # nixos-unstable @ 2026-06-10

# Per-knight tools images: how knights get their spec.tools.nix packages. For
# each unique list the operator runs a one-off Job that builds an OCI image
# with nix2container and pushes it (tag = hash of the tool list), and the
# knight mounts that image read-only at /nix as an image volume. Identical
# lists share one image and are built once. Needs Kubernetes image volumes (on
# by default from 1.35) and containerd 2.1+. Without a repository, knights run
# without their Nix tools and get a ToolsImageNotConfigured warning event.
toolsImage:
  # Repository knights (i.e. the nodes) pull from, e.g.
  # registry.example.com/knight-tools. Empty disables tools images.
  repository: ""
  # Repository the build Job pushes to, when it reaches the registry by a
  # different address than the nodes (e.g. an in-cluster Service). Defaults to
  # repository.
  pushRepository: ""
  # Push over plain HTTP (in-cluster Service without TLS).
  pushInsecure: false
  # Image the build Job runs. Empty uses the prebuilt builder CI publishes for
  # the operator's built-in pins (ghcr.io/roundtable-k8s/tools-builder, with the
  # nix2container tooling already built), or plain digest-pinned nixos/nix when
  # nixpkgs.ref or nix2containerRev is overridden. Plain Nix compiles that
  # tooling on every build, which takes many minutes on a small node.
  builderImage: ""
  # nix2container commit the generated flake pins; defaults to the operator's
  # built-in pin. Changing it changes every tools image tag.
  nix2containerRev: ""

# Isolation defaults (#387). Every knight runs under isolation.runtimeClassName
# and behind default-deny egress (DNS, NATS, the Kubernetes API, baseHosts, its
# arsenal git hosts and its own spec.egress.allowedHosts) unless the Knight
# opts out with spec.isolation and a reason. A knight whose RuntimeClass does
# not exist is parked (Isolated=False, RuntimeClassNotFound): install gVisor
# first, or set runtimeClassName: "" to turn the default off for the whole
# install. egress.mode: "off" renders an egress policy only for knights (or
# tables) that set egress. Knights that set runtimeClassName or spec.egress
# themselves are honoured either way. See docs/runtime-isolation.md and
# docs/egress.md.
isolation:
  # Default RuntimeClass for every knight (KNIGHT_DEFAULT_RUNTIME_CLASS).
  runtimeClassName: gvisor
  egress:
    # "deny" or "off" (KNIGHT_DEFAULT_EGRESS). Quote "off": YAML reads a bare
    # off as false (which is treated as "off" too).
    mode: deny
    # Hosts every knight may reach on 443, e.g. its model providers
    # (KNIGHT_EGRESS_BASE_HOSTS).
    baseHosts:
      - openrouter.ai
      - api.anthropic.com

# NATS URL given to mission knights when neither the parent RoundTable nor the
# mission's roundTableTemplate sets one (MISSION_DEFAULT_NATS_URL).
missionDefaultNatsURL: nats://nats.database.svc.cluster.local:4222

# Egress NetworkPolicy the operator creates for each mission's knights. The NATS
# rule is derived from the mission's NATS URL (namespace and port); TCP 443 is
# allowed to anywhere. Not created when isolation.egress.mode is "deny": each
# mission knight then gets its own default-deny policy. Set enabled=false on clusters without NetworkPolicy
# support or that manage their own policies. The nats and dns peers below also
# apply to the egress policy of knights with spec.egress (enabled does not).
missionNetworkPolicy:
  enabled: true
  nats:
    # Optional pod labels narrowing the NATS peer; empty = whole namespace.
    podLabels:
      app.kubernetes.io/name: nats
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns

# Ingress NetworkPolicies for the operator, the dashboard and knight pods. Off
# by default: nothing extra is rendered. When enabled, each policy selects its
# pods in the release namespace and allows only the ports listed below; a
# policy with no allowed peers allows nothing. See docs/helm-values.md.
networkPolicy:
  enabled: false
  # NetworkPolicyPeers allowed to scrape metrics (operator and knights) and,
  # for the dashboard, to reach it too. Default: the monitoring namespace.
  metricsFrom:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  # NetworkPolicyPeers allowed to reach the dashboard's http port, in addition
  # to metricsFrom. Empty means only metricsFrom can reach it.
  dashboardFrom: []
  # NetworkPolicyPeers allowed to send OTLP (4317/4318) to the collector when
  # telemetry.collector.enabled. Default: pods in the release namespace; add
  # a namespaceSelector for knights elsewhere. Empty allows no one.
  otlpFrom:
    - podSelector: {}
  # Port of the operator's metrics endpoint when it is enabled through
  # extraArgs. Ignored when metrics.enabled is true: the policy then allows
  # the chart-managed port 8080.
  operatorMetricsPort: 8443

# Dashboard (Round Table UI) — observability platform
# OpenTelemetry export for the operator, gateway and dashboard (#343). Sets the
# standard OTEL_* env vars on their Deployments. Off by default.
telemetry:
  enabled: false
  otlp:
    endpoint: ""          # e.g. http://otel-collector.observability:4317
    protocol: grpc        # grpc | http/protobuf
  sampling:
    ratio: 1.0            # parentbased_traceidratio
  captureContent: true    # prompt/response text on gen_ai spans (redacted); only matters when enabled
  resourceAttributes: {}  # extra key=value pairs (cluster name, env...)
  traceUrlTemplate: ""    # UI deep link, e.g. https://grafana/explore?...{traceId}
  # Optional OpenTelemetry Collector (#386): OTLP in, secrets redacted, exporters
  # plugged in through values. When enabled and otlp.endpoint is empty, the
  # operator/gateway/dashboard export to this collector's Service.
  collector:
    enabled: false
    # Pod scheduling for the collector (empty = use the global values).
    nodeSelector: {}
    affinity: {}
    tolerations: []
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.120.0"
    resources: {}
    redaction:
      enabled: true
      # Go (RE2) regexes. The default list is ported from the knights' shared
      # secret pattern list (pi-knight src/hooks.ts SECRET_PATTERNS, used by
      # redactSecrets). Setting this replaces the list.
      blockedValues:
        - '(?i)(?:api[_-]?key|apikey|secret[_-]?key|access[_-]?token|auth[_-]?token|bearer)\s*[:=]\s*[''"]?[A-Za-z0-9_\-/.+=]{20,}'
        - '(?i)-----BEGIN (?:RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
        - 'ghp_[A-Za-z0-9_]{36,}'
        - 'ghs_[A-Za-z0-9_]{36,}'
        - 'sk-[A-Za-z0-9]{40,}'
        - 'xoxb-[A-Za-z0-9\-]+'
        - 'AKIA[A-Z0-9]{16}'
    exporters:            # passed through verbatim into the collector config
      debug: {}
    pipelines:            # exporters each signal uses
      traces: [debug]
      metrics: [debug]
      logs: [debug]
    extraConfig: {}       # merged last, for processors/connectors we don't model

dashboard:
  enabled: true
  replicas: 1
  # Pod scheduling for the dashboard Deployment (empty = use the global values).
  nodeSelector: {}
  affinity: {}
  tolerations: []
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
  env:
    NATS_URL: "nats://nats.database.svc:4222"
    NAMESPACE: "roundtable"
    FLEET_PREFIX: "fleet-a"
    FLEET_STREAM: "fleet_a_results"
  vault:
    enabled: true
    claimName: "roundtable-vault"
  # Token the dashboard sends to the gateway (mounted read-only; the dashboard
  # re-reads it on a 401). Empty = the gateway's own token Secret and key.
  gateway:
    tokenSecret: ""
    tokenKey: ""

# Invoke gateway: a synchronous HTTP API and MCP (streamable HTTP) endpoint in
# front of the knights. Callers POST a task, the gateway publishes it on the
# knight's NATS subject and waits for the result (or returns 202 {taskId} to
# poll). See docs/gateway.md. Runs as its own Deployment from the operator
# image (/gateway) with read-only RBAC on Knights and RoundTables.
gateway:
  enabled: true
  replicas: 1
  # Pod scheduling for the gateway (empty = use the global values).
  nodeSelector: {}
  affinity: {}
  tolerations: []
  # Image; defaults to the operator image (image.repository:image.tag).
  image:
    repository: ""
    tag: ""
  # NATS server the knights' RoundTables use.
  natsURL: nats://nats.database.svc:4222
  # Default namespace for knights; empty means the release namespace.
  namespace: ""
  # Extra namespaces callers may target ("*" for any). Widen the RBAC to
  # match: the gateway gets a ClusterRole, so it can read Knights anywhere.
  allowedNamespaces: []
  # How long invoke waits when the caller doesn't pass timeoutSeconds, and
  # the most a caller may ask for (invoke timeoutSeconds, and waitSeconds of
  # chain runs and missions). Longer waits return 202 to poll. A proxy or
  # client between the caller and the gateway needs its own timeout raised
  # to match (see docs/gateway.md).
  defaultTimeout: 60s
  maxTimeout: 30m
  # Concurrently waiting invocations per replica; beyond it callers get 429.
  maxInFlight: 64
  # Concurrently open event streams (GET .../events) per replica; beyond it
  # callers get 429. 0 = unlimited.
  maxStreams: 64
  # NATS KV bucket holding task records (taskId -> status/result) and how
  # long they are kept. The operator records the tasks of Triggers with a
  # knight target there too (also when the gateway is disabled).
  taskBucket: roundtable_gateway_tasks
  taskTTL: 168h
  # Bearer-token auth (always on). Leave existingSecret empty and the chart
  # generates a random token into <fullname>-gateway-token (kept across
  # upgrades and uninstall) and wires the dashboard to it. To bring your own,
  # set existingSecret; the key holds the token, and two tokens on separate
  # lines rotate without downtime. Create it with e.g.
  #   kubectl create secret generic roundtable-gateway-token \
  #     --from-literal=token="$(openssl rand -hex 32)"
  auth:
    existingSecret: ""
    secretKey: token
  # In-cluster callers authenticate with their own Kubernetes ServiceAccount
  # token (a projected token with this audience), so a CronJob or sync job
  # needs no stored credential. The gateway validates a bearer token that is
  # not a static token with a TokenReview and records the caller as
  # <namespace>/<name>. This first version lets any allowed ServiceAccount use
  # the whole gateway API; the NetworkPolicy below stays the outer control.
  # When enabled, the gateway gets create on tokenreviews.authentication.k8s.io
  # (a ClusterRole). See docs/gateway.md#calling-from-a-workload.
  serviceAccountAuth:
    enabled: true
    audience: roundtable-gateway
    # Namespaces whose ServiceAccounts may call ("*" = any, an empty list too).
    allowedNamespaces: ["*"]
  service:
    type: ClusterIP
    port: 80
  # NetworkPolicy limiting who can reach the gateway, on top of the token.
  # `from` is a list of NetworkPolicyPeers; the default allows pods in the
  # release namespace only. Add e.g. a namespaceSelector for OpenClaw, and
  # one for each webhook sender's namespace (Alertmanager, Flux, ...).
  networkPolicy:
    enabled: true
    from:
      - podSelector: {}
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
  extraArgs: []
  # Mission endpoints (POST/GET/DELETE /v1/missions and the start_mission,
  # get_mission and list_missions MCP tools). Callers send a restricted
  # request (objective, table, budget, planner knight, existing knights and
  # chains): never images, Secrets, pod specs or RoundTable templates. When
  # enabled, the gateway gets create/delete on Missions in its namespace and
  # allowedNamespaces (a ClusterRole if allowedNamespaces holds "*").
  missions:
    enabled: true
    # Upper bound on a mission's costBudgetUSD (which callers must set).
    maxBudgetUSD: 10
    # Upper bounds on ttlSeconds and timeoutSeconds.
    maxTTLSeconds: 86400
    maxTimeoutSeconds: 21600
    # Let callers set planner.allowSkillGeneration.
    allowSkillGeneration: false
  # Chain runs (POST /v1/chains/{name}/runs, GET /v1/runs and the
  # list_chains, run_chain, get_run and list_runs MCP tools). Only Chains
  # labelled ai.roundtable.io/invokable: "true" can be run; each run is a copy
  # of the Chain with the caller's input (never the caller's steps). When
  # enabled, the gateway gets create/delete on Chains in its namespace and
  # allowedNamespaces (a ClusterRole if allowedNamespaces holds "*").
  runs:
    enabled: true
  # How long a finished run copy is kept before the gateway deletes it.
  runTTL: 24h
  # Schedules (GET /v1/schedules, GET /v1/schedules/<namespace>/<name> and
  # .../manifest, see docs/gateway.md): Triggers with a schedule source.
  # When enabled, the gateway gets get, list and watch on Triggers in its
  # namespace and allowedNamespaces (a ClusterRole if allowedNamespaces holds
  # "*").
  schedules:
    enabled: true
  # Run history of schedules (GET /v1/schedules/<namespace>/<name>/runs and
  # .../runs/<run>, see docs/gateway.md#schedule-run-history). When enabled,
  # the gateway may get Triggers.
  # resultRetention is how long the results of a schedule's runs stay
  # readable. It raises gateway.taskTTL (the task bucket TTL, for knight
  # targets) to at least that, and keeps the finished chain runs of schedule
  # Triggers at least that long, over their ttlSecondsAfterFinished (0 there
  # still keeps them). An existing task bucket keeps its TTL: see
  # docs/gateway.md.
  scheduleRuns:
    enabled: true
    resultRetention: 720h
  # Webhook Triggers (POST /v1/hooks/<namespace>/<trigger>, see
  # docs/triggers.md). Outside the bearer-token auth: each delivery must carry
  # the Trigger's own bearer token or HMAC signature, from a Secret in the
  # Trigger's namespace labelled ai.roundtable.io/webhook-secret: "true".
  # When enabled, the gateway gets get on Triggers and get (not list) on
  # Secrets in its namespace and allowedNamespaces (a ClusterRole if
  # allowedNamespaces holds "*"); it uses only the labelled ones.
  hooks:
    enabled: true
    # Largest body accepted (413 beyond).
    maxBodyBytes: 1048576
    # Deliveries per second each Trigger accepts on average, and at once
    # (429 with Retry-After beyond).
    rate: 2
    burst: 20

# Knights to create alongside the operator
# Example:
# knights:
#   galahad:
#     domain: security
#     model: openrouter/deepseek/deepseek-v3.2
#     skills: [security, opencti, shared]
#     tools:
#       nix: [nmap, whois, bind]
#     nats:
#       subjects: ["fleet-a.tasks.security.>"]
#     taskTimeoutSeconds: 300
#     # corev1.ResourceRequirements for the knight's app container.
#     resources:
#       requests: {cpu: 100m, memory: 256Mi}
#       limits: {memory: 1Gi}
#     # Mount a refreshing GitHub token file (GITHUB_TOKEN_FILE) instead of
#     # a frozen env token. Overrides the knight's RoundTable spec.github.
#     github:
#       tokenSecretRef:
#         name: roundtable-github-token
#         key: token
#   rt-operator:
#     domain: operator
#     skills: [operator, shared]
#     coder: true   # build/test code: gets codingKnightDefaults below unless
#                   # the knight sets its own resources / workspace
knights: {}

# Defaults for knights with `coder: true` (they clone, build and test code).
# Each of resources / workspace applies only when the knight doesn't set its
# own. Without ephemeral-storage the namespace LimitRange default (often 4Gi)
# evicts the pod mid-build, so it is set explicitly. For knights that live in a
# RoundTable, set the same under RoundTable spec.defaults.resources /
# spec.defaults.workspace; standing knights with the table label inherit them.
codingKnightDefaults:
  resources:
    requests: {cpu: "1", memory: 2Gi, ephemeral-storage: 4Gi}
    limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 20Gi}
  workspace:
    size: 20Gi

# Planner defaults (#566). Every RoundTable gets its own planner knight,
# <table>-planner, owned by the table, on the table's NATS prefix and streams
# (<prefix>.tasks.planner.>), with its credentials and spec.defaults, scaled to
# zero when idle. RoundTable spec.planner configures or disables it. model,
# skills, arsenals, prompt, concurrency and taskTimeoutSeconds below are the
# install-wide defaults table planners inherit (a table's spec.planner, then
# its spec.defaults.model / arsenals, win over model and arsenals).
#
# enabled renders the old install-wide planner Knight
# <release>-roundtable-operator-planner (no table, fleet-a names). Off since
# #566; a mission on a table whose planner is disabled can still fall back to
# it (deprecated, with a warning event). Upgrade note: docs/helm-values.md.
planner:
  enabled: false
  domain: operator
  model: claude-sonnet-4-20250514
  skills:
    - operator
    - shared
  # Prompt overrides for table planners (identity, instructions,
  # configMapRef), as in Knight spec.prompt. Empty = the runtime's own.
  prompt: {}
  concurrency: 1
  taskTimeoutSeconds: 600
  # runtimeClassName, the scheduling fields and github apply to the
  # install-wide planner only; table planners take them from their RoundTable.
  # RuntimeClass for the planner pod. Empty = the operator default
  # (isolation.runtimeClassName).
  runtimeClassName: ""
  # Pod scheduling for the planner knight, passed verbatim to the Knight spec
  # (empty = unset).
  nodeSelector: {}
  affinity: {}
  tolerations: []
  topologySpreadConstraints: []
  priorityClassName: ""
  # Ordered skill sources merged into /skills (first = base, later entries
  # override per skill). One git-sync-<name> sidecar per git entry. Also the
  # default arsenals of table planners.
  arsenals:
    - name: platform
      repo: https://github.com/roundtable-k8s/arsenal.git
      ref: main
      periodSeconds: 300
  #   - name: personal
  #     repo: https://github.com/<you>/<your-skills>.git
  # GitHub token Secret mounted read-only at
  # /var/run/secrets/roundtable/github/token (GITHUB_TOKEN_FILE). The kubelet
  # refreshes the file when the Secret rotates, so short-lived GitHub App
  # installation tokens keep working; the knight image's git credential
  # helper and gh shim read it on every call. The install-wide planner is not
  # part of a RoundTable, so it does not inherit spec.github from one; set it
  # here. Table planners use their table's spec.github instead.
  github: {}
  #   tokenSecretRef:
  #     name: roundtable-github-token
  #     key: token

# PR pipeline Chain (#225): plan → implement → review → bounded fix loop →
# merge (gh pr merge --auto) or escalate (label needs-human). Run it for an
# issue by setting spec.input to {"repo": "<owner>/<repo>", "issue": <n>} and
# annotating ai.roundtable.io/run. See docs/pr-pipeline.md.
# Every knight below must exist in the release namespace, and the RoundTable
# must define the model aliases it uses (deep, fast, and cheap when listed in
# implementModels; spec.modelAliases, e.g. cheap: haiku), resolvable on the
# coders' runtime. Lead steps use no alias (see leadModel).
prPipeline:
  enabled: false
  name: pr-pipeline
  roundTableRef:
    name: roundtable-dev
  # Plans, reviews, merges and escalates.
  lead: rt-lead
  # Optional model for the lead's steps (plan, review, merge, escalate): an alias
  # or a model valid for the lead's runtime. Empty = the lead knight's default
  # model, which works for any runtime (e.g. a pi-knight lead).
  leadModel: ""
  # Coder knights the planner may pick from. One implement step per coder ×
  # implementModels entry, one split (forEach) step and one fix loop per coder
  # are rendered; `when` runs only the planner's pick.
  coders:
    - rt-operator
  # Model aliases the planner may pick for the implementation. Add `cheap` (a
  # RoundTable alias for Haiku) to let the planner draft small, well-specified
  # issues on the cheapest tier: [cheap, fast, deep].
  implementModels:
    - deep
    - fast
  # Model alias for every fix round. Keep it stronger than the cheap tier so a
  # Haiku draft is fixed by fast (Sonnet) or deep (Opus).
  fixModel: deep
  # Fallback coder knight (#321). When a coder knight refuses a task for plan
  # quota ("Task refused: Claude plan ... (resets ...)"), the operator re-runs
  # the same implement/split/fix step on this knight with NO model override:
  # the cheap/fast/deep aliases are Claude models, so the fallback runs its own
  # default model. Use a knight on a runtime with its own quota (e.g. rt-coder,
  # a pi-knight on GLM via OpenRouter, subject "rt-dev.tasks.coder.>").
  # Empty: a refusal defers the step until the plan window resets.
  fallbackCoder: ""
  # Fix → re-review rounds before escalating.
  maxIterations: 3
  # Who checks a finished run on GitHub (#538, docs/pr-pipeline.md). builtin:
  # the operator (spec.issuePickup.postRun: builtin, the default). chain: the
  # chain's own verify, close_parent and handback steps call the arsenal
  # scripts in postRunScripts; set spec.issuePickup.postRun: chain on the
  # table too, so the operator stops doing the same work.
  postRun: builtin
  # Directory of the arsenal's post-run scripts (rt-verify, rt-close-parent,
  # rt-handback) in the lead knight's pod. Only used with postRun: chain.
  postRunScripts: /skills/project/pr-postrun/scripts
  timeoutSeconds: 86400
  maxQueueWaitSeconds: 3600
  # Optional initial input, e.g. '{"repo": "roundtable-k8s/roundtable", "issue": 225}'.
  input: ""
  # Feedback Chain (#226, docs/pr-feedback.md) fed by the operator's PR
  # feedback watcher (RoundTable spec.prFeedback): a red CI run or a
  # merge-queue rejection of a pipeline PR goes back to its author knight
  # (resuming the pipeline's session), then the lead re-queues the PR. Uses
  # lead, coders and roundTableRef above. Off by default.
  feedback:
    enabled: false
    name: pr-pipeline-feedback
    timeoutSeconds: 7200

# Prometheus metrics. Everything is opt-in. The operator serves plain HTTP
# metrics (--metrics-secure=false) so a ServiceMonitor can scrape it without
# TLS or authn/authz configuration; restrict access with networkPolicy if needed.
# Monitors are only rendered when the monitoring.coreos.com/v1 API is served.
metrics:
  enabled: false
  # Scrape interval for all monitors.
  interval: 1m
  # Extra labels added to every monitor (e.g. the Prometheus selector label).
  labels: {}
  serviceMonitor:
    # ServiceMonitors for the operator, the gateway (when gateway.enabled) and
    # (when dashboard.enabled) the dashboard.
    enabled: false
  podMonitor:
    # PodMonitor for knight pods (port 3000, container "app").
    enabled: false

# PrometheusRule with the Round Table alerts (#332). Off by default; needs the
# monitoring.coreos.com/v1 API (prometheus-operator). Knight alerts use the
# roundtable_knight_* metrics and keep `table` in every aggregation.
alerts:
  enabled: false
  # LLM spend per table over 24h above which KnightLLMCostSpike fires (USD).
  costSpikeUSDPer24h: 15
  # Failed tasks per knight per hour above which KnightTaskFailures fires.
  taskFailuresPerHour: 2
  # p95 chain step duration (seconds, over 1h) above which
  # RoundtableChainStepsSlow fires. Step histogram buckets stop at ~34min.
  chainStepSlowSeconds: 1800
  # Failed share (0-1) of chain runs over 1h above which
  # RoundtableChainRunsFailing fires.
  chainFailureRatio: 0.5
  # Minutes a dead letter may stay open before RoundtableDeadLettersOpen fires.
  deadLettersOpenMinutes: 15
  # Extra labels on every rule; `severity` here overrides the default "warning".
  labels: {}
  scaling:
    # roundtable.scaling group (KEDA scaler errors, HPA ScalingActive=false).
    # Needs KEDA's and kube-state-metrics' metrics; disable if you have neither.
    enabled: true

# Grafana dashboards (fleet overview, cost and tokens), built on the
# roundtable_* metrics. Off by default: nothing is rendered. They need
# Prometheus scraping the operator and knights; see docs/helm-values.md.
dashboards:
  enabled: false
  # Label the Grafana sidecar selects ConfigMaps by.
  label: grafana_dashboard
  labelValue: "1"
  # Optional Grafana folder. Set on the sidecar ConfigMaps as the annotation
  # below, or as spec.folder of the GrafanaDashboard CRs.
  folder: ""
  folderAnnotation: grafana_folder
  # Render GrafanaDashboard CRs (grafana.integreatly.org/v1beta1) instead of
  # ConfigMaps. Only takes effect when that API is available in the cluster;
  # otherwise the ConfigMaps are rendered.
  grafanaOperator:
    enabled: false
    # matchLabels selecting the Grafana instance(s) to load the dashboards into.
    instanceSelector:
      dashboards: grafana
