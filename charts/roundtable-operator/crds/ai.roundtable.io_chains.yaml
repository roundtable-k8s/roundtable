---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: chains.ai.roundtable.io
spec:
  group: ai.roundtable.io
  names:
    categories:
    - roundtable
    kind: Chain
    listKind: ChainList
    plural: chains
    shortNames:
    - ch
    singular: chain
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.schedule
      name: Schedule
      type: string
    - jsonPath: .spec.timeZone
      name: TimeZone
      type: string
    - jsonPath: .status.nextScheduledAt
      name: Next
      type: date
    - jsonPath: .status.runsCompleted
      name: Runs
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Chain is the Schema for the chains API.
          A Chain represents a declarative multi-knight task pipeline in the Round Table,
          with support for parallel fan-out, sequential dependencies, data passing between
          steps, and optional cron scheduling.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Chain
            properties:
              description:
                description: description is a human-readable summary of what this
                  chain accomplishes.
                type: string
              input:
                description: input provides initial data passed to the first step(s)
                  as JSON.
                type: string
              maxQueueWaitSeconds:
                description: |-
                  maxQueueWaitSeconds is how long a published step task may wait for its
                  knight to pick it up before the step fails. The per-step timeout only
                  starts counting once the knight has picked the task up, so a busy (or
                  dead) knight is bounded by this guard instead. Defaults to 1800 when unset.
                format: int32
                maximum: 86400
                minimum: 30
                type: integer
              missionRef:
                description: |-
                  missionRef names the Mission that owns a mission-scoped chain. It is set
                  by the mission controller; the chain controller resolves NATS config
                  from the mission's RoundTable through it.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              notify:
                description: |-
                  notify configures a completion notification fired exactly once per run
                  when the chain reaches a terminal phase (Succeeded, Failed,
                  PartiallySucceeded).
                properties:
                  webhook:
                    description: |-
                      webhook posts a roundtable.notify/v1 JSON payload to an HTTP endpoint.
                      The URL must match one of the operator's allowed URL prefixes
                      (notify.allowedURLPrefixes Helm value); non-matching URLs are rejected
                      with a NotificationSent=False condition and a warning Event.
                    properties:
                      context:
                        additionalProperties:
                          type: string
                        description: |-
                          context is an opaque map echoed verbatim in the payload, letting the
                          caller correlate the completion back to its origin (e.g. a chat
                          session or channel).
                        type: object
                      tokenSecretRef:
                        description: |-
                          tokenSecretRef references a Secret key (in the resource's namespace)
                          holding a bearer token sent in the Authorization header. Never inline
                          tokens in the spec.
                        properties:
                          key:
                            description: The key of the secret to select from.  Must
                              be a valid secret key.
                            type: string
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                          optional:
                            description: Specify whether the Secret or its key must
                              be defined
                            type: boolean
                        required:
                        - key
                        type: object
                        x-kubernetes-map-type: atomic
                      url:
                        description: url is the endpoint to POST the completion payload
                          to.
                        minLength: 1
                        pattern: ^https?://
                        type: string
                    required:
                    - url
                    type: object
                type: object
              outputKnightRef:
                description: |-
                  outputKnightRef names the Knight that writes chain artifacts when steps
                  have outputPath set. Defaults to the knight "gawain".
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              retryPolicy:
                description: retryPolicy configures retry behavior for failed steps.
                properties:
                  backoffSeconds:
                    default: 30
                    description: backoffSeconds is the delay between retries in seconds.
                    format: int32
                    type: integer
                  maxRetries:
                    default: 0
                    description: maxRetries is the maximum number of retries per step.
                    format: int32
                    maximum: 5
                    minimum: 0
                    type: integer
                type: object
              roundTableRef:
                description: |-
                  roundTableRef names the RoundTable this chain belongs to (same namespace).
                  It supplies the NATS subjects and streams the steps are published on.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              schedule:
                description: |-
                  schedule is an optional cron expression to trigger this chain on a recurring basis.
                  Uses standard cron syntax (e.g., "0 */6 * * *").
                type: string
              startingDeadlineSeconds:
                description: |-
                  startingDeadlineSeconds bounds catch-up of missed scheduled runs.
                  If the controller was down when a scheduled run should have fired, the
                  run is triggered late only if fewer than this many seconds have passed
                  since the missed schedule time. If not set, a missed run is always
                  caught up (at most one catch-up run is triggered).
                format: int64
                minimum: 1
                type: integer
              steps:
                description: |-
                  steps defines the ordered list of pipeline steps.
                  Steps execute sequentially unless parallel grouping is used via `parallel`.
                items:
                  description: ChainStep defines a single step in the pipeline.
                  properties:
                    continueOnFailure:
                      default: false
                      description: continueOnFailure allows downstream steps to proceed
                        even if this step fails.
                      type: boolean
                    dependsOn:
                      description: |-
                        dependsOn lists step names that must complete successfully before this step runs.
                        If empty, the step runs immediately (or after the previous step in sequence).
                      items:
                        type: string
                      type: array
                    failurePolicy:
                      description: |-
                        failurePolicy decides what a failed item does to a forEach step.
                        failFast (default): no further items are dispatched once an item fails
                        (after its retries); in-flight items finish, the rest are Skipped and the
                        step fails. continue: every item runs; the step succeeds unless every
                        item failed, and a chain with failed items ends PartiallySucceeded.
                        Only valid together with forEach.
                      enum:
                      - failFast
                      - continue
                      type: string
                    fallbackRef:
                      description: |-
                        fallbackRef names the Knight (same namespace) that re-runs this step
                        when the primary knight refuses the task for plan quota (#321: a
                        claude-knight plan-reserve refusal, "Task refused: Claude plan ...
                        (resets ...)"). The re-run uses NO model override - the
                        cheap/fast/deep aliases resolve to Claude models, so the fallback runs
                        its own default model. For a loop step it applies to the loop's body
                        steps. Unset - or a refusal on the fallback too - the step is deferred
                        until the plan window resets and the chain requeues then (it neither
                        fails nor escalates).
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    forEach:
                      description: |-
                        forEach fans this step out: it runs once per element of a JSON list taken
                        from the chain input or a prior step's output. The task template gets the
                        element as {{ .Item }} (alias {{ .item }}), its compact JSON as
                        {{ .ItemJSON }} and its zero-based position as {{ .ItemIndex }}. Every
                        item is its own task with its own taskId and a per-item runId. When all
                        items are done the step output is the joined JSON array of per-item
                        results ({index, item, phase, output, error}), which downstream steps read
                        through {{ .Steps.<name>.Output }}.
                      properties:
                        from:
                          description: |-
                            from names the JSON document holding the list: "input" (spec.input) or
                            "steps.<stepName>" (that step's output; the step must be listed in
                            dependsOn). Prose around the JSON is tolerated when the JSON sits in a
                            fenced ```json code block.
                          pattern: ^(input|steps\.[A-Za-z0-9_-]+)$
                          type: string
                        maxItems:
                          default: 50
                          description: |-
                            maxItems is the largest list the step accepts. A longer list fails the
                            step instead of being silently truncated.
                          format: int32
                          maximum: 200
                          minimum: 1
                          type: integer
                        path:
                          description: |-
                            path is a JSONPath expression (kubectl syntax, e.g. "{.issues}" or
                            ".issues[*].number") evaluated against the document. A single list
                            result is the item list; otherwise the values found form the list. When
                            empty the document itself must be a JSON array.
                          type: string
                        uniqueBy:
                          description: |-
                            uniqueBy names a key every item (a JSON object) must have. Items whose
                            value under that key repeats an earlier item's are dropped, so the list
                            fans out once per distinct value (e.g. "number": one task per issue).
                            An item that is not an object or lacks the key fails the step.
                          pattern: ^[A-Za-z_][A-Za-z0-9_-]*$
                          type: string
                      required:
                      - from
                      type: object
                    knightRef:
                      description: |-
                        knightRef names the Knight (same namespace) that executes this step.
                        Required unless the step is a loop (whose body steps name their own
                        knights).
                      properties:
                        name:
                          default: ""
                          description: |-
                            Name of the referent.
                            This field is effectively required, but due to backwards compatibility is
                            allowed to be empty. Instances of this type with an empty value here are
                            almost certainly wrong.
                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                          type: string
                      type: object
                      x-kubernetes-map-type: atomic
                    loop:
                      description: |-
                        loop makes this step a bounded loop: its body steps run in order, round
                        after round, until the until expression holds or maxIterations rounds
                        have run. A loop step has no knightRef, task, forEach, model, retry or
                        outputPath of its own; its output is the output of the last step that
                        ran in it.
                      properties:
                        from:
                          description: |-
                            from names the step (listed in dependsOn) whose result the loop starts
                            from, e.g. the first review. It seeds last, so until is checked before
                            the first round (a review that already passes runs zero rounds) and the
                            first body step sees it as {{ .Loop.Last.Output }}.
                          type: string
                        maxIterations:
                          default: 3
                          description: maxIterations bounds the number of rounds.
                          format: int32
                          maximum: 20
                          minimum: 1
                          type: integer
                        onExhausted:
                          description: |-
                            onExhausted decides the step's phase when maxIterations rounds ran
                            without until holding: fail (default) fails the step; continue
                            succeeds it with outcome Exhausted so dependents can branch on
                            steps.<name>.outcome. Either way the outcome is Exhausted.
                          enum:
                          - fail
                          - continue
                          type: string
                        steps:
                          description: |-
                            steps is the loop body, run in order each round. Body tasks are
                            published with the chain's runId, so a knight that already worked on
                            this run (e.g. the coder of an earlier implement step) resumes the same
                            agent session. Body task templates get, besides .Steps and .Input,
                            .Loop.Iteration (1-based), .Loop.MaxIterations, .Loop.Last (the
                            previous step in the flow: {Step, Phase, Output, Error}) and
                            .Loop.Steps.<body>.Output/.Error (latest round each ran in).
                          items:
                            description: ChainLoopStep is one step of a loop body.
                            properties:
                              knightRef:
                                description: knightRef names the Knight that runs
                                  this body step.
                                properties:
                                  name:
                                    default: ""
                                    description: |-
                                      Name of the referent.
                                      This field is effectively required, but due to backwards compatibility is
                                      allowed to be empty. Instances of this type with an empty value here are
                                      almost certainly wrong.
                                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                    type: string
                                type: object
                                x-kubernetes-map-type: atomic
                              model:
                                description: |-
                                  model overrides the knight's model for this body step (same rules as
                                  ChainStep.model, including RoundTable model aliases).
                                maxLength: 256
                                pattern: ^[A-Za-z0-9][A-Za-z0-9._:/@\[\]-]*$
                                type: string
                              name:
                                description: name identifies the body step within
                                  its loop.
                                maxLength: 63
                                minLength: 1
                                pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                                type: string
                              retry:
                                description: |-
                                  retry configures retries of a failed body task (per round), overriding
                                  the chain-level retryPolicy.
                                properties:
                                  backoffSeconds:
                                    default: 30
                                    description: backoffSeconds is the delay between
                                      retries in seconds.
                                    format: int32
                                    minimum: 1
                                    type: integer
                                  maxAttempts:
                                    default: 0
                                    description: maxAttempts is the maximum number
                                      of retry attempts for this step.
                                    format: int32
                                    maximum: 10
                                    minimum: 0
                                    type: integer
                                type: object
                              task:
                                description: task is the task template (see ChainLoop.steps
                                  for the extra .Loop data).
                                minLength: 1
                                type: string
                              timeoutSeconds:
                                default: 120
                                description: |-
                                  timeoutSeconds is the per-task timeout in seconds, counted from knight
                                  pickup.
                                format: int32
                                maximum: 3600
                                minimum: 10
                                type: integer
                            required:
                            - knightRef
                            - name
                            - task
                            type: object
                          maxItems: 5
                          minItems: 1
                          type: array
                        until:
                          description: |-
                            until is a CEL expression; the loop ends with outcome Converged as soon
                            as it is true. Variables: everything when gets (input, steps), plus
                            last ({step, phase, output, error}), iteration (the round just
                            finished, 0 on entry), maxIterations and body, a map from body step
                            name to {phase, output, error, iteration}. Example:
                              last.output.contains("Verdict: ship it")
                          maxLength: 4096
                          minLength: 1
                          type: string
                      required:
                      - steps
                      - until
                      type: object
                    maxParallel:
                      description: |-
                        maxParallel caps how many items of a forEach step are in flight at once.
                        Defaults to the knight's concurrency. Only valid together with forEach.
                      format: int32
                      maximum: 100
                      minimum: 1
                      type: integer
                    model:
                      description: |-
                        model overrides the knight's spec.model for this step only. It is either
                        a model ID or the name of an alias from the chain's RoundTable
                        spec.modelAliases (an alias name wins over a literal model ID). The
                        resolved model must suit the knight's runtime: a Claude model ("opus",
                        "sonnet", "haiku", "claude-...") on a claude-knight, a "provider/model"
                        on a pi-knight. A mismatch fails the step without dispatching it.
                        Empty means the knight's default model.
                      maxLength: 256
                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:/@\[\]-]*$
                      type: string
                    name:
                      description: name is a unique identifier for this step within
                        the chain.
                      minLength: 1
                      type: string
                    outputKey:
                      description: |-
                        outputKey is the key name under which this step's output is stored for downstream steps.
                        Defaults to the step name if not specified.
                      type: string
                    outputPath:
                      description: |-
                        outputPath is an optional file path where this step's output should be written.
                        Supports Go template variables: {{ .Date }} (YYYY-MM-DD), {{ .Chain }} (chain name), {{ .Step }} (step name).
                        When set, the controller dispatches a write task to the outputKnightRef knight after the step succeeds.
                      type: string
                    resumeRunId:
                      description: |-
                        resumeRunId is a CEL expression, with the same variables as when, that
                        yields the runId the step's task carries instead of the chain run's
                        runId. Knights key their agent session by runId, so this lets a step
                        resume the session of an earlier run, e.g. json(input).runId for a
                        follow-up chain fed the original run's ID. An empty result keeps the
                        chain run's runId; an evaluation error fails the step. Not valid on
                        forEach or loop steps.
                      maxLength: 1024
                      type: string
                    retry:
                      description: |-
                        retry configures per-step retry behavior, overriding the chain-level retryPolicy.
                        For a forEach step it applies to each item individually.
                      properties:
                        backoffSeconds:
                          default: 30
                          description: backoffSeconds is the delay between retries
                            in seconds.
                          format: int32
                          minimum: 1
                          type: integer
                        maxAttempts:
                          default: 0
                          description: maxAttempts is the maximum number of retry
                            attempts for this step.
                          format: int32
                          maximum: 10
                          minimum: 0
                          type: integer
                      type: object
                    task:
                      description: |-
                        task is the task prompt or instruction to send to the knight.
                        Supports Go template syntax with access to prior step outputs: {{ .Steps.step_name.Output }}
                        Required unless the step is a loop.
                      type: string
                    timeoutSeconds:
                      default: 120
                      description: |-
                        timeoutSeconds is the per-step timeout in seconds, counted from knight
                        pickup. Overrides the knight's default taskTimeoutSeconds.
                      format: int32
                      maximum: 3600
                      minimum: 10
                      type: integer
                    when:
                      description: |-
                        when is a CEL expression that gates the step. It is evaluated once the
                        step's dependencies are done; false skips the step (phase Skipped,
                        reason WhenFalse) without dispatching anything, and a skipped step
                        satisfies its dependents' dependsOn. An evaluation error fails the step.
                        Variables: input (string) and steps, a map from step name to
                        {phase, output, error, reason, outcome, iterations}; outputs are the
                        full outputs (read back from the chain-outputs KV bucket), not the
                        truncated status copies. Besides standard CEL (contains, startsWith,
                        matches, size, exists, ...) the extended string library and
                        json(string) (parses a JSON document, tolerating a fenced ```json
                        block) are available. Examples:
                          steps.recon.output.contains("22/tcp open")
                          steps.review.phase == "Succeeded" && !steps.review.output.contains("Verdict: ship it")
                          steps.fixloop.outcome == "Exhausted"
                      maxLength: 4096
                      type: string
                  required:
                  - name
                  type: object
                minItems: 1
                type: array
              suspend:
                default: false
                description: suspend, if true, prevents scheduled runs and disallows
                  new executions.
                type: boolean
              timeZone:
                description: |-
                  timeZone is the IANA time zone name (e.g. "America/New_York") the
                  schedule is evaluated in, so "0 7 * * *" fires at 07:00 local time on
                  both sides of a daylight-saving change. Defaults to UTC when unset.
                  "Local" is not accepted.
                maxLength: 64
                pattern: ^[A-Za-z][A-Za-z0-9_+\-]*(/[A-Za-z0-9_+\-]+)*$
                type: string
              timeoutSeconds:
                default: 600
                description: |-
                  timeoutSeconds is the overall chain timeout in seconds. The entire chain
                  is failed if exceeded.
                format: int32
                maximum: 86400
                minimum: 30
                type: integer
            required:
            - steps
            type: object
          status:
            description: status defines the observed state of Chain
            properties:
              completedAt:
                description: completedAt is when the current chain run finished.
                format: date-time
                type: string
              conditions:
                description: conditions represent the current state of the Chain resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastRetryTrigger:
                description: |-
                  lastRetryTrigger is the last value of the ai.roundtable.io/retry-failed
                  annotation that was handled.
                type: string
              lastRunTrigger:
                description: |-
                  lastRunTrigger is the last value of the ai.roundtable.io/run annotation
                  that was handled. A run is only started when the annotation differs.
                type: string
              lastScheduledAt:
                description: lastScheduledAt is when the chain was last triggered
                  by its cron schedule.
                format: date-time
                type: string
              nextScheduledAt:
                description: |-
                  nextScheduledAt is the next time the cron schedule will fire, evaluated
                  in spec.timeZone. Unset when the chain has no schedule or is suspended.
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: phase is the current lifecycle phase of the chain.
                enum:
                - Idle
                - Running
                - Succeeded
                - Failed
                - Suspended
                - PartiallySucceeded
                type: string
              runId:
                description: |-
                  runId uniquely identifies the current (or most recent) chain run.
                  It is embedded in task IDs and NATS KV entries so results produced by
                  a previous run can never be attributed to the current one.
                type: string
              runsCompleted:
                description: runsCompleted is the total number of successful chain
                  runs.
                format: int64
                type: integer
              runsFailed:
                description: runsFailed is the total number of failed chain runs.
                format: int64
                type: integer
              startedAt:
                description: startedAt is when the current chain run began.
                format: date-time
                type: string
              stepStatuses:
                description: stepStatuses tracks the status of each step.
                items:
                  description: ChainStepStatus tracks the execution status of an individual
                    step.
                  properties:
                    completedAt:
                      description: completedAt is when the step finished execution.
                      format: date-time
                      type: string
                    deferUntil:
                      description: deferUntil is when a Deferred step (a plan-quota
                        refusal) runs again.
                      format: date-time
                      type: string
                    error:
                      description: error contains the error message if the step failed.
                      type: string
                    fanOut:
                      description: fanOut tracks the items of a forEach step. Unset
                        for ordinary steps.
                      properties:
                        failed:
                          description: failed is the number of items that failed (after
                            their retries).
                          format: int32
                          type: integer
                        itemPhases:
                          description: |-
                            itemPhases holds one character per item, in list order:
                            P=Pending, R=Running, S=Succeeded, F=Failed, K=Skipped.
                          type: string
                        items:
                          description: items are the detailed per-item entries (bounded;
                            see omittedItems).
                          items:
                            description: ChainItemStatus is the execution state of
                              one forEach item.
                            properties:
                              completedAt:
                                description: completedAt is when the item finished.
                                format: date-time
                                type: string
                              error:
                                description: error is the item's error message (truncated).
                                type: string
                              index:
                                description: index is the item's zero-based position
                                  in the list.
                                format: int32
                                type: integer
                              output:
                                description: output is the item's result (truncated).
                                type: string
                              phase:
                                description: phase is the item's execution phase.
                                enum:
                                - Pending
                                - Running
                                - Succeeded
                                - Failed
                                - Skipped
                                - Deferred
                                type: string
                              pickedUpAt:
                                description: pickedUpAt is when the knight picked
                                  the item task up.
                                format: date-time
                                type: string
                              retries:
                                description: retries is the number of retry attempts
                                  made for this item.
                                format: int32
                                type: integer
                              runId:
                                description: runId is the per-item run identity sent
                                  to the knight.
                                type: string
                              startedAt:
                                description: startedAt is when the item task was published.
                                format: date-time
                                type: string
                              taskId:
                                description: taskID is the NATS task identifier of
                                  the item's current execution.
                                type: string
                              taskSeq:
                                description: taskSeq is the tasks-stream sequence
                                  of the published item task.
                                format: int64
                                type: integer
                            required:
                            - index
                            type: object
                          type: array
                        itemsHash:
                          description: |-
                            itemsHash fingerprints the resolved list; a different list on a later
                            reconcile of the same run fails the step instead of mixing item sets.
                          type: string
                        omittedItems:
                          description: |-
                            omittedItems counts finished items whose detailed entry was dropped to
                            keep the status bounded.
                          format: int32
                          type: integer
                        pending:
                          description: pending is the number of items not dispatched
                            yet.
                          format: int32
                          type: integer
                        running:
                          description: running is the number of items in flight.
                          format: int32
                          type: integer
                        skipped:
                          description: skipped is the number of items that were never
                            run.
                          format: int32
                          type: integer
                        succeeded:
                          description: succeeded is the number of items that succeeded.
                          format: int32
                          type: integer
                        total:
                          description: total is the number of items in the list.
                          format: int32
                          type: integer
                      required:
                      - total
                      type: object
                    knight:
                      description: |-
                        knight is the Knight running the step's current task: the spec's
                        knightRef, or the fallbackRef while a plan-quota refusal is re-run on
                        the fallback knight. Empty before the step's first dispatch.
                      type: string
                    loop:
                      description: loop tracks a loop step. Unset for ordinary steps.
                      properties:
                        history:
                          description: |-
                            history is a bounded, append-only record of body task executions,
                            oldest first: one entry each time a body task finishes (a retried
                            attempt adds one entry per attempt). Unlike steps, which only holds the
                            latest round of each body step, history keeps earlier rounds so their
                            outcomes stay visible. At most the last min(maxIterations, 20) rounds
                            are kept and outputSummary is truncated to 1 KiB. Loop semantics and
                            template data (.Loop.Steps) are unaffected.
                          items:
                            description: ChainLoopHistoryEntry is one finished body
                              task execution in a loop round.
                            properties:
                              error:
                                description: error is the (truncated) failure message
                                  of a failed execution.
                                type: string
                              finishedAt:
                                description: finishedAt is when the task finished.
                                format: date-time
                                type: string
                              outputSummary:
                                description: outputSummary is the task output truncated
                                  to 1 KiB.
                                type: string
                              phase:
                                description: 'phase is how the execution ended: Succeeded
                                  or Failed.'
                                enum:
                                - Pending
                                - Running
                                - Succeeded
                                - Failed
                                - Skipped
                                - Deferred
                                type: string
                              round:
                                description: round is the 1-based loop round the task
                                  ran in.
                                format: int32
                                type: integer
                              startedAt:
                                description: startedAt is when the task was published.
                                format: date-time
                                type: string
                              step:
                                description: step is the body step name.
                                type: string
                              taskId:
                                description: taskId is the NATS task identifier of
                                  the execution.
                                type: string
                            required:
                            - phase
                            - round
                            - step
                            type: object
                          type: array
                        iteration:
                          description: iteration is the current (or last) round, 1-based;
                            0 before the first.
                          format: int32
                          type: integer
                        maxIterations:
                          description: |-
                            maxIterations is the round cap for this run. It starts at
                            spec.loop.maxIterations and grows by that much each time
                            ai.roundtable.io/retry-failed resumes an exhausted loop.
                          format: int32
                          type: integer
                        outcome:
                          description: 'outcome is set once the loop ends: Converged,
                            Exhausted or Failed.'
                          type: string
                        steps:
                          description: steps holds the latest state of each body step,
                            in body order.
                          items:
                            description: ChainLoopStepStatus is the state of a loop
                              body step in its latest round.
                            properties:
                              completedAt:
                                description: completedAt is when the task finished.
                                format: date-time
                                type: string
                              error:
                                description: error is the task's error message (truncated).
                                type: string
                              iteration:
                                description: iteration is the round this entry belongs
                                  to.
                                format: int32
                                type: integer
                              knight:
                                description: |-
                                  knight is the Knight running the task: the body step's knightRef, or
                                  the loop step's fallbackRef while a plan-quota refusal is re-run on
                                  the fallback knight.
                                type: string
                              model:
                                description: model is the model requested for (or
                                  reported by) the task.
                                type: string
                              name:
                                description: name matches the body step name.
                                type: string
                              output:
                                description: |-
                                  output is the task's result (truncated; the full output is in the
                                  chain-outputs KV bucket under <chain>.<loopStep>.<bodyStep>).
                                type: string
                              phase:
                                description: phase is the body step's phase in that
                                  round.
                                enum:
                                - Pending
                                - Running
                                - Succeeded
                                - Failed
                                - Skipped
                                - Deferred
                                type: string
                              pickedUpAt:
                                description: pickedUpAt is when the knight picked
                                  the task up.
                                format: date-time
                                type: string
                              retries:
                                description: retries is the number of retry attempts
                                  made in this round.
                                format: int32
                                type: integer
                              startedAt:
                                description: startedAt is when the task was published.
                                format: date-time
                                type: string
                              taskId:
                                description: taskID is the NATS task identifier of
                                  the body step's current task.
                                type: string
                              taskSeq:
                                description: taskSeq is the tasks-stream sequence
                                  of the published task.
                                format: int64
                                type: integer
                            required:
                            - name
                            type: object
                          type: array
                      type: object
                    model:
                      description: |-
                        model is the model requested for the step's current task after alias
                        resolution (empty when the step has no override). It is replaced by the
                        model the knight reports having used, when the knight reports one.
                      type: string
                    name:
                      description: name matches the step name from the spec.
                      type: string
                    output:
                      description: output is the result data from this step (truncated
                        if large).
                      type: string
                    phase:
                      description: phase is the current execution phase of this step.
                      enum:
                      - Pending
                      - Running
                      - Succeeded
                      - Failed
                      - Skipped
                      - Deferred
                      type: string
                    pickedUpAt:
                      description: |-
                        pickedUpAt is when the knight picked the task up. The step timeout is
                        measured from here, not from startedAt.
                      format: date-time
                      type: string
                    reason:
                      description: |-
                        reason is a short machine-readable reason for the step's phase, e.g.
                        WhenFalse (skipped by its when expression) or ChainFailed (skipped
                        because the chain failed first).
                      type: string
                    retries:
                      description: retries is the number of retry attempts made.
                      format: int32
                      type: integer
                    startedAt:
                      description: startedAt is when the step's task was published
                        (queued) to the knight.
                      format: date-time
                      type: string
                    taskId:
                      description: |-
                        taskID is the unique NATS task identifier for this step's current execution.
                        Used to poll for the exact result message, preventing stale result replay.
                      type: string
                    taskSeq:
                      description: |-
                        taskSeq is the tasks-stream sequence number of the published task. It is
                        used to detect knight pickup (the knight's consumer acknowledging it).
                      format: int64
                      type: integer
                  required:
                  - name
                  type: object
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
