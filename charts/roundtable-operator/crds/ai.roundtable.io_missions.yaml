---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: missions.ai.roundtable.io
spec:
  group: ai.roundtable.io
  names:
    categories:
    - roundtable
    kind: Mission
    listKind: MissionList
    plural: missions
    shortNames:
    - msn
    singular: mission
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.objective
      name: Objective
      priority: 1
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.ttlSeconds
      name: TTL
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Mission is the Schema for the missions API.
          A Mission represents an ephemeral round table — a temporary group of knights
          assembled for a specific objective, with time-bounded execution and automatic cleanup.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Mission
            properties:
              briefing:
                description: |-
                  briefing is the initial context/instructions published to all mission knights
                  when the mission starts.
                type: string
              chains:
                description: chains lists chains to execute as part of this mission.
                items:
                  description: MissionChainRef references a chain to execute within
                    the mission.
                  properties:
                    inputOverride:
                      description: inputOverride provides mission-specific input data
                        that overrides the chain's default input.
                      type: string
                    name:
                      description: name is the Chain CR name to execute.
                      type: string
                    phase:
                      default: Active
                      description: phase controls when in the mission lifecycle this
                        chain runs.
                      enum:
                      - Setup
                      - Active
                      - Teardown
                      type: string
                  required:
                  - name
                  type: object
                type: array
              cleanupPolicy:
                default: Delete
                description: cleanupPolicy controls what happens to ephemeral resources
                  after mission completion.
                enum:
                - Delete
                - Retain
                type: string
              costBudgetUSD:
                default: "0"
                description: |-
                  costBudgetUSD is the maximum cost for this mission. When exceeded, the mission
                  is failed and cleanup begins. "0" means inherit from parent RoundTable.
                type: string
              generatedChains:
                description: |-
                  generatedChains stores chains created by the planner during Planning phase.
                  These chains are created as Chain CRs with owner references to the mission.
                items:
                  description: GeneratedChain represents a chain definition created
                    by the planner.
                  properties:
                    description:
                      description: description explains what this chain accomplishes.
                      type: string
                    input:
                      description: input is the initial data for the chain.
                      type: string
                    name:
                      description: name is the chain name (must be unique within the
                        mission).
                      type: string
                    phase:
                      default: Active
                      description: phase controls when this chain runs (Setup, Active,
                        Teardown).
                      enum:
                      - Setup
                      - Active
                      - Teardown
                      type: string
                    retryPolicy:
                      description: retryPolicy configures retry behavior.
                      properties:
                        backoffSeconds:
                          default: 30
                          description: backoffSeconds is the delay between retries
                            in seconds.
                          format: int32
                          type: integer
                        maxRetries:
                          default: 0
                          description: maxRetries is the maximum number of retries
                            per step.
                          format: int32
                          maximum: 5
                          minimum: 0
                          type: integer
                      type: object
                    steps:
                      description: steps are the chain steps.
                      items:
                        description: ChainStep defines a single step in the pipeline.
                        properties:
                          continueOnFailure:
                            default: false
                            description: continueOnFailure allows downstream steps
                              to proceed even if this step fails.
                            type: boolean
                          dependsOn:
                            description: |-
                              dependsOn lists step names that must complete successfully before this step runs.
                              If empty, the step runs immediately (or after the previous step in sequence).
                            items:
                              type: string
                            type: array
                          failurePolicy:
                            description: |-
                              failurePolicy decides what a failed item does to a forEach step.
                              failFast (default): no further items are dispatched once an item fails
                              (after its retries); in-flight items finish, the rest are Skipped and the
                              step fails. continue: every item runs; the step succeeds unless every
                              item failed, and a chain with failed items ends PartiallySucceeded.
                              Only valid together with forEach.
                            enum:
                            - failFast
                            - continue
                            type: string
                          fallbackRef:
                            description: |-
                              fallbackRef names the Knight (same namespace) that re-runs this step
                              when the primary knight refuses the task for plan quota (#321: a
                              claude-knight plan-reserve refusal, "Task refused: Claude plan ...
                              (resets ...)"). The re-run uses NO model override - the
                              cheap/fast/deep aliases resolve to Claude models, so the fallback runs
                              its own default model. For a loop step it applies to the loop's body
                              steps. Unset - or a refusal on the fallback too - the step is deferred
                              until the plan window resets and the chain requeues then (it neither
                              fails nor escalates).
                            properties:
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                            type: object
                            x-kubernetes-map-type: atomic
                          forEach:
                            description: |-
                              forEach fans this step out: it runs once per element of a JSON list taken
                              from the chain input or a prior step's output. The task template gets the
                              element as {{ .Item }} (alias {{ .item }}), its compact JSON as
                              {{ .ItemJSON }} and its zero-based position as {{ .ItemIndex }}. Every
                              item is its own task with its own taskId and a per-item runId. When all
                              items are done the step output is the joined JSON array of per-item
                              results ({index, item, phase, output, error}), which downstream steps read
                              through {{ .Steps.<name>.Output }}.
                            properties:
                              from:
                                description: |-
                                  from names the JSON document holding the list: "input" (spec.input) or
                                  "steps.<stepName>" (that step's output; the step must be listed in
                                  dependsOn). Prose around the JSON is tolerated when the JSON sits in a
                                  fenced ```json code block.
                                pattern: ^(input|steps\.[A-Za-z0-9_-]+)$
                                type: string
                              maxItems:
                                default: 50
                                description: |-
                                  maxItems is the largest list the step accepts. A longer list fails the
                                  step instead of being silently truncated.
                                format: int32
                                maximum: 200
                                minimum: 1
                                type: integer
                              path:
                                description: |-
                                  path is a JSONPath expression (kubectl syntax, e.g. "{.issues}" or
                                  ".issues[*].number") evaluated against the document. A single list
                                  result is the item list; otherwise the values found form the list. When
                                  empty the document itself must be a JSON array.
                                type: string
                              uniqueBy:
                                description: |-
                                  uniqueBy names a key every item (a JSON object) must have. Items whose
                                  value under that key repeats an earlier item's are dropped, so the list
                                  fans out once per distinct value (e.g. "number": one task per issue).
                                  An item that is not an object or lacks the key fails the step.
                                pattern: ^[A-Za-z_][A-Za-z0-9_-]*$
                                type: string
                            required:
                            - from
                            type: object
                          knightRef:
                            description: |-
                              knightRef names the Knight (same namespace) that executes this step.
                              Required unless the step is a loop (whose body steps name their own
                              knights).
                            properties:
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                            type: object
                            x-kubernetes-map-type: atomic
                          loop:
                            description: |-
                              loop makes this step a bounded loop: its body steps run in order, round
                              after round, until the until expression holds or maxIterations rounds
                              have run. A loop step has no knightRef, task, forEach, model, retry or
                              outputPath of its own; its output is the output of the last step that
                              ran in it.
                            properties:
                              from:
                                description: |-
                                  from names the step (listed in dependsOn) whose result the loop starts
                                  from, e.g. the first review. It seeds last, so until is checked before
                                  the first round (a review that already passes runs zero rounds) and the
                                  first body step sees it as {{ .Loop.Last.Output }}.
                                type: string
                              maxIterations:
                                default: 3
                                description: maxIterations bounds the number of rounds.
                                format: int32
                                maximum: 20
                                minimum: 1
                                type: integer
                              onExhausted:
                                description: |-
                                  onExhausted decides the step's phase when maxIterations rounds ran
                                  without until holding: fail (default) fails the step; continue
                                  succeeds it with outcome Exhausted so dependents can branch on
                                  steps.<name>.outcome. Either way the outcome is Exhausted.
                                enum:
                                - fail
                                - continue
                                type: string
                              steps:
                                description: |-
                                  steps is the loop body, run in order each round. Body tasks are
                                  published with the chain's runId, so a knight that already worked on
                                  this run (e.g. the coder of an earlier implement step) resumes the same
                                  agent session. Body task templates get, besides .Steps and .Input,
                                  .Loop.Iteration (1-based), .Loop.MaxIterations, .Loop.Last (the
                                  previous step in the flow: {Step, Phase, Output, Error}) and
                                  .Loop.Steps.<body>.Output/.Error (latest round each ran in).
                                items:
                                  description: ChainLoopStep is one step of a loop
                                    body.
                                  properties:
                                    knightRef:
                                      description: knightRef names the Knight that
                                        runs this body step.
                                      properties:
                                        name:
                                          default: ""
                                          description: |-
                                            Name of the referent.
                                            This field is effectively required, but due to backwards compatibility is
                                            allowed to be empty. Instances of this type with an empty value here are
                                            almost certainly wrong.
                                            More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                          type: string
                                      type: object
                                      x-kubernetes-map-type: atomic
                                    model:
                                      description: |-
                                        model overrides the knight's model for this body step (same rules as
                                        ChainStep.model, including RoundTable model aliases).
                                      maxLength: 256
                                      pattern: ^[A-Za-z0-9][A-Za-z0-9._:/@\[\]-]*$
                                      type: string
                                    name:
                                      description: name identifies the body step within
                                        its loop.
                                      maxLength: 63
                                      minLength: 1
                                      pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                                      type: string
                                    retry:
                                      description: |-
                                        retry configures retries of a failed body task (per round), overriding
                                        the chain-level retryPolicy.
                                      properties:
                                        backoffSeconds:
                                          default: 30
                                          description: backoffSeconds is the delay
                                            between retries in seconds.
                                          format: int32
                                          minimum: 1
                                          type: integer
                                        maxAttempts:
                                          default: 0
                                          description: maxAttempts is the maximum
                                            number of retry attempts for this step.
                                          format: int32
                                          maximum: 10
                                          minimum: 0
                                          type: integer
                                      type: object
                                    task:
                                      description: task is the task template (see
                                        ChainLoop.steps for the extra .Loop data).
                                      minLength: 1
                                      type: string
                                    timeoutSeconds:
                                      default: 120
                                      description: |-
                                        timeoutSeconds is the per-task timeout in seconds, counted from knight
                                        pickup.
                                      format: int32
                                      maximum: 3600
                                      minimum: 10
                                      type: integer
                                  required:
                                  - knightRef
                                  - name
                                  - task
                                  type: object
                                maxItems: 5
                                minItems: 1
                                type: array
                              until:
                                description: |-
                                  until is a CEL expression; the loop ends with outcome Converged as soon
                                  as it is true. Variables: everything when gets (input, steps), plus
                                  last ({step, phase, output, error}), iteration (the round just
                                  finished, 0 on entry), maxIterations and body, a map from body step
                                  name to {phase, output, error, iteration}. Example:
                                    last.output.contains("Verdict: ship it")
                                maxLength: 4096
                                minLength: 1
                                type: string
                            required:
                            - steps
                            - until
                            type: object
                          maxParallel:
                            description: |-
                              maxParallel caps how many items of a forEach step are in flight at once.
                              Defaults to the knight's concurrency. Only valid together with forEach.
                            format: int32
                            maximum: 100
                            minimum: 1
                            type: integer
                          model:
                            description: |-
                              model overrides the knight's spec.model for this step only. It is either
                              a model ID or the name of an alias from the chain's RoundTable
                              spec.modelAliases (an alias name wins over a literal model ID). The
                              resolved model must suit the knight's runtime: a Claude model ("opus",
                              "sonnet", "haiku", "claude-...") on a claude-knight, a "provider/model"
                              on a pi-knight. A mismatch fails the step without dispatching it.
                              Empty means the knight's default model.
                            maxLength: 256
                            pattern: ^[A-Za-z0-9][A-Za-z0-9._:/@\[\]-]*$
                            type: string
                          name:
                            description: name is a unique identifier for this step
                              within the chain.
                            minLength: 1
                            type: string
                          outputKey:
                            description: |-
                              outputKey is the key name under which this step's output is stored for downstream steps.
                              Defaults to the step name if not specified.
                            type: string
                          outputPath:
                            description: |-
                              outputPath is an optional file path where this step's output should be written.
                              Supports Go template variables: {{ .Date }} (YYYY-MM-DD), {{ .Chain }} (chain name), {{ .Step }} (step name).
                              When set, the controller dispatches a write task to the outputKnightRef knight after the step succeeds.
                            type: string
                          resumeRunId:
                            description: |-
                              resumeRunId is a CEL expression, with the same variables as when, that
                              yields the runId the step's task carries instead of the chain run's
                              runId. Knights key their agent session by runId, so this lets a step
                              resume the session of an earlier run, e.g. json(input).runId for a
                              follow-up chain fed the original run's ID. An empty result keeps the
                              chain run's runId; an evaluation error fails the step. Not valid on
                              forEach or loop steps.
                            maxLength: 1024
                            type: string
                          retry:
                            description: |-
                              retry configures per-step retry behavior, overriding the chain-level retryPolicy.
                              For a forEach step it applies to each item individually.
                            properties:
                              backoffSeconds:
                                default: 30
                                description: backoffSeconds is the delay between retries
                                  in seconds.
                                format: int32
                                minimum: 1
                                type: integer
                              maxAttempts:
                                default: 0
                                description: maxAttempts is the maximum number of
                                  retry attempts for this step.
                                format: int32
                                maximum: 10
                                minimum: 0
                                type: integer
                            type: object
                          task:
                            description: |-
                              task is the task prompt or instruction to send to the knight.
                              Supports Go template syntax with access to prior step outputs: {{ .Steps.step_name.Output }}
                              Required unless the step is a loop.
                            type: string
                          timeoutSeconds:
                            default: 120
                            description: |-
                              timeoutSeconds is the per-step timeout in seconds, counted from knight
                              pickup. Overrides the knight's default taskTimeoutSeconds.
                            format: int32
                            maximum: 3600
                            minimum: 10
                            type: integer
                          when:
                            description: |-
                              when is a CEL expression that gates the step. It is evaluated once the
                              step's dependencies are done; false skips the step (phase Skipped,
                              reason WhenFalse) without dispatching anything, and a skipped step
                              satisfies its dependents' dependsOn. An evaluation error fails the step.
                              Variables: input (string) and steps, a map from step name to
                              {phase, output, error, reason, outcome, iterations}; outputs are the
                              full outputs (read back from the chain-outputs KV bucket), not the
                              truncated status copies. Besides standard CEL (contains, startsWith,
                              matches, size, exists, ...) the extended string library and
                              json(string) (parses a JSON document, tolerating a fenced ```json
                              block) are available. Examples:
                                steps.recon.output.contains("22/tcp open")
                                steps.review.phase == "Succeeded" && !steps.review.output.contains("Verdict: ship it")
                                steps.fixloop.outcome == "Exhausted"
                            maxLength: 4096
                            type: string
                        required:
                        - name
                        type: object
                      minItems: 1
                      type: array
                    timeoutSeconds:
                      description: timeoutSeconds overrides the default chain timeout,
                        in seconds.
                      format: int32
                      type: integer
                  required:
                  - name
                  - steps
                  type: object
                type: array
              generatedKnights:
                description: |-
                  generatedKnights stores ephemeral knight specs created by the planner.
                  These knights are added to the knights list during Planning phase.
                items:
                  description: MissionKnight references a knight participating in
                    a mission.
                  properties:
                    ephemeral:
                      default: false
                      description: |-
                        ephemeral, if true, creates a temporary Knight for this mission that is cleaned up on completion.
                        When true, ephemeralSpec must be provided.
                      type: boolean
                    ephemeralSpec:
                      description: ephemeralSpec defines the spec for an ephemeral
                        knight. Only used when ephemeral=true.
                      properties:
                        arsenal:
                          description: arsenal configures the skill arsenal git-sync
                            sidecar.
                          properties:
                            image:
                              default: registry.k8s.io/git-sync/git-sync:v4.4.0
                              description: image overrides the git-sync container
                                image.
                              type: string
                            name:
                              description: |-
                                name identifies this arsenal: it becomes the sync path /arsenal/<name>
                                and the sidecar name git-sync-<name>. Defaults to the repo's basename;
                                a name already taken by an earlier arsenal gets a "-2", "-3"... suffix.
                              maxLength: 40
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                            periodSeconds:
                              default: 300
                              description: periodSeconds is how often git-sync pulls
                                the repo, in seconds.
                              format: int32
                              minimum: 1
                              type: integer
                            ref:
                              default: main
                              description: ref is the git ref to sync.
                              type: string
                            repo:
                              default: https://github.com/roundtable-k8s/arsenal
                              description: repo is the git repository URL containing
                                skills.
                              type: string
                          type: object
                        arsenals:
                          description: |-
                            arsenals lists additional skill arsenals merged into /skills alongside
                            arsenal. Merging is per skill: /skills/<category>/<skill> links to the
                            LAST arsenal (in order: arsenal first, then arsenals) that provides that
                            skill, so later entries override earlier ones. Each entry runs its own
                            git-sync sidecar.
                          items:
                            description: KnightArsenal configures the git-sync sidecar
                              for the skill arsenal.
                            properties:
                              image:
                                default: registry.k8s.io/git-sync/git-sync:v4.4.0
                                description: image overrides the git-sync container
                                  image.
                                type: string
                              name:
                                description: |-
                                  name identifies this arsenal: it becomes the sync path /arsenal/<name>
                                  and the sidecar name git-sync-<name>. Defaults to the repo's basename;
                                  a name already taken by an earlier arsenal gets a "-2", "-3"... suffix.
                                maxLength: 40
                                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                              periodSeconds:
                                default: 300
                                description: periodSeconds is how often git-sync pulls
                                  the repo, in seconds.
                                format: int32
                                minimum: 1
                                type: integer
                              ref:
                                default: main
                                description: ref is the git ref to sync.
                                type: string
                              repo:
                                default: https://github.com/roundtable-k8s/arsenal
                                description: repo is the git repository URL containing
                                  skills.
                                type: string
                            type: object
                          maxItems: 8
                          type: array
                          x-kubernetes-list-type: atomic
                        capabilities:
                          description: capabilities configures optional runtime capabilities
                            for the knight pod.
                          properties:
                            browser:
                              description: |-
                                browser enables a headless Chrome sidecar with agent-browser CLI for web automation.
                                When true, the operator injects a browser sidecar and sets BROWSER_ENABLED=true.
                              type: boolean
                          type: object
                        card:
                          description: |-
                            card overrides fields of the knight's agent card, which the RoundTable
                            controller generates from this spec and keeps in the cards KV bucket
                            (key <table>.<knight>, see docs/agent-cards.md).
                          properties:
                            description:
                              description: |-
                                description is the card description. When unset it is the first
                                paragraph of spec.prompt.identity, else "<Name>, <domain> knight".
                              maxLength: 1024
                              type: string
                            skills:
                              description: |-
                                skills are merged over the generated skills by id: set fields replace
                                the generated ones, and an id that is not generated adds a skill.
                              items:
                                description: KnightCardSkill overrides one skill on
                                  a knight's agent card.
                                properties:
                                  description:
                                    description: description replaces the skill description.
                                    maxLength: 1024
                                    type: string
                                  examples:
                                    description: examples replace the skill examples
                                      (sample prompts).
                                    items:
                                      type: string
                                    type: array
                                  id:
                                    description: |-
                                      id is the skill id: the skill name a running knight reports, or a
                                      spec.skills category before the knight has run.
                                    maxLength: 128
                                    minLength: 1
                                    type: string
                                  tags:
                                    description: tags replace the skill tags.
                                    items:
                                      type: string
                                    type: array
                                required:
                                - id
                                type: object
                              maxItems: 64
                              type: array
                              x-kubernetes-list-map-keys:
                              - id
                              x-kubernetes-list-type: map
                            tags:
                              description: tags label the knight as a whole (card
                                roundtable.tags).
                              items:
                                type: string
                              maxItems: 32
                              type: array
                          type: object
                        concurrency:
                          description: |-
                            concurrency is the maximum number of concurrent tasks the knight can process.
                            When unset the knight's RoundTable spec.defaults.concurrency applies, and
                            when that is unset too 2.
                          format: int32
                          maximum: 10
                          minimum: 1
                          type: integer
                        domain:
                          description: |-
                            domain is the knight's area of expertise (e.g., "security", "infrastructure", "finance").
                            Used for NATS subject routing and skill filtering.
                          minLength: 1
                          type: string
                        egress:
                          description: |-
                            egress restricts the knight's outbound traffic to DNS, its NATS server
                            and an allowlist of hostnames. The operator renders it as a
                            CiliumNetworkPolicy knight-<name>-egress with toFQDNs rules; without the
                            cilium.io/v2 CiliumNetworkPolicy API it falls back to a NetworkPolicy that
                            allows the allowed ports to any destination and reports
                            EgressRestricted=False (FQDNPolicyUnavailable). When unset no egress
                            policy is rendered.
                          properties:
                            allowedHosts:
                              description: |-
                                allowedHosts are the hostnames the knight may reach, each an exact host
                                ("api.anthropic.com") or a "*." wildcard prefix ("*.github.com", which
                                matches subdomains of github.com but not github.com itself). Empty
                                allows only DNS and NATS.
                              items:
                                maxLength: 253
                                pattern: ^(\*\.)?([a-z0-9]([-a-z0-9]*[a-z0-9])?\.)*[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                                type: string
                              maxItems: 64
                              type: array
                              x-kubernetes-list-type: set
                            allowedPorts:
                              default:
                              - 443
                              description: allowedPorts are the TCP ports allowed
                                to the allowed hosts.
                              items:
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                              maxItems: 16
                              type: array
                              x-kubernetes-list-type: set
                          type: object
                        env:
                          description: env defines additional environment variables
                            for the knight container.
                          items:
                            description: EnvVar represents an environment variable
                              present in a Container.
                            properties:
                              name:
                                description: |-
                                  Name of the environment variable.
                                  May consist of any printable ASCII characters except '='.
