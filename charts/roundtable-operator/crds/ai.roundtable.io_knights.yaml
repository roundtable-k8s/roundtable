    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Knight is the Schema for the knights API.
          A Knight represents a specialized AI agent in the Round Table,
          deployed as a Kubernetes workload with NATS JetStream connectivity,
          skill injection, and shared vault access.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Knight
            properties:
              arsenal:
                description: arsenal configures the skill arsenal git-sync sidecar.
                properties:
                  image:
                    default: registry.k8s.io/git-sync/git-sync:v4.4.0
                    description: image overrides the git-sync container image.
                    type: string
                  name:
                    description: |-
                      name identifies this arsenal: it becomes the sync path /arsenal/<name>
                      and the sidecar name git-sync-<name>. Defaults to the repo's basename;
                      a name already taken by an earlier arsenal gets a "-2", "-3"... suffix.
                    maxLength: 40
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                  periodSeconds:
                    default: 300
                    description: periodSeconds is how often git-sync pulls the repo,
                      in seconds.
                    format: int32
                    minimum: 1
                    type: integer
                  ref:
                    default: main
                    description: ref is the git ref to sync.
                    type: string
                  repo:
                    default: https://github.com/roundtable-k8s/arsenal
                    description: repo is the git repository URL containing skills.
                    type: string
                type: object
              arsenals:
                description: |-
                  arsenals lists additional skill arsenals merged into /skills alongside
                  arsenal. Merging is per skill: /skills/<category>/<skill> links to the
                  LAST arsenal (in order: arsenal first, then arsenals) that provides that
                  skill, so later entries override earlier ones. Each entry runs its own
                  git-sync sidecar.
                items:
                  description: KnightArsenal configures the git-sync sidecar for the
                    skill arsenal.
                  properties:
                    image:
                      default: registry.k8s.io/git-sync/git-sync:v4.4.0
                      description: image overrides the git-sync container image.
                      type: string
                    name:
                      description: |-
                        name identifies this arsenal: it becomes the sync path /arsenal/<name>
                        and the sidecar name git-sync-<name>. Defaults to the repo's basename;
                        a name already taken by an earlier arsenal gets a "-2", "-3"... suffix.
                      maxLength: 40
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    periodSeconds:
                      default: 300
                      description: periodSeconds is how often git-sync pulls the repo,
                        in seconds.
                      format: int32
                      minimum: 1
                      type: integer
                    ref:
                      default: main
                      description: ref is the git ref to sync.
                      type: string
                    repo:
                      default: https://github.com/roundtable-k8s/arsenal
                      description: repo is the git repository URL containing skills.
                      type: string
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-type: atomic
              capabilities:
                description: capabilities configures optional runtime capabilities
                  for the knight pod.
                properties:
                  browser:
                    description: |-
                      browser enables a headless Chrome sidecar with agent-browser CLI for web automation.
                      When true, the operator injects a browser sidecar and sets BROWSER_ENABLED=true.
                    type: boolean
                type: object
              concurrency:
                default: 2
                description: concurrency is the maximum number of concurrent tasks
                  the knight can process.
                format: int32
                maximum: 10
                minimum: 1
                type: integer
              domain:
                description: |-
                  domain is the knight's area of expertise (e.g., "security", "infrastructure", "finance").
                  Used for NATS subject routing and skill filtering.
                minLength: 1
                type: string
              env:
                description: env defines additional environment variables for the
                  knight container.
                items:
                  description: EnvVar represents an environment variable present in
                    a Container.
                  properties:
                    name:
                      description: |-
                        Name of the environment variable.
                        May consist of any printable ASCII characters except '='.
                      type: string
                    value:
                      description: |-
                        Variable references $(VAR_NAME) are expanded
                        using the previously defined environment variables in the container and
                        any service environment variables. If a variable cannot be resolved,
                        the reference in the input string will be unchanged. Double $$ are reduced
                        to a single $, which allows for escaping the $(VAR_NAME) syntax: i.e.
                        "$$(VAR_NAME)" will produce the string literal "$(VAR_NAME)".
                        Escaped references will never be expanded, regardless of whether the variable
                        exists or not.
                        Defaults to "".
                      type: string
                    valueFrom:
                      description: Source for the environment variable's value. Cannot
                        be used if value is not empty.
                      properties:
                        configMapKeyRef:
                          description: Selects a key of a ConfigMap.
                          properties:
                            key:
                              description: The key to select.
                              type: string
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                            optional:
                              description: Specify whether the ConfigMap or its key
                                must be defined
                              type: boolean
                          required:
                          - key
                          type: object
                          x-kubernetes-map-type: atomic
                        fieldRef:
                          description: |-
                            Selects a field of the pod: supports metadata.name, metadata.namespace, `metadata.labels['<KEY>']`, `metadata.annotations['<KEY>']`,
                            spec.nodeName, spec.serviceAccountName, status.hostIP, status.podIP, status.podIPs.
                          properties:
                            apiVersion:
                              description: Version of the schema the FieldPath is
                                written in terms of, defaults to "v1".
                              type: string
                            fieldPath:
                              description: Path of the field to select in the specified
                                API version.
                              type: string
                          required:
