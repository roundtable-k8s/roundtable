                ephemeral'
              rule: '!has(self.workspace) || !has(self.workspace.mode) || self.workspace.mode
                != ''ephemeral'' || !has(self.workspace.existingClaim) || size(self.workspace.existingClaim)
                == 0'
            - message: 'runtime: sandbox runs a single pod; replicas and maxReplicas
                must be 1'
              rule: '!has(self.runtime) || self.runtime != ''sandbox'' || ((has(self.replicas)
                ? self.replicas : 1) <= 1 && (has(self.maxReplicas) ? self.maxReplicas
                : 1) <= 1)'
          status:
            description: status defines the observed state of Knight
            properties:
              conditions:
                description: conditions represent the current state of the Knight
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastTaskAt:
                description: lastTaskAt is the timestamp of the last completed task.
                format: date-time
                type: string
              natsConsumer:
                description: natsConsumer is the name of the reconciled NATS durable
                  consumer.
                type: string
              observedGeneration:
                description: observedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              phase:
                description: phase is the current lifecycle phase of the knight.
                enum:
                - Pending
                - Provisioning
                - Ready
                - Degraded
                - Suspended
                type: string
              ready:
                description: ready indicates whether the knight is ready to accept
                  tasks.
                type: boolean
              readyReplicas:
                description: readyReplicas is the number of knight pods that are ready.
                format: int32
                type: integer
              replicas:
                description: replicas is the number of knight pods the Deployment
                  currently has.
                format: int32
                type: integer
              tasksCompleted:
                description: tasksCompleted is the total number of tasks completed
                  since creation.
                format: int64
                type: integer
              tasksFailed:
                description: tasksFailed is the total number of tasks that failed.
                format: int64
                type: integer
              toolsImage:
                description: |-
                  toolsImage is the tools image reference that has been built and pushed
                  for this knight's current Nix tool list. Empty until the build Job
                  succeeds; used to avoid rebuilding unchanged tool lists and as the
                  image the knight's pod mounts.
                type: string
              totalCost:
                description: totalCost is the cumulative cost in USD of all tasks
                  processed.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
