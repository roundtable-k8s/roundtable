            - message: roundTableRef is required for source.webhook
              rule: '!has(self.source.webhook) || has(self.roundTableRef)'
            - message: roundTableRef is required for source.github
              rule: '!has(self.source.github) || has(self.roundTableRef)'
            - message: 'roundTableRef is required for target.mission: the Mission
