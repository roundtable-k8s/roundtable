    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RoundTable is the Schema for the roundtables API.
          A RoundTable represents a fleet of knights with shared configuration,
          NATS infrastructure, and operational policies. It is the top-level
          organizational resource in the Round Table operator.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of RoundTable
            properties:
              defaults:
                description: |-
                  defaults defines default configuration applied to all knights in this table.
                  Individual knight specs can override these values.
                properties:
                  arsenals:
                    description: |-
                      arsenals is the default ordered skill arsenal list for knights that set
                      none of their own (first = base, later entries override per skill).
                    items:
                      description: |-
                        KnightArsenal configures one skill arsenal: either a git-sync sidecar (the
                        default) or, with oci set, a read-only OCI image volume.
                      properties:
                        image:
                          default: registry.k8s.io/git-sync/git-sync:v4.4.0
                          description: image overrides the git-sync container image.
                          type: string
                        name:
                          description: |-
                            name identifies this arsenal: it becomes the sync path /arsenal/<name>
                            and the sidecar name git-sync-<name>. Defaults to the repo's basename;
                            a name already taken by an earlier arsenal gets a "-2", "-3"... suffix.
                          maxLength: 40
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        oci:
                          description: |-
                            oci loads the arsenal from an OCI image mounted read-only as an image
                            volume at /arsenal/<name> instead of syncing a git repo. No git-sync
                            sidecar is added; repo, ref, periodSeconds and image are ignored.
                          properties:
                            pullPolicy:
                              default: IfNotPresent
                              description: pullPolicy is the image volume pull policy.
                              enum:
                              - Always
                              - IfNotPresent
                              - Never
                              type: string
                            reference:
                              description: |-
                                reference is the image reference, pinned by digest
                                (e.g. registry.example.com/arsenal@sha256:...).
                              maxLength: 512
                              minLength: 1
                              pattern: '@sha256:[a-f0-9]{64}$'
                              type: string
                          required:
                          - reference
                          type: object
                        periodSeconds:
                          default: 300
                          description: periodSeconds is how often git-sync pulls the
                            repo, in seconds.
                          format: int32
                          minimum: 1
                          type: integer
                        ref:
                          default: main
                          description: ref is the git ref to sync.
                          type: string
                        repo:
                          description: |-
                            repo is the git repository URL containing skills. Defaults to
                            https://github.com/roundtable-k8s/arsenal (applied by the operator, so
                            it stays unset for an oci arsenal); mutually exclusive with oci.
                          type: string
                      type: object
                      x-kubernetes-validations:
                      - message: oci and repo are mutually exclusive
                        rule: '!has(self.oci) || !has(self.repo)'
                    maxItems: 8
                    type: array
                    x-kubernetes-list-type: atomic
                  concurrency:
                    description: |-
                      concurrency is the default max concurrent tasks per pod for the table's
                      standing knights. A knight that sets its own spec.concurrency keeps it;
                      with neither set 2 applies.
                    format: int32
                    maximum: 10
                    minimum: 1
                    type: integer
                  egress:
                    description: |-
                      egress is the default egress allowlist (allowedHosts, allowedPorts and
                      allowedServices) for the table's standing knights. A knight that sets
                      its own spec.egress keeps it; allowlists are not merged. There is no table-level opt-out: opting out is explicit on the
                      Knight.
                    properties:
                      allowedHosts:
                        description: |-
                          allowedHosts are the hostnames the knight may reach, each an exact host
                          ("api.anthropic.com") or a "*." wildcard prefix ("*.github.com", which
                          matches subdomains of github.com but not github.com itself). An entry
                          is either a string (allowed on allowedPorts) or an object
                          {host, ports} (allowed on its own ports only). Empty allows only DNS
                          and NATS.
                        items:
                          description: |-
                            EgressHostEntry is one allowedHosts entry as stored: a string (the host, on
                            the allowed ports) or an object {host, ports}. Use Parse for the decoded
                            EgressHost.

                            The CRD schema keeps allowedHosts an array of at most 64 items but leaves
                            the items open, because a schema cannot express a string-or-object union.
                            The operator validates the entries when it renders the policy
                            (ParseEgressHosts), drops the invalid ones and reports them on the
                            EgressRestricted condition. Decoding never fails and the original JSON is
                            written back unchanged, so one malformed entry can't break listing or
                            caching Knights.
                          x-kubernetes-preserve-unknown-fields: true
                        maxItems: 64
                        type: array
                      allowedPorts:
                        default:
                        - 443
                        description: allowedPorts are the TCP ports allowed to the
                          allowed hosts.
                        items:
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        maxItems: 16
                        type: array
                        x-kubernetes-list-type: set
                      allowedServices:
                        description: |-
                          allowedServices are in-cluster Services the knight may reach, each on
                          its own ports. A "*.svc.cluster.local" name under allowedHosts does not
                          open a Service: FQDN rules only match addresses outside the cluster.
                          The policy selects the Service's pods (its namespace and pod selector),
                          so a Service without a selector, or one that does not exist, is left out
                          and reported on the EgressRestricted condition.
                        items:
                          description: EgressService is an in-cluster Service a knight
                            may reach on the listed ports.
                          properties:
                            name:
                              description: name is the Service's name.
                              maxLength: 63
                              minLength: 1
                              pattern: ^[a-z]([-a-z0-9]*[a-z0-9])?$
                              type: string
                            namespace:
                              description: namespace is the Service's namespace. Empty
                                means the knight's namespace.
                              maxLength: 63
                              pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                              type: string
                            ports:
                              description: |-
                                ports are the Service ports the knight dials. The policy allows each
                                port's targetPort on the Service's pods (policies apply after the
                                Service address is translated to a pod); a port the Service does not
                                expose is allowed as a pod port as-is.
                              items:
                                format: int32
                                maximum: 65535
                                minimum: 1
                                type: integer
                              maxItems: 8
                              minItems: 1
                              type: array
                              x-kubernetes-list-type: set
                          required:
                          - name
                          - ports
                          type: object
                        maxItems: 32
                        type: array
                        x-kubernetes-list-type: atomic
                    type: object
                  image:
                    description: |-
                      image is the default container image for the table's standing knights.
                      A knight that sets its own spec.image keeps it; with neither set the
                      operator's DEFAULT_KNIGHT_IMAGE applies.
                    type: string
                  memory:
                    description: |-
                      memory is the default persistent memory volume for the table's
                      standing knights. A knight that sets its own spec.memory keeps it.
                      Unlike workspace, existingClaim is inherited: point it at one
                      ReadWriteMany claim to give the table's knights shared memory, each
                      writing only its own sub-directory.
                    properties:
                      existingClaim:
                        description: |-
                          existingClaim is a ReadWriteMany PVC shared by several knights (for
                          example a whole table) instead of a per-knight claim. Each knight writes
                          only its own <knight> sub-directory and reads everyone else's.
                        type: string
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          size is the storage request of the PVC the operator creates.
                          Defaults to 1Gi. Ignored with existingClaim.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        description: |-
                          storageClassName is the StorageClass of the PVC the operator creates;
                          empty uses the cluster default. It must support ReadWriteMany when the
                          knight runs more than one pod. Ignored with existingClaim.
                        type: string
                    type: object
                  model:
                    description: |-
                      model is the default AI model for the table's standing knights (those
                      labelled ai.roundtable.io/round-table). A knight that sets its own
                      spec.model keeps it; with neither set the operator default
                      ("openrouter/deepseek/deepseek-v3.2") applies.
                    type: string
                  resources:
                    description: |-
                      resources are the default compute resource requests and limits (cpu,
                      memory, ephemeral-storage, ...) for the app container of the table's
                      standing knights (those labelled ai.roundtable.io/round-table). A knight
                      that sets its own spec.resources keeps it; resources are not merged.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                  runtimeClassName:
                    description: |-
                      runtimeClassName is the default RuntimeClass (for example "gvisor") for
                      the table's standing knights. A knight that sets its own
                      spec.runtimeClassName keeps it.
                    type: string
                  taskTimeoutSeconds:
                    description: |-
                      taskTimeoutSeconds is the default task timeout in seconds for the table's
                      standing knights. A knight that sets its own spec.taskTimeoutSeconds
                      keeps it; with neither set 120 applies.
                    format: int32
                    maximum: 3600
                    minimum: 30
                    type: integer
                  workspace:
                    description: |-
                      workspace is the default workspace storage (mode and size) for the
                      table's standing knights. A knight that sets its own spec.workspace
                      keeps it. existingClaim is never inherited: a claim is per knight.
                    properties:
                      existingClaim:
                        description: |-
                          existingClaim references an existing PVC to use instead of creating a new one.
                          Useful for migrating existing knights to operator management.
                          With more than one replica the claim must be ReadWriteMany; the operator
                          cannot check access modes, so a ReadWriteOnce claim leaves a stuck pod.
                        type: string
                      fromSnapshot:
                        description: |-
                          fromSnapshot is the name of a VolumeSnapshot in the knight's namespace to
                          create the workspace PVC from (restore or fork). It only applies when the
                          PVC is created: an existing PVC is left alone. The PVC is not created
                          until the snapshot exists and is readyToUse. The PVC size is the larger
                          of size and the snapshot's restoreSize. Not allowed with existingClaim
                          or mode: ephemeral (an empty existingClaim set alongside it is rejected
                          too). Not inherited from RoundTable defaults. Needs the
                          snapshot.storage.k8s.io/v1 API.
                        maxLength: 253
                        type: string
                      mode:
                        default: pvc
                        description: |-
                          mode selects the workspace storage.
                          "pvc" (default) uses one persistent ReadWriteOnce volume, so the knight
                          runs a single pod.
                          "ephemeral" gives every pod its own emptyDir (size limit: size), which
                          lets the knight run several replicas. Anything the runtime keeps under
                          /data, including its memory files, is lost when the pod is replaced.
                        enum:
                        - pvc
                        - ephemeral
                        type: string
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        default: 1Gi
                        description: |-
                          size is the storage request for auto-created PVCs, or the emptyDir
                          size limit in ephemeral mode.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      snapshots:
                        description: |-
                          snapshots configures on-demand CSI VolumeSnapshots of the workspace PVC
                          (mode: pvc only). A snapshot is taken when the ai.roundtable.io/snapshot
                          annotation gets a new value. Needs the snapshot.storage.k8s.io/v1 API.
                        properties:
                          className:
                            description: className is the VolumeSnapshotClass. Empty
                              uses the cluster default.
                            type: string
                          keep:
                            default: 3
                            description: |-
                              keep is how many snapshots of this knight to retain; once the newest is
                              ready, the oldest beyond keep are deleted.
                            format: int32
                            minimum: 1
                            type: integer
                        type: object
                    type: object
                    x-kubernetes-validations:
                    - message: workspace.fromSnapshot cannot be combined with workspace.existingClaim
                      rule: '!has(self.fromSnapshot) || !has(self.existingClaim)'
                    - message: 'workspace.fromSnapshot cannot be combined with workspace.mode:
                        ephemeral'
                      rule: '!has(self.fromSnapshot) || !has(self.mode) || self.mode
                        != ''ephemeral'''
                type: object
              description:
                description: description is a human-readable description of this round
                  table's purpose.
                type: string
              ephemeral:
                default: false
                description: |-
                  ephemeral marks this RoundTable as mission-owned. Ephemeral tables are
                  excluded from fleet-wide aggregation and are garbage collected with their mission.
                type: boolean
              github:
                description: |-
                  github configures GitHub credentials inherited by the table's knights
                  (including mission knights). A Knight's own
                  spec.github.tokenSecretRef takes precedence.
                properties:
                  tokenSecretRef:
                    description: |-
                      tokenSecretRef selects the key of a Secret (in the knight's namespace)
                      holding a GitHub token, for example a GitHub App installation token that
                      an external controller refreshes. The operator mounts it read-only into
                      the knight at /var/run/secrets/roundtable/github/token and sets
                      GITHUB_TOKEN_FILE to that path. Because it is a volume, not an env var,
                      the kubelet refreshes the file in place when the Secret changes. With
                      optional: true the pod starts even if the Secret or key is missing.
                    properties:
                      key:
                        description: The key of the secret to select from.  Must be
                          a valid secret key.
                        type: string
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                      optional:
                        description: Specify whether the Secret or its key must be
                          defined
                        type: boolean
                    required:
                    - key
                    type: object
                    x-kubernetes-map-type: atomic
                type: object
              issuePickup:
                description: |-
                  issuePickup polls GitHub for issues labelled ready and starts one copy
                  of a Chain (the PR pipeline) per issue. Unset means off.
                properties:
                  assignees:
                    description: |-
                      assignees are GitHub logins assigned to a claimed issue. GitHub
                      ignores logins that cannot be assigned (GitHub App bots cannot be).
                    items:
                      type: string
                    maxItems: 10
                    type: array
                    x-kubernetes-list-type: set
                  breakingLabel:
                    default: breaking
                    description: |-
                      breakingLabel marks open pull requests that change an API, CRD or
                      contract (the breaking-change protocol, #260). While a repo has an open
                      pull request with this label, pickup starts no new Chain for it: ready
                      issues stay ready and are picked up after the breaking PR is merged or
                      closed.
                    maxLength: 50
                    minLength: 1
                    type: string
                  chainRef:
                    description: |-
                      chainRef names the Chain in the RoundTable's namespace that is copied
                      for every picked-up issue (normally the PR pipeline, pr-pipeline). The
                      copy gets spec.input {"repo": "<owner/name>", "issue": <n>} and is
                      started with the ai.roundtable.io/run annotation. The template itself
                      is never run by pickup.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                    x-kubernetes-validations:
                    - message: chainRef.name is required
                      rule: size(self.name) > 0
                  engine:
                    default: builtin
                    description: |-
                      engine selects what picks up ready issues. builtin (the default) is
                      the issue pickup controller's own poller. trigger generates a Trigger
                      named "<table>-issue-pickup" (owned by the RoundTable) with a github
                      source built from these fields, and the builtin poller only does the
                      post-run checks (merge verification, failed-run hand-back, split
                      parents) and cleanup for the table. Switching back to builtin deletes
                      the generated Trigger. Both engines name a run after its issue, so a
                      switch never starts a second run for an issue.
                    enum:
                    - builtin
                    - trigger
                    type: string
                  humanPatterns:
                    default:
                    - \.github/workflows
                    - (?i)\bsecrets?\b
                    - (?i)\b(auth|oauth|authn|authz|authentication|authori[sz]ation|credentials?)\b
                    description: |-
                      humanPatterns are RE2 regular expressions matched against an issue's
                      title and body. A match means the work needs a human (the bot token
                      cannot push workflow changes, and secrets/auth changes need review).
                    items:
                      type: string
                    maxItems: 20
                    type: array
                  inProgressLabel:
                    default: rt:in-progress
                    description: inProgressLabel replaces readyLabel when an issue
                      is claimed.
                    maxLength: 50
                    minLength: 1
                    type: string
                  intervalSeconds:
                    default: 300
                    description: intervalSeconds is the time between polls.
                    format: int32
                    maximum: 86400
                    minimum: 60
                    type: integer
                  maxActive:
                    default: 2
                    description: maxActive caps unfinished pickup Chains for the whole
                      RoundTable.
                    format: int32
                    maximum: 50
                    minimum: 1
                    type: integer
                  maxActivePerRepo:
                    default: 1
                    description: maxActivePerRepo caps unfinished pickup Chains per
                      repository.
                    format: int32
                    maximum: 20
                    minimum: 1
                    type: integer
                  needsHumanLabel:
                    default: needs-human
                    description: |-
                      needsHumanLabel marks issues a knight must not take. A ready issue with
                      this label, or whose title or body matches humanPatterns, is skipped:
                      readyLabel is removed, needsHumanLabel added and a comment says why.
                    maxLength: 50
                    minLength: 1
                    type: string
                  postRun:
                    default: builtin
                    description: |-
                      postRun selects who checks a finished run on GitHub. builtin (the
                      default): the operator parses the run's "PRs:" and "Verdict:" lines,
                      checks every PR is merged or queued (queueing it or posting the
                      missing review when it can), hands failed runs back with
                      needsHumanLabel and closes the parent issue of a split run once its
                      sub-issues are done. chain: the chain's own steps do all of that (the
                      chart's PR pipeline with prPipeline.postRun: chain) and the operator
                      only releases the issue: when a finished run did not succeed, or left
                      needsHumanLabel on the issue, and the issue is still open with
                      inProgressLabel, it gets needsHumanLabel and loses inProgressLabel, so
                      a failed verify or handback step never leaves it in progress. See
                      docs/pr-pipeline.md.
                    enum:
                    - builtin
                    - chain
                    type: string
                  readyLabel:
                    default: rt:ready
                    description: readyLabel marks issues to pick up.
                    maxLength: 50
                    minLength: 1
                    type: string
                  repos:
                    description: repos are the GitHub repositories to poll, as owner/name.
                    items:
                      pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                      type: string
                    maxItems: 50
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  suspend:
                    default: false
                    description: suspend stops polling. Chains already started keep
                      running.
                    type: boolean
                  ttlSecondsAfterFinished:
                    default: 604800
                    description: |-
                      ttlSecondsAfterFinished deletes a finished pickup Chain this long after
                      it completed. 0 keeps finished Chains.
                    format: int32
                    minimum: 0
                    type: integer
                required:
                - chainRef
                - repos
                type: object
                x-kubernetes-validations:
                - message: readyLabel must differ from inProgressLabel and needsHumanLabel
                  rule: self.readyLabel != self.inProgressLabel && self.readyLabel
                    != self.needsHumanLabel
              knightSelector:
                description: |-
                  knightSelector is a label selector for Knights that belong to this table.
                  Knights matching this selector are automatically managed by this RoundTable.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
              knightTemplates:
                additionalProperties:
                  description: KnightSpec defines the desired state of a Knight —
                    an AI agent in the Round Table.
                  properties:
                    arsenals:
                      description: |-
                        arsenals is the single ordered list of skill sources merged into /skills.
                        The first entry is the base; later entries override it per skill:
                        /skills/<category>/<skill> links to the LAST arsenal that provides that
                        skill. Each git entry runs its own git-sync-<name> sidecar. When empty
                        (and no RoundTable default applies) it defaults to one entry
                        {name: platform, repo: https://github.com/roundtable-k8s/arsenal}.
                      items:
