metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: roundtables.ai.roundtable.io
spec:
  group: ai.roundtable.io
  names:
    categories:
    - roundtable
    kind: RoundTable
    listKind: RoundTableList
    plural: roundtables
    shortNames:
    - rt
    singular: roundtable
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
