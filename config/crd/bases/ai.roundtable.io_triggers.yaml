---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: triggers.ai.roundtable.io
spec:
  group: ai.roundtable.io
  names:
    categories:
    - roundtable
    kind: Trigger
    listKind: TriggerList
    plural: triggers
    shortNames:
    - trg
    singular: trigger
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.target.chainRef.name
      name: Chain
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .status.lastFiredAt
      name: Last Fired
      type: date
    - jsonPath: .spec.suspend
      name: Suspend
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Trigger starts a run of a Chain with input rendered from an event: a
          message on the RoundTable's events stream, a webhook delivered through the
          gateway, a cron schedule, or a GitHub issue or pull request matching a
          query.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Trigger
            properties:
              concurrency:
                description: concurrency bounds how many runs are active at once.
                properties:
                  maxActive:
                    description: |-
                      maxActive caps active runs under Allow; a firing at the cap is
                      skipped. 0 means no cap. Ignored by Forbid and Replace.
                    format: int32
                    minimum: 0
                    type: integer
                  policy:
                    default: Allow
                    description: |-
                      policy is Allow (start next to active runs, up to maxActive), Forbid
                      (skip while a run is active) or Replace (delete the active runs, then
                      start). Defaults to Allow.
                    enum:
                    - Allow
                    - Forbid
                    - Replace
                    type: string
                type: object
              dedupeKey:
                description: |-
                  dedupeKey is a Go template (same data as input) whose result
                  identifies the event: an event whose key matches a run that still
                  exists starts nothing. Defaults to the Nats-Msg-Id header (else the
                  stream sequence) for NATS and webhook, the scheduled time for
                  schedule, and "<owner/name>#<number>" for github.
                type: string
              input:
                description: |-
                  input is a Go template rendered into the run's spec.input. The event
                  is available as .Event: .Event.Subject, .Event.Data (the payload
                  parsed as JSON, or the raw string), .Event.Headers (map of header name
                  to value) and .Event.Time; .Trigger has .Name and .Namespace. A
                  missing map key is an error. toJson encodes a value as JSON. Empty
                  keeps the target Chain's own spec.input.
                type: string
              roundTableRef:
                description: |-
                  roundTableRef names the RoundTable (same namespace) whose events
                  stream a NATS, webhook or github source reads, and whose
                  spec.github.tokenSecretRef a github source polls with. Required for
                  source.nats, source.webhook and source.github.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              source:
                description: source is where events come from.
                properties:
                  github:
                    description: |-
                      github polls GitHub for issues or pull requests matching a query and
                      fires once per item. The operator publishes each item to
                      <subjectPrefix>.events.github.<namespace>.<name> on the RoundTable's
                      events stream, which the Trigger reads like a NATS source.
                    properties:
                      claim:
                        description: |-
                          claim marks an item as taken once its run was created, so it is not
                          picked again: typically remove the selecting label and add an
                          in-progress one. With a claim, an item that matches again after its
                          run finished (the selecting label was put back) starts that run again.
                        properties:
                          addLabels:
                            description: |-
                              addLabels are added to the item (created in the repository if
                              missing).
                            items:
                              maxLength: 50
                              minLength: 1
                              type: string
                            maxItems: 10
                            type: array
                            x-kubernetes-list-type: set
                          assignees:
                            description: |-
                              assignees are GitHub logins assigned to the item. GitHub ignores
                              logins that cannot be assigned.
                            items:
                              type: string
                            maxItems: 10
                            type: array
                            x-kubernetes-list-type: set
                          comment:
                            description: |-
                              comment is a Go template posted on the item once per run, after the
                              labels were added. It sees .Event (as in spec.input), .Trigger and
                              .Run (.Run.Name, and .Run.ID: the run's ai.roundtable.io/run value).
                              Empty posts no comment.
                            maxLength: 4096
                            type: string
                          removeLabels:
                            description: removeLabels are removed from the item, last.
                            items:
                              maxLength: 50
                              minLength: 1
                              type: string
                            maxItems: 10
                            type: array
                            x-kubernetes-list-type: set
                        type: object
                        x-kubernetes-validations:
                        - message: set claim.addLabels or claim.removeLabels
                          rule: (has(self.addLabels) && size(self.addLabels) > 0)
                            || (has(self.removeLabels) && size(self.removeLabels)
                            > 0)
                      holdWhilePullRequestLabeled:
                        description: |-
                          holdWhilePullRequestLabeled holds a repository while it has an open
                          pull request with this label: its items start no new run until the
                          pull request is merged or closed (for example a pull request that
                          changes an API). If the pull requests cannot be listed, the repository
                          is held too.
                        maxLength: 50
                        minLength: 1
                        type: string
                      kind:
                        default: issue
                        description: kind selects issues or pull requests. Defaults
                          to issue.
                        enum:
                        - issue
                        - pullRequest
                        type: string
                      maxActivePerRepository:
                        description: |-
                          maxActivePerRepository caps active runs per repository, next to
                          concurrency.maxActive for the whole Trigger. An item over the cap is
                          held and starts on a later poll. 0 means no cap. Applies under the
                          Allow concurrency policy.
                        format: int32
                        maximum: 50
                        minimum: 0
                        type: integer
                      pollInterval:
                        description: |-
                          pollInterval is how often each repository is listed. Defaults to 60s;
                          at least 30s.
                        type: string
                        x-kubernetes-validations:
                        - message: pollInterval must be at least 30s
                          rule: duration(self) >= duration('30s')
                      query:
                        description: query selects the items.
                        properties:
                          labels:
                            description: labels an item must all carry.
                            items:
                              maxLength: 50
                              minLength: 1
                              type: string
                            maxItems: 10
                            minItems: 1
                            type: array
                            x-kubernetes-list-type: set
                          state:
                            default: open
                            description: state is open, closed or all. Defaults to
                              open.
                            enum:
                            - open
                            - closed
                            - all
                            type: string
                        required:
                        - labels
                        type: object
                      repositories:
                        description: repositories are the repositories polled, as
                          "owner/name".
                        items:
                          maxLength: 140
                          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
                          type: string
                        maxItems: 50
                        minItems: 1
                        type: array
                        x-kubernetes-list-type: set
                      skipIfBodyMatches:
                        description: |-
                          skipIfBodyMatches hands items that must not start a run back instead:
                          items whose title or body matches a pattern, or that already carry a
                          handBack.addLabels label.
                        properties:
                          handBack:
                            description: |-
                              handBack is applied to a skipped item. Remove the selecting label so
                              it is handed back once.
                            properties:
                              addLabels:
                                description: |-
                                  addLabels are added to the item. An item that already carries one of
                                  them is handed back as well.
                                items:
                                  maxLength: 50
                                  minLength: 1
                                  type: string
                                maxItems: 10
                                type: array
                                x-kubernetes-list-type: set
                              comment:
                                description: |-
                                  comment is a Go template posted on the item. It sees .Event (as in
                                  spec.input), .Trigger and .Reason (why the item was skipped). Empty
                                  posts no comment.
                                maxLength: 4096
                                type: string
                              removeLabels:
                                description: removeLabels are removed from the item,
                                  last.
                                items:
                                  maxLength: 50
                                  minLength: 1
                                  type: string
                                maxItems: 10
                                type: array
                                x-kubernetes-list-type: set
                            type: object
                            x-kubernetes-validations:
                            - message: set handBack.addLabels or handBack.removeLabels
                              rule: (has(self.addLabels) && size(self.addLabels) >
                                0) || (has(self.removeLabels) && size(self.removeLabels)
                                > 0)
                          patterns:
                            description: |-
                              patterns are RE2 regular expressions matched against an item's title
                              and body.
                            items:
                              type: string
                            maxItems: 20
                            type: array
                        required:
                        - handBack
                        type: object
                    required:
                    - query
                    - repositories
                    type: object
                  nats:
                    description: |-
                      nats fires on each message published to a subject on the RoundTable's
                      events stream (<subjectPrefix>.events.>).
                    properties:
                      subject:
                        description: |-
                          subject is the subject filter (wildcards allowed). It must sit under
                          the table's "<subjectPrefix>.events.", for example
                          "fleet-a.events.deploys.>".
                        maxLength: 512
                        minLength: 1
                        pattern: ^[^\s]+$
                        type: string
                    required:
                    - subject
                    type: object
                  schedule:
                    description: schedule fires on a cron schedule.
                    properties:
                      cron:
                        description: cron is a standard five-field cron expression,
                          e.g. "0 7 * * 1-5".
                        minLength: 1
                        type: string
                      startingDeadlineSeconds:
                        description: |-
                          startingDeadlineSeconds bounds catch-up: a missed fire still runs only
                          if fewer than this many seconds have passed since it was due. Unset
                          always catches up (at most one run).
                        format: int64
                        minimum: 1
                        type: integer
                      timeZone:
                        description: |-
                          timeZone is the IANA time zone the schedule is evaluated in. Defaults
                          to UTC. "Local" is not accepted.
                        maxLength: 64
                        pattern: ^[A-Za-z][A-Za-z0-9_+\-]*(/[A-Za-z0-9_+\-]+)*$
                        type: string
                    required:
                    - cron
                    type: object
                  webhook:
                    description: |-
                      webhook fires on each authenticated POST to the gateway's
                      /v1/hooks/<namespace>/<name>. The gateway publishes the request body
                      to <subjectPrefix>.events.webhook.<namespace>.<name> on the
                      RoundTable's events stream, which the Trigger reads like a NATS source.
                    properties:
                      auth:
                        description: |-
                          auth is the credential a sender must present. The gateway accepts only
                          this credential on the Trigger's hook URL, never its own API tokens.
                        properties:
                          bearerTokenSecretRef:
                            description: |-
                              bearerTokenSecretRef selects the Secret key holding the token senders
                              send as "Authorization: Bearer <token>" (at least 16 characters).
                            properties:
                              key:
                                description: The key of the secret to select from.  Must
                                  be a valid secret key.
                                type: string
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                              optional:
                                description: Specify whether the Secret or its key
                                  must be defined
                                type: boolean
                            required:
                            - key
                            type: object
                            x-kubernetes-map-type: atomic
                          hmacSecretRef:
                            description: |-
                              hmacSecretRef selects the Secret key holding the HMAC-SHA256 key
                              senders sign the raw request body with, sent as
                              "X-Hub-Signature-256: sha256=<hex>" (GitHub style) or
                              "X-Signature: sha256=<hex>" (Flux generic-hmac).
                            properties:
                              key:
                                description: The key of the secret to select from.  Must
                                  be a valid secret key.
                                type: string
                              name:
                                default: ""
                                description: |-
                                  Name of the referent.
                                  This field is effectively required, but due to backwards compatibility is
                                  allowed to be empty. Instances of this type with an empty value here are
                                  almost certainly wrong.
                                  More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                type: string
                              optional:
                                description: Specify whether the Secret or its key
                                  must be defined
                                type: boolean
                            required:
                            - key
                            type: object
                            x-kubernetes-map-type: atomic
                        type: object
                        x-kubernetes-validations:
                        - message: set exactly one of auth.bearerTokenSecretRef or
                            auth.hmacSecretRef
                          rule: '[has(self.bearerTokenSecretRef), has(self.hmacSecretRef)].filter(x,
                            x).size() == 1'
                      eventType:
                        description: |-
                          eventType, when set, fires only on events of this type: the Ce-Type
                          header (CloudEvents), else X-GitHub-Event. Other events are stored on
                          the stream and acknowledged without firing.
                        maxLength: 253
                        type: string
                    required:
                    - auth
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of source.nats, source.schedule, source.webhook
                    or source.github
                  rule: '[has(self.nats), has(self.schedule), has(self.webhook), has(self.github)].filter(x,
                    x).size() == 1'
              suspend:
                description: |-
                  suspend stops firing. A NATS, webhook or github source's consumer is
                  deleted, so events published while suspended do not fire on resume (a
                  github source stops polling and picks up matching items again on
                  resume).
                type: boolean
              target:
                description: target is what each firing starts.
                properties:
                  chainRef:
                    description: chainRef names the Chain (same namespace) a firing
                      starts a copy of.
                    properties:
                      name:
                        default: ""
                        description: |-
                          Name of the referent.
                          This field is effectively required, but due to backwards compatibility is
                          allowed to be empty. Instances of this type with an empty value here are
                          almost certainly wrong.
                          More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                        type: string
                    type: object
                    x-kubernetes-map-type: atomic
                required:
                - chainRef
                type: object
              ttlSecondsAfterFinished:
                default: 86400
                description: |-
                  ttlSecondsAfterFinished deletes a finished run this long after it
                  completed. Its dedupe key is forgotten then too. 0 keeps finished runs.
                format: int32
                minimum: 0
                type: integer
            required:
            - source
            - target
            type: object
            x-kubernetes-validations:
            - message: roundTableRef is required for source.nats
              rule: '!has(self.source.nats) || has(self.roundTableRef)'
            - message: roundTableRef is required for source.webhook
              rule: '!has(self.source.webhook) || has(self.roundTableRef)'
            - message: roundTableRef is required for source.github
              rule: '!has(self.source.github) || has(self.roundTableRef)'
          status:
            description: status defines the observed state of Trigger
            properties:
              activeRuns:
                description: |-
                  activeRuns are the names of the Trigger's runs that are running or
                  pending.
                items:
                  type: string
                type: array
              conditions:
                description: |-
                  conditions: Ready is True while the Trigger is listening; GitHubReady
                  (github source) is True while polling works.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              consumer:
                description: consumer is the NATS, webhook or github source's durable
                  consumer.
                type: string
              lastFiredAt:
                description: lastFiredAt is when a firing last started a run.
                format: date-time
                type: string
              lastPolledAt:
                description: |-
                  lastPolledAt is when a github source last listed its repositories
                  successfully.
                format: date-time
                type: string
              lastScheduledAt:
                description: lastScheduledAt is the last schedule time handled (schedule
                  source).
                format: date-time
                type: string
              nextScheduledAt:
                description: nextScheduledAt is the next schedule time (schedule source).
                format: date-time
                type: string
              observedGeneration:
                description: observedGeneration is the generation last reconciled.
                format: int64
                type: integer
              recentFirings:
                description: recentFirings are the latest firings, newest first (at
                  most 10).
                items:
                  description: TriggerFiring records one event a Trigger handled.
                  properties:
                    key:
                      description: key is the event's dedupe key.
                      type: string
                    run:
                      description: run is the Chain the firing started.
                      type: string
                    skipReason:
                      description: skipReason says why the firing started nothing.
                      type: string
                    time:
                      description: time is when the event was handled.
                      format: date-time
                      type: string
                  required:
                  - time
                  type: object
                type: array
              stream:
                description: |-
                  stream is the JetStream stream the NATS, webhook or github source's
                  consumer is on.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'metadata.name must be at most 63 characters: it labels the Trigger''s
            runs'
          rule: self.metadata.name.size() <= 63
    served: true
    storage: true
    subresources:
      status: {}
