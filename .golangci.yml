version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  # Intentionally not enabled:
  #  - gocyclo: the large Reconcile state machines exceed any sensible threshold; splitting them is a
  #    refactor, not a lint fix.
  #  - dupl: flags table-style test cases and CRD plumbing that read better unfactored.
  enable:
    - copyloopvar
    - errcheck
    - ginkgolinter
    - goconst
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - lll
        path: internal/*
      # Repeated literals in tests (names, namespaces, label values) are clearer inline than as constants.
      - linters:
          - goconst
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
