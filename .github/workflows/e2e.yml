name: E2E

# Runs the core e2e tier (test/e2e, CONTRIBUTING.md) on a fresh kind cluster:
# the chart's operator, a knight and the stub LLM, no API keys. Only when the
# operator, the chart or the tests change.
on:
  pull_request:
    paths:
      - api/**
      - cmd/**
      - internal/**
      - pkg/**
      - charts/roundtable-operator/**
      - test/**
      - Dockerfile
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - api/**
      - cmd/**
      - internal/**
      - pkg/**
      - charts/roundtable-operator/**
      - test/**
      - Dockerfile
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/e2e.yml

  # The Tempo trial (#768): only when its own files change, or by hand.
  workflow_dispatch:

permissions:
  contents: read

env:
  KIND_VERSION: v0.27.0
  HELM_VERSION: v3.17.0

# Cancel the superseded runs of a pull request when it is pushed again. Push to
# main runs get a unique group (run_id), so they are never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-core:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@v5
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind

      - name: make e2e TIER=core
        run: |
          set -o pipefail
          make e2e TIER=core 2>&1 | tee e2e.log

      - name: Surface the failure
        if: failure()
        run: |
          # The failing output as an annotation (readable without the raw log).
          [ -f e2e.log ] && echo "::error title=make e2e::$(grep -v 'downloading' e2e.log | tail -n 150 | cut -c1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')"

  # Live trial of Grafana Tempo (docs/design/observability-standard.md). Not a
  # required check; runs on a PR only when the trial's own files change, and
  # when started by hand.
  e2e-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Did the trial's files change?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          run=false
          case "$EVENT" in
            workflow_dispatch) run=true ;;
            pull_request) range="$BASE_SHA...$HEAD_SHA" ;;
            *) ;;
          esac
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$range" | grep -E '^(test/e2e/trial_tempo_test\.go|test/e2e/testdata/(tempo|otel-trial-values)\.yaml|\.github/workflows/e2e\.yml)$' && run=true || true
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.changed.outputs.run == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - uses: azure/setup-helm@v4
        if: steps.changed.outputs.run == 'true'
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install kind
        if: steps.changed.outputs.run == 'true'
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          chmod +x kind && sudo mv kind /usr/local/bin/kind

      - name: make e2e TIER=trial
        if: steps.changed.outputs.run == 'true'
        run: |
          set -o pipefail
          make e2e TIER=trial 2>&1 | tee e2e.log

      - name: Publish the measurements
        if: steps.changed.outputs.run == 'true' && always()
        run: |
          line=$(grep -h 'TRIAL_NOTICE: ' e2e.log 2>/dev/null | tail -n 1 | sed 's/^.*TRIAL_NOTICE: //' | cut -c1-500)
          [ -n "$line" ] && echo "::notice title=Tempo trial::$line"
          exit 0

      - name: Surface the failure
        if: steps.changed.outputs.run == 'true' && failure()
        run: |
          [ -f e2e.log ] && echo "::error title=make e2e TIER=trial::$(grep -v 'downloading' e2e.log | tail -n 150 | cut -c1-300 | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\r//g;s/\n/%0A/g')"
