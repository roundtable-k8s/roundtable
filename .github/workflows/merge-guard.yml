name: Merge guard

# Enforces in CI what rt-lead's prompt only asks for (roundtable#260): on
# 2026-11-23 rt-lead queued #266 with a `hold` label and no posted review.
# - Any PR with the `hold` label fails.
# - Bot-authored PRs (the knights) need a posted review whose last
#   "Verdict:" line is "Verdict: ship it" (dismissed reviews don't count).
# Runs again in the merge queue, so a `hold` added after queueing still stops it.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  merge_group:
    types: [checks_requested]

permissions:
  pull-requests: read

concurrency:
  group: merge-guard-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true

jobs:
  merge-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check hold label and review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          QUEUE_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = merge_group ]; then
            # gh-readonly-queue/main/pr-<number>-<sha>
            PR="$(sed -nE 's#.*/pr-([0-9]+)-[0-9a-f]+$#\1#p' <<<"$QUEUE_REF")"
            [ -n "$PR" ] || { echo "::error::Cannot parse a PR number from $QUEUE_REF"; exit 1; }
          fi
          pr="$(gh api "repos/$REPO/pulls/$PR")"
          if jq -e '[.labels[].name] | index("hold")' <<<"$pr" >/dev/null; then
            echo "::error::PR #$PR has the hold label."
            exit 1
          fi
          if [ "$(jq -r .user.type <<<"$pr")" != Bot ]; then
            echo "PR #$PR is human-authored: no review verdict required."
            exit 0
          fi
          verdict="$(gh api --paginate "repos/$REPO/pulls/$PR/reviews" \
            --jq '.[] | select(.state != "DISMISSED") | .body' \
            | tr -d '\r' | grep -E '^Verdict: ' | tail -n 1 || true)"
          echo "Latest verdict: ${verdict:-none}"
          if [ "$verdict" != "Verdict: ship it" ]; then
            echo "::error::PR #$PR needs a posted review ending in 'Verdict: ship it' before it can merge."
            exit 1
          fi
