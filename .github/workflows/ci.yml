name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

# Cancel the superseded runs of a pull request when it is pushed again. Push to
# main and merge_group runs get a unique group (run_id), so they are never
# cancelled or queued behind each other: the merge queue and publishing need them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # On main, the merge queue already ran build + lint on this exact commit (the
  # queue fast-forwards main to the commit it tested). Skip re-testing it and go
  # straight to the image and chart. A commit pushed around the queue (admin
  # bypass) has no successful merge_group run and is tested in full.
  queue-tested:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          n="$(gh run list -R "$REPO" --workflow CI --event merge_group --commit "$SHA" \
            --status success --json databaseId --jq length)"
          echo "Successful merge_group runs for $SHA: $n"
          if [ "$n" -gt 0 ]; then echo "tested=true" >> "$GITHUB_OUTPUT"; else echo "tested=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: queue-tested
    if: ${{ !cancelled() && needs.queue-tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      # Tools come from the Makefile (pinned versions, retried downloads).
      - name: Generate DeepCopy
        run: make generate

      - name: Generate CRD Manifests
        run: make manifests

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -o bin/manager cmd/main.go

      - name: Setup envtest
        run: |
          make setup-envtest
          ENVTEST_ASSETS=$(make -s print-envtest-assets)
          echo "KUBEBUILDER_ASSETS=${ENVTEST_ASSETS}" >> $GITHUB_ENV

      # -race: flaky tests only surfaced in the merge queue before (#253).
      - name: Test
        run: go test -race ./... -coverprofile cover.out

  # Runs on PRs and in the merge queue: the chart's pipeline template drifted
  # from the CRDs once because only the main-branch helm job touched the chart.
  helm-check:
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: scripts/check-install-versions.sh checks that
      # pinned versions name an existing tag, which needs tags in the clone.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Helm lint + PR pipeline example check
        run: make helm-check

  # Fails on any golangci-lint finding (main is clean as of #207). `make lint`
  # builds the custom golangci-lint with the logcheck plugin (.custom-gcl.yml)
  # at the version the Makefile pins, so CI and local runs use the same linter.
  lint:
    needs: queue-tested
    if: ${{ !cancelled() && needs.queue-tested.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        run: make lint

  docker:
    needs: [queue-tested, build, lint]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.queue-tested.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.build.result)
      && contains(fromJSON('["success","skipped"]'), needs.lint.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate code
        run: make generate manifests

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  helm:
    needs: [queue-tested, build, lint]
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.queue-tested.result == 'success'
      && contains(fromJSON('["success","skipped"]'), needs.build.result)
      && contains(fromJSON('["success","skipped"]'), needs.lint.result)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Generate CRD Manifests
        run: make manifests

      - name: Copy CRDs into chart
        run: |
          # Only copy actual CRD manifests, exclude kustomization.yaml
          for f in config/crd/bases/ai.roundtable.io_*.yaml; do
            cp "$f" charts/roundtable-operator/crds/
          done

      - name: Set chart version from SHA
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # Never reuse a released chart version: main builds publish as a
          # pre-release of the Chart.yaml version (e.g. 0.25.0-dev.abc1234), and
          # the helm job fails if that version is already tagged v<version>.
          BASE=$(sed -n 's/^version: *//p' charts/roundtable-operator/Chart.yaml | tr -d '"')
          git fetch --tags --quiet
          if git rev-parse -q --verify "refs/tags/v${BASE}" >/dev/null; then
            echo "Chart version ${BASE} is already released (tag v${BASE}); bump Chart.yaml version" >&2
            exit 1
          fi
          sed -i "s/^version:.*/version: ${BASE}-dev.${SHORT_SHA}/" charts/roundtable-operator/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ github.sha }}\"/" charts/roundtable-operator/Chart.yaml
          cat charts/roundtable-operator/Chart.yaml

      - uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Package and push chart
        run: |
          helm package charts/roundtable-operator
          helm push roundtable-operator-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
