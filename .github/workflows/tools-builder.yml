name: Tools builder image

# Builds the prebuilt builder for knight tools image Jobs (Dockerfile.tools-builder)
# and, on main, publishes it under a tag derived from the operator's pins. The
# operator computes the same tag (knight.ToolsBuilderTag), so nothing needs
# pinning by hand. The build compiles nix2container's tooling and takes several
# minutes, so it only runs when something that determines the image changes,
# and skips the publish when that tag already exists.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.tools-builder
      - cmd/toolsflake/**
      - internal/knight/tools_image.go
      - internal/knight/helpers.go
      - .github/workflows/tools-builder.yml
  pull_request:
    branches: [main]
    paths:
      - Dockerfile.tools-builder
      - cmd/toolsflake/**
      - internal/knight/tools_image.go
      - internal/knight/helpers.go
      - .github/workflows/tools-builder.yml

permissions:
  contents: read

jobs:
  tools-builder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tools-builder
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve image tag from the operator's pins
        id: tag
        run: echo "tag=$(go run ./cmd/toolsflake -tag)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this tag is already published
        id: published
        if: github.event_name == 'push'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if docker manifest inspect "${IMAGE}:${TAG}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${IMAGE}:${TAG} is already published; skipping the build"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.published.outputs.exists != 'true'

      # Pull requests build without pushing, to prove the image still builds.
      - uses: docker/build-push-action@v6
        if: steps.published.outputs.exists != 'true'
        with:
          context: .
          file: Dockerfile.tools-builder
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
