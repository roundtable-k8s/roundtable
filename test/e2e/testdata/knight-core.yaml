# A minimal Knight for the e2e core tier. The knight never does real LLM work:
# the test only needs the Deployment to become available, so it runs the
# public pi-knight image with isolation off (kind has no gVisor). Its model is
# routed to the stub LLM: pi-knight preflights an uncatalogued model against an
# OpenAI-compatible endpoint (localhost:4000 by default) and reports 503 on
# /ready until that endpoint answers.
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: core-knight
  namespace: roundtable-core
spec:
  domain: e2e
  model: stubllm/e2e
  skills: [e2e]
  env:
    - name: OPENAI_BASE_URL
      value: http://stubllm.roundtable-core.svc:8080/v1
    - name: OPENAI_API_KEY
      value: stub-placeholder-not-a-key
  nats:
    url: nats://nats.database.svc:4222
    stream: core_tasks
    resultsStream: core_results
    subjects:
      - "core.tasks.e2e.>"
  isolation:
    runtime: none
    egress: unrestricted
    reason: e2e core tier on kind (no gVisor, no LLM)
  workspace:
    mode: ephemeral
    size: 1Gi
  concurrency: 1
  taskTimeoutSeconds: 60
