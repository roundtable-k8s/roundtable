# A pi-knight for the e2e core round trip: its model is routed to the stub LLM
# (OPENAI_BASE_URL), so a task completes with no real provider; pi-knight
# supplies a dummy key itself, so none is set. Its own subject (core.tasks.rt.>) keeps the
# minimal core-knight from seeing the task.
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: rt-knight
  namespace: roundtable-core
spec:
  domain: rt
  model: stubllm/e2e
  skills: [e2e]
  env:
    - name: OPENAI_BASE_URL
      value: http://stubllm.roundtable-core.svc:8080/v1
  nats:
    url: nats://nats.database.svc:4222
    stream: core_tasks
    resultsStream: core_results
    subjects:
      - "core.tasks.rt.>"
  isolation:
    runtime: none
    egress: unrestricted
    reason: e2e core round trip on kind (no gVisor, stub LLM)
  workspace:
    mode: ephemeral
    size: 1Gi
  concurrency: 1
  taskTimeoutSeconds: 120
