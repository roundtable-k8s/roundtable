# Chart values for the e2e webhook tier: the operator from the locally built
# image, with the optional components off.
fullnameOverride: rt-webhook
image:
  repository: example.com/roundtable-operator
  tag: v0.0.1
  pullPolicy: IfNotPresent
# kind has no gVisor; the test knight also opts out.
isolation:
  runtimeClassName: ""
  egress:
    mode: "off"
missionNetworkPolicy:
  enabled: false
dashboard:
  enabled: false
gateway:
  enabled: true
  # The harness NATS Service (the chart default, set explicitly).
  natsURL: nats://nats.database.svc:4222
  hooks:
    enabled: true
planner:
  enabled: false
