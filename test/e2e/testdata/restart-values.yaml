# Chart values for the e2e restart tier: the operator from the locally built
# image, with the optional components off.
fullnameOverride: rt-restart
image:
  repository: example.com/roundtable-operator
  tag: v0.0.1
  pullPolicy: IfNotPresent
# kind has no gVisor; the test knight also opts out.
isolation:
  runtimeClassName: ""
  egress:
    mode: "off"
missionNetworkPolicy:
  enabled: false
dashboard:
  enabled: false
gateway:
  enabled: false
planner:
  enabled: false
