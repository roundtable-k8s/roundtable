# The e2e stub LLM (test/e2e/stubllm, image stubllm:e2e loaded into kind) as a
# Deployment + Service in the core namespace. Knights reach it at
# http://stubllm.roundtable-core.svc:8080/v1.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stubllm
  namespace: roundtable-core
  labels:
    app: stubllm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stubllm
  template:
    metadata:
      labels:
        app: stubllm
    spec:
      containers:
        - name: stubllm
          image: stubllm:e2e
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /v1/models
              port: 8080
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: stubllm
  namespace: roundtable-core
spec:
  selector:
    app: stubllm
  ports:
    - port: 8080
      targetPort: 8080
