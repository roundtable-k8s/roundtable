# A table, one stub knight (test/e2e/stubknight, no LLM), a one-step template
# Chain and a NATS-source Trigger on the table's events stream, for the e2e
# trigger tier.
apiVersion: ai.roundtable.io/v1alpha1
kind: RoundTable
metadata:
  name: e2e-table
  namespace: roundtable-trigger
spec:
  nats:
    url: nats://nats.database.svc:4222
    subjectPrefix: e2e
    tasksStream: e2e_tasks
    resultsStream: e2e_results
    createStreams: true
    streamRetention: WorkQueue
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: stub
  namespace: roundtable-trigger
  labels:
    ai.roundtable.io/round-table: e2e-table
spec:
  domain: e2e
  image: example.com/roundtable-e2e-stub-knight:v0.0.1
  model: stub-model
  skills: [e2e]
  nats:
    url: nats://nats.database.svc:4222
    stream: e2e_tasks
    resultsStream: e2e_results
    subjects:
      - "e2e.tasks.e2e.>"
  isolation:
    runtime: none
    egress: unrestricted
    reason: e2e stub knight on kind (no gVisor, no LLM)
  workspace:
    mode: ephemeral
    size: 1Gi
  concurrency: 1
  taskTimeoutSeconds: 60
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Chain
metadata:
  name: trace-e2e
  namespace: roundtable-trigger
spec:
  roundTableRef: {name: e2e-table}
  timeoutSeconds: 600
  steps:
    - name: gather
      knightRef: {name: stub}
      timeoutSeconds: 120
      task: |
        Handle this event: {{ .Input }}
---
apiVersion: ai.roundtable.io/v1alpha1
kind: Trigger
metadata:
  name: on-event
  namespace: roundtable-trigger
spec:
  roundTableRef: {name: e2e-table}
  source:
    nats:
      subject: e2e.events.deploys.>
  target:
    chainRef: {name: trace-e2e}
  input: |
    deploy of {{ .Event.Data.service }} {{ .Event.Data.version }}
  dedupeKey: "{{ .Event.Data.service }}@{{ .Event.Data.version }}"
