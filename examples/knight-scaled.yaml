# A horizontally scaled knight (#215): up to 4 workers on one durable
# consumer, scaled 0..4 by KEDA on pending tasks. Needs KEDA installed;
# without it the knight runs spec.replicas pods and reports Autoscaled=False.
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: coder
  namespace: roundtable
spec:
  domain: dev
  model: openrouter/z-ai/glm-5.3
  skills:
    - dev
  nats:
    url: nats://nats.database.svc:4222
    stream: rt_dev_tasks
    resultsStream: rt_dev_results
    subjects:
      - "rt_dev.tasks.dev.>"
  # Default-deny egress (#387) allows DNS, NATS, the Kubernetes API, the
  # model providers and the arsenal hosts; a coder also needs GitHub.
  egress:
    allowedHosts:
      - github.com
      - api.github.com
      - "*.githubusercontent.com"
  concurrency: 1        # tasks per pod
  replicas: 1           # KEDA minReplicaCount (0 with suspendPolicy: auto)
  maxReplicas: 4        # KEDA maxReplicaCount
  workspace:
    mode: ephemeral     # per-pod emptyDir; required for more than one replica
    size: 4Gi           # emptyDir size limit
  lifecycle:
    suspendPolicy: auto # scale to zero when idle
    idleTimeoutSeconds: 900    # ScaledObject cooldownPeriod
    scaleDownStabilizationSeconds: 600  # HPA scale-down window (default 600)
