# A CronJob that runs the invokable chain "digest" through the invoke gateway
# every morning and waits for it, authenticated with its own ServiceAccount
# token: no stored gateway credential. The projected token's audience must
# equal gateway.serviceAccountAuth.audience (default roundtable-gateway), and
# the gateway's NetworkPolicy (gateway.networkPolicy.from) must let the pod in.
# The ServiceAccount needs no RBAC; the gateway records the caller as
# roundtable/nightly-digest (the ai.roundtable.io/caller annotation on the run).
# The chain needs the label ai.roundtable.io/invokable: "true".
# See docs/gateway.md#calling-from-a-workload.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nightly-digest
  namespace: roundtable
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: nightly-digest
  namespace: roundtable
spec:
  schedule: "0 6 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: nightly-digest
          # Only the projected token below is mounted, not the default one.
          automountServiceAccountToken: false
          restartPolicy: Never
          containers:
            - name: run
              image: curlimages/curl:8.11.0
              env:
                - name: GW
                  value: http://roundtable-roundtable-operator-gateway.roundtable.svc
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  TOKEN=$(cat /var/run/secrets/roundtable-gateway/token)
                  # Run the invokable chain "digest" and wait up to 25 minutes.
                  code=$(curl -sS --max-time 1560 -o /tmp/run.json -w '%{http_code}' \
                    -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                    "$GW/v1/chains/digest/runs" \
                    -d '{"input": {"date": "'"$(date +%F)"'"}, "waitSeconds": 1500}')
                  cat /tmp/run.json
                  # 200 = finished; 202 = still running after 1500 s.
                  [ "$code" = 200 ] && grep -q '"phase":"Succeeded"' /tmp/run.json
              volumeMounts:
                - name: gateway-token
                  mountPath: /var/run/secrets/roundtable-gateway
                  readOnly: true
          volumes:
            - name: gateway-token
              projected:
                sources:
                  - serviceAccountToken:
                      # Must equal gateway.serviceAccountAuth.audience.
                      audience: roundtable-gateway
                      expirationSeconds: 3600
                      path: token
