apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: galahad
  namespace: roundtable
spec:
  domain: security
  model: claude-sonnet-4-20250514
  skills:
    - security
    - threat-intel
  nats:
    url: nats://nats.database.svc:4222
    stream: fleet_a_tasks
    resultsStream: fleet_a_results
    subjects:
      - "fleet-a.tasks.security.>"
  # Isolated by default (#387): gVisor plus default-deny egress. The baseline
  # (DNS, NATS, Kubernetes API, model providers, arsenal) is always allowed;
  # threat-intel lookups need these hosts on top.
  egress:
    allowedHosts:
      - services.nvd.nist.gov
      - cveawg.mitre.org
  concurrency: 2
  taskTimeoutSeconds: 300
  workspace:
    size: 2Gi
