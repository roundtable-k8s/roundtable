# Try-it-out trace viewer: Jaeger all-in-one with in-memory storage. Not for
# production. Apply to the namespace the operator is installed in (roundtable).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: roundtable
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: roundtable-observability-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jaeger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jaeger
        app.kubernetes.io/part-of: roundtable-observability-example
    spec:
      automountServiceAccountToken: false
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: ui
              containerPort: 16686
          readinessProbe:
            httpGet:
              path: /
              port: ui
          resources:
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: roundtable
  labels:
    app.kubernetes.io/name: jaeger
    app.kubernetes.io/part-of: roundtable-observability-example
spec:
  selector:
    app.kubernetes.io/name: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: ui
      port: 16686
      targetPort: ui
