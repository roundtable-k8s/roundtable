# Issue pickup (#224): poll GitHub for issues labelled rt:ready and start one
# copy of the pr-pipeline Chain per issue. See docs/issue-pickup.md.
# Needs the pr-pipeline Chain (chart value prPipeline.enabled: true) in the
# same namespace and a GitHub token with Issues read & write on the repos.
apiVersion: ai.roundtable.io/v1alpha1
kind: RoundTable
metadata:
  name: roundtable-dev
  namespace: roundtable
spec:
  description: "Dev table — knights take Ready issues to merged PRs"

  nats:
    url: nats://nats.database.svc:4222
    subjectPrefix: roundtable-dev
    tasksStream: roundtable_dev_tasks
    resultsStream: roundtable_dev_results

  # Model aliases the PR pipeline uses.
  modelAliases:
    deep: opus
    fast: haiku
    review: sonnet

  # Shared by the table's knights and by issue pickup.
  github:
    tokenSecretRef:
      name: roundtable-github-token
      key: token

  issuePickup:
    # builtin (default) polls in the issue pickup controller; trigger runs
    # pickup on a generated Trigger "<table>-issue-pickup" (needs
    # nats.createStreams or an events stream). See docs/issue-pickup.md#engines.
    # engine: trigger
    repos:
      - roundtable-k8s/roundtable
      - roundtable-k8s/roundtable-ui
    chainRef:
      name: pr-pipeline
    readyLabel: "rt:ready"
    inProgressLabel: "rt:in-progress"
    needsHumanLabel: needs-human
    maxActive: 2
    maxActivePerRepo: 1
    intervalSeconds: 300
    ttlSecondsAfterFinished: 604800
