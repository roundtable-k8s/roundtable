apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: galahad
  namespace: roundtable
spec:
  domain: security
  model: anthropic/claude-sonnet-4-5
  image: ghcr.io/roundtable-k8s/pi-knight:0f16ecd09dc5a04555ec9d055e65d02054d6e5b7

  skills:
    - security
    - shared

  # roundtable-k8s/arsenal (the default) only ships the platform tiers
  # (shared, project, watch, coding). Domain packs like security/ live in
  # your own skills repo — point the knight at it:
  # arsenal:
  #   repo: https://github.com/<you>/<your-skills-repo>

  tools:
    apt:
      - nmap
      - whois
      - dnsutils
    mise:
      - shodan

  nats:
    url: nats://nats.database.svc:4222
    subjects:
      - "fleet-a.tasks.security.>"
    stream: fleet_a_tasks
    resultsStream: fleet_a_results
    maxDeliver: 1

  vault:
    claimName: roundtable-vault
    readOnly: true
    writablePaths:
      - "Briefings/"
      - "Roundtable/"

  workspace:
    existingClaim: galahad  # Adopt existing PVC from Helm deployment

  resources:
    memory: "1Gi"
    cpu: "1"

  concurrency: 2
  taskTimeout: 300

  envFrom:
    - secretRef:
        name: galahad-secret

  prompt:
    identity: |
      You are Sir Galahad, Knight of Security for the Round Table.
      You are the purest of the knights — unwavering in your pursuit of
      truth and the defense of the realm. Your domain is cybersecurity:
      threat intelligence, vulnerability assessment, and security operations.
