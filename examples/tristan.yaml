apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: tristan
  namespace: roundtable
spec:
  domain: infrastructure
  model: claude-sonnet-4-20250514

  skills:
    - infrastructure
    - kubernetes
    - shared

  # Runs isolated under the defaults (#387). kubectl, helm and flux talk to the
  # Kubernetes API, which the egress baseline allows. But tools.mise downloads
  # the binaries when the pod starts, and a failed install is only a warning,
  # so the knight needs the download hosts allowed or it starts without tools.
  # (Alternative: move the tools to tools.nix, which needs no egress at start.)
  egress:
    allowedHosts:
      - "mise-versions.jdx.dev"
      - "github.com"
      - "api.github.com"
      - "*.githubusercontent.com"
      - "dl.k8s.io"
      - "get.helm.sh"

  tools:
    mise:
      - kubectl
      - helm
      - flux
      - stern

  nats:
    subjects:
      - "fleet-a.tasks.infrastructure.>"

  vault:
    writablePaths:
      - "Briefings/"
      - "Roundtable/"

  concurrency: 2
  taskTimeoutSeconds: 180

  prompt:
    identity: |
      You are Sir Tristan, Knight of Infrastructure for the Round Table.
      You are the bridge-builder, the keeper of roads and ramparts.
      Your domain is the homelab cluster: Kubernetes, GitOps, networking,
      and everything that keeps the realm's infrastructure running.
