# PR pipeline (#225): the standard chain every Ready issue runs.
#
#   plan (rt-lead) ─┬─ implement_<coder>_<alias>   one PR, "Closes #n"
#                   └─ split_<coder> (forEach)      one PR per sub-issue
#   → review (rt-lead) → fixloop_<coder>: fix (coder) → review (rt-lead),
#     until "Verdict: ship it", at most 3 rounds, onExhausted: continue
#   → merge (Converged: gh pr merge --auto) | escalate (Exhausted: needs-human)
#
# Input: {"repo": "<owner>/<repo>", "issue": <n>}. The planner picks the coder
# and the model alias; knightRef and model are static per step, so there is
# one `when`-gated step per choice and exactly one of them runs.
# Needs the RoundTable's spec.modelAliases to define the aliases used: deep and fast (and cheap when implementModels lists it; they only
# need to resolve on the coders' runtime: lead steps set no model, so a lead on
# another runtime, e.g. pi-knight, uses its default), and every knight named
# here to exist (the Chain is invalid otherwise).
#
# Rendered from the Helm chart (templates/pr-pipeline.yaml with
# prPipeline.coders=[rt-operator, rt-ui]). Change the template and re-render
# (docs/pr-pipeline.md) rather than editing this file.
apiVersion: ai.roundtable.io/v1alpha1
kind: Chain
metadata:
  name: pr-pipeline
  namespace: roundtable
spec:
  description: "PR pipeline: plan → implement → review → fix loop → merge, or escalate to a human"
  roundTableRef:
    name: roundtable-dev
  timeoutSeconds: 86400
  maxQueueWaitSeconds: 3600
  input: '{"repo": "roundtable-k8s/roundtable", "issue": 225}'
  steps:
    - name: plan
      knightRef:
        name: rt-lead
      timeoutSeconds: 1800
      task: |
        Plan the work for a GitHub issue. Input (JSON with repo and issue): {{ .Input }}

        1. Read the issue (gh issue view <issue> --repo <repo>) and the repo's AGENTS.md / README.
        2. Pick the coder knight that owns this repo or area. It must be one of: rt-operator, rt-ui.
        3. Pick the model alias for the implementation (cheapest tier that fits;
           a weaker draft is fixed by the stronger "deep" model in the fix loop).
           Allowed: deep, fast.
           - "fast": the default.
           - "deep": design-heavy, cross-cutting or risky work.
           Record why in "reason", naming the tier and the criteria that decided it.
        4. If the issue is too large for one reviewable PR, split it: create
           sub-issues in the same repo (gh issue create, body starting
           "Part of #<issue>"), comment the list on the issue and set split to
           true. "issues" then lists each sub-issue exactly once and never the
           parent issue: every entry becomes one implement task and one PR.
           Reuse sub-issues that already exist (gh issue list --search
           "Part of #<issue>") instead of creating duplicates.
           Otherwise set split to false and list just the input issue.
        5. Breaking changes: if the work changes an API type, a CRD, the task
           contract or another interface other repos or live resources depend
           on, set "breaking" to true. The implementing PR gets the `breaking`
           label and a migration note.
        6. Check for open breaking PRs (gh pr list --repo <repo> --label breaking
           --state open --json number,headRefName,files). If one touches the
           packages this issue touches, do not start parallel work: reply with
           coder "none" and a reason "blocked by #<pr>" (the chain then
           escalates and the issue waits for a human). Only if the issue
           depends on that PR's change, name its branch in "base" so the coder
           branches from it instead of origin/main.

        Reply with ONLY a fenced ```json block of exactly this shape:
        {"coder": "<knight>", "model": "<alias>", "split": false, "breaking": false,
         "base": "", "issues": [{"number": <n>, "title": "<title>"}], "reason": "<one sentence>"}

    - name: implement_rt_operator_deep
      knightRef:
        name: rt-operator
      model: deep
      dependsOn: [plan]
      when: 'json(steps.plan.output).coder == "rt-operator" && json(steps.plan.output).model == "deep" && !json(steps.plan.output).split'
      timeoutSeconds: 3600
      task: |
        Implement this GitHub issue. Input (JSON with repo and issue): {{ .Input }}
        Plan: {{ .Steps.plan.Output }}

        Follow the repo's AGENTS.md / README. Work in a fresh clone on a branch
        rt/<issue>-<short-slug>, keep the change focused, add tests and run the
        repo's build, test and lint.
        One PR per issue: first look for an open PR for it
        (gh pr list --repo <repo> --state open --search "Closes #<issue> in:body"
        --json number,url,headRefName, and any open PR whose branch starts with
        "rt/<issue>-"). If one exists, check out its branch, push your work there
        and update that PR instead of opening a new one. Otherwise open one PR
        whose body ends "Closes #<issue>".
        If the plan's "base" is set, branch from that branch instead of origin/main
        and open the PR against it. If the plan's "breaking" is true, label the PR
        `breaking` (create the label if missing) and add a "Migration" section to
        the body: who must change what, and in which order to roll it out.
        Never merge. Reply with the PR URL on the first line.

    - name: implement_rt_operator_fast
      knightRef:
        name: rt-operator
      model: fast
      dependsOn: [plan]
      when: 'json(steps.plan.output).coder == "rt-operator" && json(steps.plan.output).model == "fast" && !json(steps.plan.output).split'
      timeoutSeconds: 3600
      task: |
        Implement this GitHub issue. Input (JSON with repo and issue): {{ .Input }}
        Plan: {{ .Steps.plan.Output }}

        Follow the repo's AGENTS.md / README. Work in a fresh clone on a branch
        rt/<issue>-<short-slug>, keep the change focused, add tests and run the
        repo's build, test and lint.
        One PR per issue: first look for an open PR for it
        (gh pr list --repo <repo> --state open --search "Closes #<issue> in:body"
        --json number,url,headRefName, and any open PR whose branch starts with
        "rt/<issue>-"). If one exists, check out its branch, push your work there
        and update that PR instead of opening a new one. Otherwise open one PR
        whose body ends "Closes #<issue>".
        If the plan's "base" is set, branch from that branch instead of origin/main
        and open the PR against it. If the plan's "breaking" is true, label the PR
        `breaking` (create the label if missing) and add a "Migration" section to
        the body: who must change what, and in which order to roll it out.
        Never merge. Reply with the PR URL on the first line.

    - name: split_rt_operator
      knightRef:
        name: rt-operator
      model: deep
      dependsOn: [plan]
      when: 'json(steps.plan.output).coder == "rt-operator" && json(steps.plan.output).split'
      timeoutSeconds: 3600
      forEach:
        from: steps.plan
        path: .issues
        uniqueBy: number
        maxItems: 10
      maxParallel: 2
      failurePolicy: failFast
      task: |
        Implement sub-issue #{{ .Item.number }} ({{ .Item.title }}) of {{ .Input }}.

        This task owns sub-issue #{{ .Item.number }} only: do not implement
        the parent issue or other sub-issues.
        Follow the repo's AGENTS.md / README. Work in a fresh clone on a branch
        named after the sub-issue, rt/{{ .Item.number }}-<short-slug> (never the
        parent issue's number), keep the change focused, add tests and run the
        repo's build, test and lint.
        One PR per sub-issue: first look for an open PR for it
        (gh pr list --repo <repo> --state open --search "Closes #{{ .Item.number }} in:body"
        --json number,url,headRefName, and any open PR whose branch starts with
        "rt/{{ .Item.number }}-"). If one exists, check out its branch, push your
        work there and update that PR instead of opening a new one. Otherwise open
        one PR whose body ends "Closes #{{ .Item.number }}".
        Never merge. Reply with the PR URL on the first line.

    - name: implement_rt_ui_deep
      knightRef:
        name: rt-ui
      model: deep
      dependsOn: [plan]
      when: 'json(steps.plan.output).coder == "rt-ui" && json(steps.plan.output).model == "deep" && !json(steps.plan.output).split'
      timeoutSeconds: 3600
      task: |
        Implement this GitHub issue. Input (JSON with repo and issue): {{ .Input }}
        Plan: {{ .Steps.plan.Output }}

        Follow the repo's AGENTS.md / README. Work in a fresh clone on a branch
        rt/<issue>-<short-slug>, keep the change focused, add tests and run the
        repo's build, test and lint.
        One PR per issue: first look for an open PR for it
        (gh pr list --repo <repo> --state open --search "Closes #<issue> in:body"
        --json number,url,headRefName, and any open PR whose branch starts with
        "rt/<issue>-"). If one exists, check out its branch, push your work there
        and update that PR instead of opening a new one. Otherwise open one PR
        whose body ends "Closes #<issue>".
        If the plan's "base" is set, branch from that branch instead of origin/main
        and open the PR against it. If the plan's "breaking" is true, label the PR
        `breaking` (create the label if missing) and add a "Migration" section to
        the body: who must change what, and in which order to roll it out.
        Never merge. Reply with the PR URL on the first line.

    - name: implement_rt_ui_fast
      knightRef:
        name: rt-ui
      model: fast
      dependsOn: [plan]
      when: 'json(steps.plan.output).coder == "rt-ui" && json(steps.plan.output).model == "fast" && !json(steps.plan.output).split'
      timeoutSeconds: 3600
      task: |
        Implement this GitHub issue. Input (JSON with repo and issue): {{ .Input }}
        Plan: {{ .Steps.plan.Output }}

        Follow the repo's AGENTS.md / README. Work in a fresh clone on a branch
        rt/<issue>-<short-slug>, keep the change focused, add tests and run the
        repo's build, test and lint.
        One PR per issue: first look for an open PR for it
        (gh pr list --repo <repo> --state open --search "Closes #<issue> in:body"
        --json number,url,headRefName, and any open PR whose branch starts with
        "rt/<issue>-"). If one exists, check out its branch, push your work there
        and update that PR instead of opening a new one. Otherwise open one PR
        whose body ends "Closes #<issue>".
        If the plan's "base" is set, branch from that branch instead of origin/main
        and open the PR against it. If the plan's "breaking" is true, label the PR
        `breaking` (create the label if missing) and add a "Migration" section to
        the body: who must change what, and in which order to roll it out.
        Never merge. Reply with the PR URL on the first line.

    - name: split_rt_ui
      knightRef:
        name: rt-ui
      model: deep
      dependsOn: [plan]
      when: 'json(steps.plan.output).coder == "rt-ui" && json(steps.plan.output).split'
      timeoutSeconds: 3600
      forEach:
        from: steps.plan
        path: .issues
        uniqueBy: number
        maxItems: 10
      maxParallel: 2
      failurePolicy: failFast
      task: |
        Implement sub-issue #{{ .Item.number }} ({{ .Item.title }}) of {{ .Input }}.

        This task owns sub-issue #{{ .Item.number }} only: do not implement
        the parent issue or other sub-issues.
        Follow the repo's AGENTS.md / README. Work in a fresh clone on a branch
        named after the sub-issue, rt/{{ .Item.number }}-<short-slug> (never the
        parent issue's number), keep the change focused, add tests and run the
        repo's build, test and lint.
        One PR per sub-issue: first look for an open PR for it
        (gh pr list --repo <repo> --state open --search "Closes #{{ .Item.number }} in:body"
        --json number,url,headRefName, and any open PR whose branch starts with
        "rt/{{ .Item.number }}-"). If one exists, check out its branch, push your
        work there and update that PR instead of opening a new one. Otherwise open
        one PR whose body ends "Closes #{{ .Item.number }}".
        Never merge. Reply with the PR URL on the first line.

    - name: review
      knightRef:
        name: rt-lead
      dependsOn: [implement_rt_operator_deep, implement_rt_operator_fast, split_rt_operator, implement_rt_ui_deep, implement_rt_ui_fast, split_rt_ui]
      when: '["implement_rt_operator_deep", "implement_rt_operator_fast", "split_rt_operator", "implement_rt_ui_deep", "implement_rt_ui_fast", "split_rt_ui"].exists(s, steps[s].phase == "Succeeded")'
      timeoutSeconds: 1800
      task: |
        Review the pull request(s) for {{ .Input }}.
        Implementation report:
        {{ .Steps.implement_rt_operator_deep.Output }}
        {{ .Steps.implement_rt_operator_fast.Output }}
        {{ .Steps.split_rt_operator.Output }}
        {{ .Steps.implement_rt_ui_deep.Output }}
        {{ .Steps.implement_rt_ui_fast.Output }}
        {{ .Steps.split_rt_ui.Output }}

        Check correctness, tests, scope and that each PR body ends "Closes #<n>".
        Start your reply with one line "PRs: <url> [<url> ...]" listing every PR.
        End it with exactly one line, either
        "Verdict: ship it" or "Verdict: needs changes".

    - name: fixloop_rt_operator
      dependsOn: [review]
      when: 'steps.review.phase == "Succeeded" && json(steps.plan.output).coder == "rt-operator"'
      loop:
        from: review
        until: 'last.output.matches("(?mi)^\\W*verdict:\\s*ship it\\W*$")'
        maxIterations: 3
        onExhausted: continue
        steps:
          - name: fix
            knightRef:
              name: rt-operator
            model: deep
            timeoutSeconds: 3600
            retry:
              maxAttempts: 1
              backoffSeconds: 60
            task: |
              Fix round {{ .Loop.Iteration }}/{{ .Loop.MaxIterations }} for {{ .Input }}.
              The reviewer asked for changes:

              {{ .Loop.Last.Output }}

              Address every point on the same branch(es), run the repo's build, test
              and lint, push, and reply with a short summary of what changed.
              Do not open new PRs and never merge.
          - name: review
            knightRef:
              name: rt-lead
            timeoutSeconds: 1800
            task: |
              The author pushed fixes for {{ .Input }}:

              {{ .Loop.Last.Output }}

              Re-review the PR(s) listed in the previous review:
              {{ .Steps.review.Output }}

              Start your reply with one line "PRs: <url> [<url> ...]" listing every PR.
              End it with exactly one line, either
              "Verdict: ship it" or "Verdict: needs changes".

    - name: fixloop_rt_ui
      dependsOn: [review]
      when: 'steps.review.phase == "Succeeded" && json(steps.plan.output).coder == "rt-ui"'
      loop:
        from: review
        until: 'last.output.matches("(?mi)^\\W*verdict:\\s*ship it\\W*$")'
        maxIterations: 3
        onExhausted: continue
        steps:
          - name: fix
            knightRef:
              name: rt-ui
            model: deep
            timeoutSeconds: 3600
            retry:
              maxAttempts: 1
              backoffSeconds: 60
            task: |
              Fix round {{ .Loop.Iteration }}/{{ .Loop.MaxIterations }} for {{ .Input }}.
              The reviewer asked for changes:

              {{ .Loop.Last.Output }}

              Address every point on the same branch(es), run the repo's build, test
              and lint, push, and reply with a short summary of what changed.
              Do not open new PRs and never merge.
          - name: review
            knightRef:
              name: rt-lead
            timeoutSeconds: 1800
            task: |
              The author pushed fixes for {{ .Input }}:

              {{ .Loop.Last.Output }}

              Re-review the PR(s) listed in the previous review:
              {{ .Steps.review.Output }}

              Start your reply with one line "PRs: <url> [<url> ...]" listing every PR.
              End it with exactly one line, either
              "Verdict: ship it" or "Verdict: needs changes".

    - name: merge
      knightRef:
        name: rt-lead
      dependsOn: [fixloop_rt_operator, fixloop_rt_ui]
      when: '["fixloop_rt_operator", "fixloop_rt_ui"].exists(s, steps[s].outcome == "Converged")'
      timeoutSeconds: 3600
      task: |
        The review of {{ .Input }} passed.
        {{ with .Steps.fixloop_rt_operator }}{{ if eq .Outcome "Converged" }}Fix rounds: {{ .Iterations }}
        Final review:
        {{ .Output }}{{ end }}{{ end }}
        {{ with .Steps.fixloop_rt_ui }}{{ if eq .Outcome "Converged" }}Fix rounds: {{ .Iterations }}
        Final review:
        {{ .Output }}{{ end }}{{ end }}

        Queue every PR on the review's "PRs:" line with `gh pr merge --auto --squash`
        (approve it first if the repo requires an approval). A queued PR is a
        finished merge: stop as soon as every PR is queued or already merged.
        Never poll or wait for CI or the merge queue to finish.
        Reply with one line per PR, "<url> queued", "<url> queued (position <n>)"
        when the queue position is known, "<url> merged", or
        "<url> closed|blocked: <reason>" when it could not be queued, and report
        the same PRs in the structured prs[] with action "queued" or "merged".
        Then a line "Fix rounds: <n>" and a last line
        "Tiering: implement=<alias the plan chose> fix=deep review rounds=<n>"
        (the alias is in the plan: {{ .Steps.plan.Output }}).

    - name: escalate
      knightRef:
        name: rt-lead
      dependsOn: [fixloop_rt_operator, fixloop_rt_ui]
      when: '["fixloop_rt_operator", "fixloop_rt_ui"].exists(s, steps[s].outcome == "Exhausted") || !["implement_rt_operator_deep", "implement_rt_operator_fast", "split_rt_operator", "implement_rt_ui_deep", "implement_rt_ui_fast", "split_rt_ui"].exists(s, steps[s].phase == "Succeeded")'
      timeoutSeconds: 600
      task: |
        Escalate {{ .Input }} to a human.
        {{ with .Steps.fixloop_rt_operator }}{{ if eq .Outcome "Exhausted" }}The PR(s) still need changes after {{ .Iterations }} fix rounds. Last review:
        {{ .Output }}{{ end }}{{ end }}
        {{ with .Steps.fixloop_rt_ui }}{{ if eq .Outcome "Exhausted" }}The PR(s) still need changes after {{ .Iterations }} fix rounds. Last review:
        {{ .Output }}{{ end }}{{ end }}
        {{ if eq .Steps.review.Phase "Skipped" }}No implementation ran: the plan named no known coder/model. Plan:
        {{ .Steps.plan.Output }}{{ end }}

        Add the label `needs-human` (create it if missing) to the issue and to
        every PR on the last review's "PRs:" line, and comment on each with the
        last review (or the plan) and why it was escalated. Do not merge.
        Reply with the URLs you labelled.
