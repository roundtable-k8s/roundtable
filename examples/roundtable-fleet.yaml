apiVersion: ai.roundtable.io/v1alpha1
kind: RoundTable
metadata:
  name: fleet-a
  namespace: roundtable
spec:
  description: "Personal AI fleet — security, research, infrastructure, and more"

  nats:
    url: nats://nats.database.svc:4222
    subjectPrefix: fleet-a
    tasksStream: fleet_a_tasks
    resultsStream: fleet_a_results
    createStreams: true
    streamRetention: WorkQueue

  defaults:
    model: claude-sonnet-4-20250514
    concurrency: 2
    taskTimeoutSeconds: 120

  # Optional: templates for mission knights. A mission knight whose template
  # says runtime: sandbox is one bare agent-sandbox Sandbox that shuts down
  # when the mission expires (start + ttlSeconds).
  knightTemplates:
    sandboxed:
      runtime: sandbox
      domain: general
      model: claude-sonnet-4-20250514
      skills:
        - general
      nats:
        subjects:
          - "fleet-a.tasks.general.>"

  policies:
    maxMissions: 5
    costBudgetUSD: "50"
