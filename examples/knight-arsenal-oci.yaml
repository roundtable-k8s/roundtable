# Load skills from an OCI image volume instead of a git-sync sidecar.
# The reference must be pinned by digest. Needs a cluster with image volumes
# (Kubernetes 1.35+, or the ImageVolume feature gate on 1.31+).
# Mixed lists work: git and OCI entries in one spec.arsenals list (an empty list
# defaults to the git platform arsenal, so list it explicitly to keep it).
# Skills may use the flat Agent Skills layout (<skill>/SKILL.md at the arsenal
# root): a category folder is optional, and spec.skills names the skill.
# OCI arsenals mount at /arsenal-oci/<name>. Set `name` explicitly: the default
# is the image basename, which can collide with the default git arsenal.
# Existing Knights have `repo` saved from the old CRD default: remove
# `repo` before adding `oci` to the same entry (oci and repo are exclusive).
apiVersion: ai.roundtable.io/v1alpha1
kind: Knight
metadata:
  name: arsenal-oci
  namespace: roundtable
spec:
  domain: security
  model: claude-sonnet-4-20250514
  skills:
    - security
  nats:
    url: nats://nats.database.svc:4222
    stream: fleet_a_tasks
    resultsStream: fleet_a_results
    subjects:
      - "fleet-a.tasks.security.>"
  arsenals:
    - name: platform
      oci:
        reference: registry.example.com/roundtable/arsenal@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        pullPolicy: IfNotPresent
